# 博物馆导游辅助器：Host 半片提供逐字稿项目存储、字数审核、导出与 Agent 工具，
# 浏览器半片提供左侧栏「博物馆导游」面板。
- insert:
    - id: museum-guide
      name: 'dsh-museum-guide'
      config:
        # 项目与导出文件放在这里；留空用 ~/.dsh/museum-guide。
        dataDir: ''
        # 逐字稿目标字数与下限：低于下限审核不通过。
        targetChars: 50000
        minChars: 45000
        # 开场允许的字数上限（约 5 分钟）。
        introMaxChars: 1300
        # 折算讲解时长用：每分钟约多少字。
        charsPerMinute: 420