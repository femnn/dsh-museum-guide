<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>苏州考古博物馆 · 讲解</title>
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#2a211a;--muted:#8a7a66;--line:#e4d8c5;--brand:#9a5b2c;--ok:#2f7a4f}
@media (prefers-color-scheme:dark){:root{--bg:#15120f;--card:#211c17;--ink:#f2e9dc;--muted:#b3a28c;--line:#3a2f24;--brand:#e0a25e;--ok:#77c79a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.top h1{margin:0;font-size:19px;letter-spacing:.02em}
.top .meta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);font-size:11px}
.hint{margin:2px 16px 10px;font-size:12px;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:8px;padding:0 12px 28px}
.floor{font-size:11px;letter-spacing:.1em;color:var(--muted);padding:10px 6px 2px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.stop.active{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.stop .num{width:26px;flex:0 0 26px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .body{flex:1 1 auto;min-width:0}
.stop .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .v{font-size:11px;color:var(--ok);white-space:nowrap}
.play{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--brand);background:transparent;color:var(--brand);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;-webkit-touch-callout:none;user-select:none}
.play.on{background:var(--brand);color:var(--bg)}
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
.reader.open{display:flex}
.rhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.rhead .row1{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
.rhead h2{margin:0;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .meta{font-size:11.5px;color:var(--muted);margin-top:6px;padding-left:50px}
.ractions{display:flex;gap:8px;margin-top:10px;padding-left:50px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 12px;font-size:13px;font-family:inherit;-webkit-touch-callout:none;user-select:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--bg);font-weight:600}
.rbody{flex:1 1 auto;overflow:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.part{margin:0 0 22px}
.part h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.text{font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.videos{margin-top:10px;display:flex;flex-direction:column;gap:6px}
video-link,.vlink{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.vlink .plat{flex:0 0 auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.vlink .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{padding:8px 16px 24px;font-size:11px;color:var(--muted)}
</style>
</head>
<body>
<header class="top">
  <h1>苏州考古博物馆</h1>
  <div class="meta"><span class="badge">50,028 字</span><span>12 站</span><span>9 条视频</span></div>
</header>
<p class="hint">按参观顺序排列。点展厅看文字，点 ▶ 直接朗读。</p>
<main class="route" id="route"></main>

<section class="reader" id="reader">
  <div class="rhead">
    <div class="row1">
      <button type="button" class="back" id="back" aria-label="返回">‹</button>
      <h2 id="rtitle"></h2>
    </div>
    <div class="meta" id="rmeta"></div>
    <div class="ractions">
      <button type="button" class="btn primary" id="rplay">▶ 朗读</button>
      <button type="button" class="btn" id="rstop" style="display:none">⏹ 停止</button>
      <button type="button" class="btn" id="rcopy">复制这段</button>
    </div>
  </div>
  <div class="rbody" id="rbody"></div>
</section>
<script>
const DATA = {"museum": "苏州考古博物馆", "city": "苏州", "stops": [{"no": "01", "floor": "一层", "label": "入口廊桥 · 服务大厅", "note": "历代墓砖铺地 · 12 米夯土墙", "section": "序厅：一条砖路与一面土墙", "parts": ["序厅：一条砖路与一面土墙", "建筑细读：从土里长出来的房子", "瓦当与滴水：屋顶上的细节"]}, {"no": "02", "floor": "一层", "label": "江海共潮生", "note": "地理与三山岛", "section": "江海共潮生：一块被水改写过的地", "parts": ["江海共潮生：一块被水改写过的地", "三山岛的一天：一万年前的苏州人"]}, {"no": "03", "floor": "一层", "label": "手铲释天书", "note": "考古工具与地层", "section": "手铲释天书：土是书，工具是笔", "parts": ["手铲释天书：土是书，工具是笔", "探方日记：发掘现场的三十天"]}, {"no": "04", "floor": "一层", "label": "考古见姑苏", "note": "草鞋山剖面", "section": "考古见姑苏（上）：一面剖开的土墙", "parts": ["考古见姑苏（上）：一面剖开的土墙", "草鞋山：一座土丘里的七千年", "考古见姑苏（中）：一座城的两千五百年", "平江图：一张八百年前的city map", "城门与水关：苏州的进出口", "考古见姑苏（下）：一片瓦，一个字", "金城新村：一片瓦定下的郡治"]}, {"no": "05", "floor": "负一层", "label": "文明溯源", "note": "从平等到等级", "section": "文明溯源（上）：从平等到等级", "parts": ["文明溯源（上）：从平等到等级", "崧泽彩陶罐：一只罐上的画", "文明溯源（下）：一块田，一堆石头", "良渚玉琮：神人兽面的秘密", "良渚古城与水利"]}, {"no": "06", "floor": "负一层", "label": "吴越新证", "note": "青铜剑与楚量器", "section": "吴越新证（上）：天下最好的剑", "parts": ["吴越新证（上）：天下最好的剑", "青铜剑：一把剑的铸造", "吴越战船：水上的军队", "吴越新证（下）：一只量器与春申君"]}, {"no": "07", "floor": "负一层", "label": "都会寻踪", "note": "孙吴一号墓", "section": "都会寻踪（上）：把一座墓搬进博物馆", "parts": ["都会寻踪（上）：把一座墓搬进博物馆", "孙吴大墓：九十吨的搬家", "六朝青瓷：南方的颜色", "都会寻踪（中）：一支龙首金钗", "龙首金钗：一对钗的分离", "都会寻踪（下）：过日子用的东西", "铜镜：一面镜子的背面", "磨喝乐：宋代的陶玩具", "唐三彩粉盒：一只盒子里的唐代", "明金戒指：一枚戒指的一生", "陶骆驼：从苏州到西域"]}, {"no": "08", "floor": "负一层", "label": "海丝遗痕", "note": "瓷器与港口", "section": "海丝遗痕（一）：城北的一把窑火", "parts": ["海丝遗痕（一）：城北的一把窑火", "元青花：一船蓝色的瓷器", "海丝遗痕（二）：太仓的瓷器仓库", "海丝遗痕（三）：一只高丽青瓷碗", "黄泗浦：鉴真从这里出海", "海丝遗痕（四）：从黄泗浦出海"]}, {"no": "09", "floor": "负一层", "label": "我们的姑苏城", "note": "古城考古临展", "section": "我们的姑苏城：街巷下面的城", "parts": ["我们的姑苏城：街巷下面的城", "考古摄影与三维扫描", "文物库房：博物馆的另一半"]}, {"no": "10", "floor": "户外", "label": "下沉广场", "note": "文保修复展示区", "section": "下沉广场：井、柱础与露天的文物", "parts": ["下沉广场：井、柱础与露天的文物", "陶井圈：古代的供水系统", "一块墓砖上的年号", "市河与码头：苏州的水上交通"]}, {"no": "11", "floor": "户外", "label": "文保修复室", "note": "修复与库房", "section": "文保修复室：让它活得久一点", "parts": ["文保修复室：让它活得久一点", "幕后：二十三个人的考古所", "陶器修复：把碎片拼回去", "三次十大：苏州考古的二十年"]}, {"no": "12", "floor": "户外", "label": "教育探索宫", "note": "研学与模拟发掘", "section": "教育探索宫：把铲子交给下一个人", "parts": ["教育探索宫：把铲子交给下一个人"]}], "sections": [{"id": "h2", "title": "序厅：一条砖路与一面土墙", "text": "进门之前，请先低头看一眼脚下。\n\n从停车场走过来那条廊桥，地面不是普通石材，是一块一块的墓砖。六朝的、隋唐的、宋元的、明清的，规格不同，厚薄不一，有的侧面还留着模印的莲花纹和吉语。这些都是苏州各个考古工地出土的墓砖，发掘结束、资料记完，砖被搬到这里，铺成一条路。我们平时进博物馆，脚下踩的是大理石；在这里，脚下踩的是两千年来苏州人给逝者砌墙用的砖。这条路本身就是展品，只是它不挂在墙上。\n\n再抬头看这栋建筑。它没有传统博物馆那种对称的大屋顶，也没有玻璃盒子式的现代造型，而是一组粗粝的三角形块面拼在一起，像从土里拱出来的。设计它的程泰宁院士，取的原型是越城遗址出土的两件石器：石锛和钺。锛是砍削木头的工具，钺是带弧刃的兵器，也是权力的象征。五千年前的人用这两样东西开垦这片土地；五千年后，博物馆把自己做成这两件石器的样子。所以你在外面看到的那些斜面、锐角、夯土般的质感，不是造型趣味，是考古学家在这片地里挖出来的东西的形状。\n\n走进服务大厅，正前方是一面十二米高的墙。这面墙不是刷出来的颜色，而是按真实考古地层的剖面做的：一层黄、一层灰、一层黑，每一层代表一个时期。最下面是被水浸泡过的青灰色淤土，往上渐渐变黄，再往上是唐宋的文化层，夹杂着瓦砾和瓷片。考古队员在野外看到的“土”，就是这样的土；他们靠土的颜色、质地、包含物来判断年代。现在这面墙被放大到十二米高，你站在底下往上看，会有一种被人从地层里翻出来的错觉。这个展项没有一件文物，但它是全馆最重要的一件“展品”，因为它告诉你：考古不是挖宝，是读土。\n\n大厅右转，去一层的“源起江南”展厅。进门前，我少说两句越城遗址。这个遗址就在馆的东北方向，是省级文物保护单位，年代从春秋一直延续到六朝。苏州这地方，水多、土软、地下水位高，木头和骨头能留下来的不多，但恰恰因为水泡着、缺氧，很多东西反而保存得比干燥地区更好。越城一带出土过建筑构件、井圈、生活陶器，说明这里不是荒地，是一座有城墙、有街巷、有手工业的城。博物馆选址在这里，不是找一块空地盖房子，是让房子回到它讲述的那段地层旁边。\n\n还有一件事值得说。开馆前，馆里的人把苏州各个工地出土的墓砖调过来铺路，一块一块编号、记录、再铺上去。你走过去只要十秒钟，他们在工地上一块一块起砖、打包、运输、归位，花的是几个月。考古工作大部分时候就是这样：成果看起来安静，过程全是琐碎。等一下在“手铲释天书”那一厅，你会看到这些琐碎的工具；先在这里记住这条砖路，它是那些工具的直接产物。", "chars": 1026, "videos": [{"platform": "douyin", "title": "苏州考古博物馆探馆：江苏省首座考古专题博物馆", "url": "https://www.douyin.com/video/7509631030123679002", "note": "探馆向，先看空间和动线"}, {"platform": "bilibili", "title": "【展开看看】场地太够用了，那就主题化叙事吧！苏州考古博物馆", "url": "https://www.bilibili.com/video/av115553125532786/", "note": "从展陈叙事角度讲这座馆怎么讲故事"}]}, {"id": "h24", "title": "建筑细读：从土里长出来的房子", "text": "看完了序厅，我们再退回来，好好看看这栋房子本身。因为它不是一个装展品的盒子，它自己就是第一件展品。\n\n先说外形。这栋建筑没有传统博物馆常见的那种对称大屋顶，也没有全玻璃的现代方盒子，而是一组粗粝的三角形块面，斜着、立着、互相咬着，从地面往上长。设计它的程泰宁院士，取的原型是越城遗址出土的两件石器：石锛和钺。石锛是砍削木头的工具，长方形，一头有刃；钺是带弧刃的兵器，也是权力的象征。把这两件五千年前的工具放大成建筑，这个想法听着抽象，站在外面看就明白了：那些斜面是石锛的刃口，那些转折是钺的弧线。建筑用现代钢结构撑着，外面做夯土肌理，远看像从土里拱出来，近看能摸到模板留下的木纹和颗粒。\n\n再看入口。从停车场到大门，要过一条廊桥。桥面铺的不是石材，是一块块墓砖，六朝的、唐宋的、明清的，规格不一，颜色深浅不同。这些都是苏州各个考古工地出土的墓砖，发掘结束、资料记完，砖被调到这里，编好号，一块块铺上去。你低头走这十几米，脚下是两千年来苏州人给逝者砌墙用的砖。这条路本身没有展签，但它是全馆最直接的一件展品：它告诉你，考古不是把东西锁进柜子，是让东西回到人能走到的地方。\n\n进门，正对着一面十二米高的墙。这面墙按真实考古地层的剖面做：最下面是青灰色淤土，往上是黄色的生土，再往上是唐宋文化层，夹杂瓦砾和瓷片。颜色不是画上去的，是用不同配比的土和骨料一层层夯出来的，所以有的地方粗，有的地方细，光打上去有深浅。这个展项一件文物都没有，但它是全馆的\"定调之作\"：考古读的第一本书，是土。\n\n抬头看屋顶。大厅顶部开了几道天窗，光从斜上方落下来，正好扫在那面夯土墙上。上午的光偏冷，下午偏暖，墙的颜色跟着变。这是设计时特意做的：让自然光参与展陈，让时间在墙上走。你在馆里待得越久，越能感觉到光在移动。\n\n动线也值得说一句。一般的博物馆是回字形，绕一圈回到起点；这座馆不是。一层是\"疏可走马\"，展柜之间留得很宽，中间插几个中岛式展台，顶上的空间全部让出来，保留建筑的光影；负一层反过来，\"密不透风\"，展柜一排挨一排，像考古的探方，一格一格往里走。一疏一密，是两种看展的节奏：一层让你站远一点看整体，负一层让你凑近一点看细节。\n\n还有一个细节：建筑的高度压得很低。占地一万平方米，建筑面积八千九百七十二平方米，只有地面一层加地下一层，没有往高处拔。为什么？因为旁边就是越城遗址，就是石湖的山水。房子太高，会把遗址和湖景压住。程泰宁把体量压下来，让建筑蹲在土里，把天际线让给山和水。这个选择，本身就是对遗址的态度。\n\n你站在大厅里往门外看，能看见石湖的一角。范成大晚年住在石湖，号\"石湖居士\"，写《四时田园杂兴》，写的就是这一带的田、水、桑、麻。八百年前他看见的景，和今天差不太多：湖还在，堤还在，田换成了景区。博物馆把自己放在这个景里，不是偶然。\n\n所以看这座馆，建议你留十分钟，什么都不看，就站在大厅里，看墙、看光、看门外那片水。看完这些，再进厅看文物，你会明白一件事：这座馆讲的是\"考古\"，而它自己，就是用考古的方式造出来的——从土里取形，从遗址取色，从地层取光。", "chars": 1261, "videos": []}, {"id": "hx22", "title": "瓦当与滴水：屋顶上的细节", "text": "这一节，我们抬头看屋顶。\n\n中国古建筑的屋顶，铺瓦。瓦有两种：筒瓦和板瓦。筒瓦是半圆形的，盖在两行板瓦之间；板瓦是弧形的，一行压一行。瓦的尽头，有\"瓦当\"和\"滴水\"。\n\n瓦当，是筒瓦最下面那一块，圆形或半圆形，挡在屋檐前。它的作用，是保护椽头，不让雨水泡烂；也是装饰，上面有纹饰、有文字。战国的瓦当，多是饕餮纹、云纹；秦汉的瓦当，多是\"长乐未央\"\"千秋万岁\"这样的吉语；唐代的瓦当，多是莲花纹。\n\n滴水，是板瓦最下面那一块，三角形，尖朝下。它的作用，是让雨水顺着尖滴下去，不回流到屋檐里。一滴水，一块瓦，都是\"防水\"的设计。\n\n瓦当的纹饰，能看出时代和等级。秦代的\"右\"字瓦当，是官署；汉代的\"长乐未央\"瓦当，是宫殿；唐代的莲花瓦当，是寺庙。一块瓦当，能定位一座建筑的性质。\n\n瓦当的制作，是模制：先刻范，再压泥，再烧。范有母范、子范，可以批量生产。一块瓦当，不大，但工艺不简单：纹饰要清晰，边轮要规整，烧成要不变形。\n\n你在这间展厅看到的\"右\"字瓦当，就是金城新村出土的。一个\"右\"字，把秦代的官署，钉在了苏州。屋顶上的一块瓦，成了历史的路标。\n\n瓦当还会\"说话\"。有的瓦当上，有工匠的名字、有窑场的字号、有年号。这些字，是\"签名\"，也是\"档案\"。一块瓦当，可能记录了一个人、一个窑、一个朝代。\n\n古建筑的屋顶，是最容易被忽略的地方。我们看房子，看墙、看门、看窗，很少看屋顶。但屋顶，是房子最\"贵\"的部分：瓦要烧，木要架，脊要砌。一个时代的建筑水平，看屋顶就知道。\n\n你走出博物馆，抬头看看老房子的屋顶。那些瓦当、滴水，可能已经换过几茬，但样子还是老样子。一块瓦，传了两千年。", "chars": 671, "videos": []}, {"id": "h3", "title": "江海共潮生：一块被水改写过的地", "text": "“源起江南”的第一篇章叫“江海共潮生”。名字听着文气，讲的其实是一件很实在的事：苏州这块地，是先有海，再有湖，最后才有人。\n\n进门是一面很大的投影，水在墙上流，一会儿是浑黄的潮水，一会儿是安静的湖面。别急着走，先看它想说什么。现在的苏州，湖荡棋布、河港纵横，太湖在东边、阳澄湖在中间、澄湖在南边，大大小小几百个湖。可一万年前不是这样。那时候海平面比现在低一百多米，太湖还是个浅洼地，长江的入海口在现在很远的地方。后来气候变暖，海水漫上来，长江带来的泥沙在浅海里堆出一条条沙堤，地质上叫“冈身”。冈身以东是海，以西是潟湖和沼泽。苏州人后来赖以生存的这片水网平原，就是在那几千年里，一点一点从海里长出来的。\n\n展柜里那些动物骨骼，是这个过程的旁证。大象、犀牛、鹿这类动物，当年在这一带活动，说明气候比现在暖湿；后来环境变了，它们退场，人也跟着换活法。你看着这些骨头会有点恍惚：它们埋在现在的市中心地下几米深的地方，上面压着的是马路、小区和地铁。\n\n真正把苏州人的历史往前推一大截的，是三山岛。\n\n三山岛在太湖里，属吴中区。上世纪八十年代，考古队在岛上发现了打制石器。石片、石核、刮削器，都是典型的旧石器时代做法：拿一块燧石，用另一块石头敲，敲出锋利的刃口。这是长江下游、太湖地区第一次发现旧石器文化遗存，把苏州有人类活动的历史，推到了一万年以前。展柜里那几件石器，看上去就是几块不起眼的石头，边缘有打击疤。可你要知道，那是人在这个地球上留下的、最早的“手艺”之一。一万年前的人不会种地、不会烧陶，他们靠打猎、捕鱼、采集过日子；一块打好的石片，就是刀、就是斧、就是全部家当。\n\n再往后，水退了，湖定了，人开始在这片土地上定居。定居的关键不是房子，是稻子。\n\n这一组展柜讲稻作。草鞋山遗址出土过六千年前的水稻田，有水田、有水沟、有田埂，还有炭化的稻粒。你仔细看那些黑黑的颗粒，形状还看得出是稻谷，一头尖一头圆。它们是被火烧过、又被水泡过，才留到今天。稻作意味着什么？意味着人不再跟着食物跑，而是守着一块田，春种秋收；意味着要有固定的村子，要有存粮的仓库，要有分地界的规矩。苏州后来成为“鱼米之乡”，根子就在这几粒黑稻子上。\n\n墙上有一组地貌对比图：史前的冈身、潟湖，和今天的湖网、圩田。看的时候注意一件事：太湖不是天生就这么大的，它是慢慢扩张的；苏州的很多湖，原来是陆地，后来被水淹了；也有一些地方，原来在水下，后来被泥沙填成了田。人和水在这片土地上拉锯了几千年，谁也没彻底赢。博物馆把这个拉锯过程放在最前面，是很有道理的：你不懂这片水，就不懂苏州人为什么把房子盖在墩上、为什么把墓埋在髙地、为什么城要修成水陆双棋盘。\n\n说到水养出来的人，这一厅里偶尔会借展一件重器。开馆那年，吴王夫差剑曾经在这里短暂露过面，展期只有一个月。剑不长，剑身有暗格的菱形纹，剑格上嵌着绿松石，靠近剑首的地方刻着“吴王夫差自作用剑”一类的话。这把剑是吴国最强盛的时候造的，而吴国的中心，就在今天的苏州。一把剑放在“江海共潮生”里，用意很清楚：这片水养出了稻子，也养出了能铸这种剑的国家。\n\n看完这一厅，你会带走一个印象：苏州不是一座从来就有的城，它是一块被水反复改写过的地。人在这块地上，先学会看水，再学会用土，最后才学会筑城。", "chars": 1331, "videos": []}, {"id": "h25", "title": "三山岛的一天：一万年前的苏州人", "text": "这一节，我们把时间拉到一万年前，去太湖里的一座小岛上过一天。\n\n这座岛叫三山岛，在太湖东南，属吴中区。岛不大，三座小山连在一起，最高处几十米。上世纪八十年代，考古队在岛上做调查，在一个叫清风岭的坡地上，捡到了几块石头。石头有打击疤，边缘锋利，不是天然碎的，是人打出来的。后来正式发掘，出土了一批石制品：石核、石片、刮削器、尖状器。这是长江下游、太湖地区第一次发现旧石器时代文化遗存，把苏州有人类活动的历史，推到了一万年以前。\n\n你先看展柜里那块石核。拳头大小，一面是光滑的石皮，一面是几道纵向的疤。那是有人拿着一块鹅卵石，找准一个台面，用另一块石头\"啪\"地敲下去，崩下一片石片，留下这道疤；再敲，再崩一片。崩下来的石片，边缘薄而利，就是刀。石核本身是\"母体\"，石片是\"产品\"。这块石核上的疤，一道一道，是同一个人的手，重复同一个动作留下的。\n\n再看那片刮削器。比手掌小，一边是钝的，可以握；一边是斜刃，刃口有细密的锯齿。它是用来刮的：刮兽皮上的肉和脂肪，刮木头表面的树皮，刮骨头上的筋。一万年前没有金属，石头就是全部的工具库。一把石片，可以当刀、当锯、当凿；用钝了，再打一片。你今天在厨房里用的一把刀，功能上跟它差不多，只是材料换了。\n\n我们可以想象三山岛的一天。\n\n天刚亮，岛上起雾，湖面白茫茫的。人从用树枝和兽皮搭的窝棚里出来，先看火堆。火是昨天留下的，用灰埋着，扒开还有红炭。添几根干柴，吹一吹，火起来了。火是那时候最重要的东西：取暖、烤肉、驱兽、照亮。守火，是整群人共同的事。\n\n男人出去打猎。太湖边有鹿、野猪、獐子，还有水鸟和鱼。打猎靠的不是力气，是耐心和配合：几个人围一个圈，把鹿往湖边的浅滩赶，鹿陷进泥里，再用石矛、木棒解决。捕鱼更简单，用骨制的鱼钩、鱼叉，或者在浅水里用石头围一个\"迷魂阵\"，鱼进来了就出不去。女人和孩子在营地附近采集：野果、坚果、块根、鸟蛋。哪一样能吃、什么时候成熟，全靠一代一代传下来的经验。\n\n中午，太阳高了，人回到营地。把鹿肉割开，架在火上烤。没有锅，没有盐，肉烤得半生不熟，但很香。吃完，男人开始打石器，女人处理兽皮，孩子在水边玩。打石器的地方是固定的，因为石核、石片、碎屑要集中，方便下次再用。考古队在一个地点发现大量石片和碎屑，就知道那里是\"加工场\"。\n\n下午，可能有人去湖边拣石头。太湖边有的是鹅卵石，但不是什么石头都能打。要选质地细腻、敲起来声音清脆的，比如燧石、石英岩。选石头，是打石器的第一步，也是最重要的一步。选错了，一敲就碎。这种\"看石头\"的本事，今天叫\"辨识原料\"，一万年前就在用。\n\n傍晚，雾又起来了。人围着火，分吃剩下的肉。有人用骨针缝兽皮，有人用石片刮木棍。天黑得很快，火光照着几张脸。没有文字，没有陶器，没有房子，只有火、石头、兽皮和彼此。但他们会说话，会讲故事，会把打石器的办法教给孩子。文化，就是从这些火堆边开始的。\n\n夜里，火慢慢小下去。有人起来添柴。湖面上有风，远处有兽叫。这一夜过去，明天还是打猎、采集、打石器。\n\n你可能会问：这样的日子，跟我们有什么关系？关系在于，这是\"苏州人\"最早的样本。在农业出现之前，在城出现之前，在这片土地还是一片湖荡的时候，已经有人在这里生活。他们留下的东西很少——几块石头、一些骨头——但足够证明一件事：这片土地上的人，不是后来才来的，是一万年前就在了。\n\n展柜旁边有一张地图，标着三山岛的位置和周围的水系。你可以看到，一万年前的海岸线比现在远，太湖比现在小，三山岛可能跟陆地连在一起。后来水涨了，岛才成了岛。地理在变，人在适应。人不是征服自然，是跟着自然改自己的活法。\n\n从三山岛往后的几千年，气候变暖，水退了，湖定了，人开始种稻子。下一节，我们去看那块六千年前的稻田。", "chars": 1515, "videos": []}, {"id": "h4", "title": "手铲释天书：土是书，工具是笔", "text": "第二篇章叫“手铲释天书”。天书是什么？是埋在地下的、没有文字的那部分历史。释读它的工具，就挂在墙上。\n\n一整面墙，挂的都是真家伙：探铲、手铲、卷尺、罗盘、记录本、毛刷、竹签、标本袋。最左边那把探铲，北方叫洛阳铲，一截铁头接一根可加长的木杆。它干的活很朴素：往地下打一个直径十几厘米的孔，把土带上来。考古队员看什么？看土的颜色、湿度、松紧，看里面有没有炭屑、红烧土、碎陶片。打十几个孔，把土样在脑子里连成一张剖面图，就知道地下大概埋着什么、有多深、范围多大。这一手功夫，全靠经验和手感，仪器替代不了。\n\n墙下方那张桌子，摆的是一份完整的田野考古记录：探方日记、平剖面图、器物登记表、照片编号。字是手写的，图是铅笔画的，比例尺、指北针、日期一样不少。你可能会问，现在都有相机、有三维扫描了，为什么还手画？因为画的过程就是观察的过程。一笔下去，你得判断这条线是土色边界还是阴影，是灰坑的口还是后来打破它的沟。手画一遍，脑子才真的记住。考古界有句话：没记录，等于没挖。挖掉的地层不会再有第二次，记录是唯一的现场。\n\n往里走，是一个按比例缩小的探方。五米见方，四壁留着“隔梁”，像一块切开的蛋糕。壁上能看到分层：最上面是耕土，下面是近现代扰土，再往下是明清、宋元、唐宋，一层压一层。考古学管这个叫“地层学”：晚的在上，早的在下，除非后来有人挖坑把它翻了。还有一种关系叫“打破”：一个灰坑切穿了下面的地层，那灰坑一定比地层晚。判断早晚，靠的就是这两条规矩，听起来简单，做起来极难——因为土的颜色差别可能只有一点点，太阳一偏就看不出来。\n\n这一厅还有一组土样，装在透明柱子里，旁边是不同质地的土块。有些可以上手摸：沙土、黏土、夯土、淤土。摸一下就知道，为什么考古队员总说“土会说话”。夯土硬、有层理；淤土细、发青；烧土发红、带孔隙。一个遗址里，这三种土往往挨在一起：夯土是墙，淤土是洪水或池塘，烧土是灶或窑。你摸过一遍，再看展柜里的遗迹照片，就能看懂那些黑白图上的线。\n\n再往里的展柜，讲的是土出来以后的事。陶片从工地回来，先洗、再编号、再拼对。一个探方几千片陶，能拼成完整器的可能只有几件。拼的时候按口沿、腹片、底片分类，按纹饰、陶质排队，像拼一幅没有参考图的拼图。拼出来之后是修复：粘接、补配、做旧，缺的部分用石膏补上，但绝不画花纹冒充原件。你在展柜里看到那些“半真半补”的陶器，补的部分颜色略浅，就是为了让你一眼分清哪是原件、哪是修复。\n\n沿墙的通柜，按材质排过去：陶、瓷、漆木器、青铜器、玉石器。每一类旁边都标着常见的病害：陶器会酥粉、瓷器会脱釉、漆木器会干裂变形、青铜器会生绿锈甚至“青铜病”、玉器会沁色。这些词听着专业，其实说的都是同一件事：东西从埋藏环境里出来，见了光、见了空气，就开始坏。所以文保人员的工作，一半是修，一半是“稳住”——控制温湿度、控制光照、做囊匣、做支撑，让它坏得慢一点。\n\n科技考古的部分在这一厅的尽头。碳十四测年，靠的是有机物里碳的衰变；热释光，测的是陶器最后一次受热到现在多久；同位素分析，看锶、铅、氧、碳、氮、硫的比例，能推断一个人小时候喝哪里的水、吃什么、在哪里长大。这些话听起来像物理课，但落到具体问题上很动人：比如一块人骨，锶同位素告诉你他不是本地人，那他为什么埋在苏州？是嫁过来的、打过来的，还是做生意的？考古学就是这样，用仪器回答很朴素的问题：这个人是谁，他从哪来，他吃什么。\n\n这一厅走完，你应该明白一件事：考古的大部分时间不在“挖”，在“记”和“读”。土是书，工具是笔，耐心是全部。", "chars": 1446, "videos": []}, {"id": "h26", "title": "探方日记：发掘现场的三十天", "text": "这一节，我们跟着一支考古队，过一次\"探方里的三十天\"。\n\n假设春天，苏州城外一片要修路的空地。地表是草，下面是历代堆积。考古队先进场，做第一件事：钻探。两个人一组，一个人扶探铲，一个人提土。探铲是根铁杆，一头是半圆形的铲头，往地下打，提上来带出一管土。看土的颜色、湿度、夹杂物，判断下面有没有东西。一天打几十个孔，把土样在图纸上标出来，连成一片，就知道遗址的范围和深度。\n\n钻探之后是布方。把要发掘的区域划成五米见方的格子，叫探方。方与方之间留一米宽的隔梁，用来走路、观察剖面。为什么是五米？太小了看不到遗迹的整体，太大了土方量吃不消。五米，是几十年经验攒出来的尺寸。\n\n布方之后，开工。第一天不是挖，是\"找边\"。把表层的耕土刮掉，露出下面的黄褐色土。这时候要非常小心，因为真正的遗迹可能就在下面几厘米。手铲斜着刮，一层一层，刮下来的土堆在一边。刮到土色变了，出现一个圆形的边界，可能就是一座灰坑；出现一条直边，可能就是一道墙。\n\n第二天到第十天，是\"做遗迹\"。一座灰坑，先清出一半，保留另一半做剖面，看它的形状、深度、堆积分层。清的时候用小手铲、竹签、毛刷。一件陶片出来了，先不急着拿，要拍照、量坐标、编号、装袋。为什么这么麻烦？因为器物的位置本身就是信息：它在坑底还是坑口，跟哪些东西在一起，决定了它是什么年代、什么用途。\n\n第十一天到第二十天，是最磨人的阶段：画图。每一个遗迹都要画平面图、剖面图，比例尺一比二十。画图不是照抄，是判断：这条线是土色边界还是阴影？这个凹进去的地方是原来的形状还是后来扰动？画错一笔，后面的判断全错。所以考古队员的图，常常要改好几遍。\n\n第二十一天到第二十五天，清理墓葬或房址。墓葬最讲规矩：先找墓口，再清填土，露出人骨和随葬品。人骨很脆，要用竹签一点点剔，剔完刷一层胶加固。随葬品原位拍照，画图，然后整体起取。起取的时候，用石膏和绷带把整块土包起来，像给病人打石膏，运回实验室再慢慢清。\n\n第二十六天到第三十天，收尾。探方要回填，但回填之前要\"看最后一眼\"：把四壁的剖面再检查一遍，确认没有漏掉的层位；把隔梁上的关键剖面拍照；把所有的记录本、图纸、照片、标本对一遍编号。少一个编号，以后就找不到东西。考古界有句话：发掘是破坏，记录是补救。挖掉的地层不会再有第二次。\n\n这三十天里，最不起眼的工具是那本田野记录本。牛皮纸封面，里面是横线格。每天写：天气、人员、工作内容、发现、疑问。字迹大多潦草，因为是在工地上蹲着写的。但这本本子，是以后写报告、写论文、做展览的全部底稿。博物馆里那些漂亮的展签，源头就是这些潦草的字。\n\n你在这间展厅看到的探方模型，就是这三十天的结果：一个五米的方，四壁留着剖面，底面平着，角落里放着一把没用完的竹签。它看起来安静，其实每一厘米都被摸过、量过、画过。\n\n下一节，我们去看考古队从土里\"读\"出来的东西：一粒六千年前的稻子。", "chars": 1175, "videos": []}, {"id": "h5", "title": "考古见姑苏（上）：一面剖开的土墙", "text": "“考古见姑苏”这一厅，进门正对着的是一面墙。不是展柜，是一整面被剖开的土。\n\n这是草鞋山遗址的地层剖面，一比一复原。草鞋山在唯亭，离这儿三十多公里，是苏州最有名的一处史前遗址。上世纪七十年代开始发掘，挖出了水稻田、房址、墓葬，也挖出了一整套从马家浜、崧泽、良渚、马桥一直到吴越文化的连续堆积。考古界把它叫作“江南史前文化标尺”——意思是一把尺子，江南别的遗址挖出来，年代对不对，拿它比一比就知道。\n\n站远一点看这面墙。最下面是一层灰黑色的湿土，那是马家浜人活动的地面；往上有一层带红烧土的堆积，是房子倒了、灶塌了；再往上是崧泽的灰坑和墓葬；再往上是良渚那一层，颜色发黄，夹杂着大块的墓坑填土；最上面是马桥和吴越的硬陶片层。每一层都能看到一条不规则的边界，像树桩的年轮。考古队员就是靠这些边界判断“谁压在谁上面”，一层一层往下读。\n\n墙上嵌着几个“抽屉”，里面是这一层出土的典型器物。马家浜那一层，最醒目的是腰檐陶釜：一个圆底的大锅，口沿外面加了一圈宽檐，像给锅戴了顶草帽。为什么这么设计？因为它是架在灶上煮东西的，宽檐能挡住溢出来的汤水，也能让热气少跑。这个设计在今天看来很聪明，七千年前的人已经想到了。旁边是红衣陶豆，高柄的托盘，红陶衣上还留着打磨的光。豆是盛食物的，说明那时候的人已经开始讲究“怎么把饭摆上桌”。\n\n崧泽那一层，最好看的是彩绘陶罐。陶罐不大，腹部用红彩和黑彩画着弧线、圆点、编织纹。你凑近看，线条很稳，不是随手涂的；画的时候陶坯还是湿的，画完再烧，颜色就咬在胎上。崧泽人已经不只满足于“能用”，他们要在器物上留下图案。这些图案什么意思？可能是记号，可能是信仰，也可能只是好看。考古学家不敢乱猜，但可以确定一件事：人开始有余力去装饰生活了。\n\n良渚那一层，玉器上场。展柜里那件玉璧，青绿色，中间一个圆孔，表面打磨得像镜子，边缘有一圈细细的凹槽。玉璧在良渚文化里不是装饰品，是礼器，出现在高等级墓葬里，和玉琮配成一套。玉琮是外方内圆的柱体，四面刻着神人兽面纹：上面是一个戴羽冠的人，下面是兽的眼睛和獠牙。这个图案在良渚分布范围内反复出现，说明它不是一个部落的记号，是一个共同信仰的标志。能调动人力开采玉料、雕刻、祭祀，背后一定有一个已经分层的社会。\n\n从良渚往上，是马桥文化。陶器变了：器壁变薄、火候变高，出现了硬陶和原始瓷。硬陶是用含铁量高的黏土、在更高温度下烧出来的，敲起来声音清脆。再往上是吴越的几何印纹硬陶，表面拍印着回纹、云雷纹、席纹。为什么突然流行拍印？因为快。拍印一个模子能复制一片，产量上去了，说明用的人多了、交换多了。器物的变化，背后是社会的节奏在加快。\n\n看完墙，往右走，是一个单独的展柜，光线压得很暗。里面躺着一具人骨。\n\n这是草鞋山遗址马家浜文化墓葬的墓主，距今六千多年。骨骼保存得相当完整，仰身直肢，头朝北，双手放在身体两侧。牙齿还在，磨耗得很平，说明他常年吃粗糙的、带砂的食物；盆骨和腿骨的形态，能看出他生前的体态和劳动方式。考古队员清理这座墓的时候，是一根骨头一根骨头剔出来的：先画图，再照相，再编号，最后整体起取。你现在隔着一层厚玻璃看他，他在土里躺了六千年，姿势一直没变。\n\n这一柜旁边写着他的随葬品：几件陶器，一把石斧，一些穿孔的装饰品。不多，但够用。马家浜时期的墓葬，随葬品差别不大，说明那时候的人死后待遇差不多——社会还没有拉开明显的等级。到了良渚，随葬品就分化了：有的墓几百件玉器，有的墓一件没有。这中间的几千年，就是“文明”发生的过程。\n\n这一厅的动线最后绕回入口那面墙。你可以再看一眼那些层位线，然后想想刚才看过的人骨、陶釜、玉璧：它们不是按“好看”排的，是按“时间”排的。同一块地上，七千年前的人用腰檐釜煮饭，五千年前的人用玉璧祭天，三千年前的人用印纹陶装酒。地层把他们的日子压成了一本可以翻开看的书。", "chars": 1563, "videos": [{"platform": "bilibili", "title": "苏州草鞋山考古遗址公园", "url": "https://www.bilibili.com/video/av363312895/", "note": "看遗址现场与稻田遗迹，配合本厅地层剖面看"}]}, {"id": "hx1", "title": "草鞋山：一座土丘里的七千年", "text": "这一节，我们专门讲草鞋山。因为整座博物馆里，最能说明\"考古是什么\"的，不是某一件精美的器物，而是草鞋山这个遗址本身。\n\n草鞋山在苏州工业园区唯亭镇，离这儿三十多公里。它原来是一座土丘，高出周围水田两三米，形状像一只倒扣的草鞋，所以叫草鞋山。1956年，考古队在调查时发现了它；1972年到1973年，进行了第一次正式发掘。那次发掘，挖出了让整个考古界震动的东西。\n\n第一件，是连续的文化堆积。草鞋山的地层，从下往上，依次是马家浜文化、崧泽文化、良渚文化、马桥文化，再往上还有吴越时期和更晚的堆积。这五种文化，一层压一层，中间没有断档。这意味着一件事：同一个地方，从七千年前到三千年前，一直有人在生活，一代接一代，没有离开。考古学最怕\"断\"，因为断了就说不清谁接谁；草鞋山不断，所以它成了一把标尺——江南别的遗址挖出来，年代对不对，跟草鞋山比一比就知道。这就是\"江南史前文化标尺\"这个说法的来历。\n\n第二件，是水稻田。草鞋山遗址发现了马家浜文化时期的水稻田，有水田、有水沟、有田埂，还有炭化的稻粒。这是中国最早的稻田之一，距今六千年左右。你在这间展厅看到的稻田遗迹，就是从那片田里整体起取的。田不大，几平方米，但它是\"农业\"的证据：人不再只靠采集和打猎，开始种地，开始定居，开始有剩余。\n\n第三件，是墓葬。草鞋山发现了马家浜文化的公共墓地，几十座墓排成几排，头朝北，仰身直肢，随葬品不多，主要是陶器。其中一座墓的人骨保存得特别好，就是你在隔壁展柜看到的那具。六千多年的人骨能留下来，靠的是埋藏环境：地下水位高，土被水泡着，缺氧，细菌少，骨头才没有烂掉。\n\n第四件，是玉器。草鞋山也出了良渚文化的玉琮、玉璧，虽然不如浙江余杭的反山、瑶山那么豪华，但形制、纹饰是一样的。这说明良渚的信仰和等级制度，已经覆盖到苏州这一带。\n\n这四件东西放在一起，草鞋山就不只是一个\"遗址\"，它是一本完整的书：最下面几页讲人怎么从打猎采集变成种田；中间几页讲人怎么从平等变成有等级；上面几页讲人怎么筑城、怎么用青铜、怎么进入历史时期。你在这座博物馆里看到的所有东西，几乎都能在草鞋山找到源头。\n\n发掘草鞋山的人，过的就是我们上一节讲的那种日子：探方、手铲、记录本、画图、拍照。1970年代的设备比现在差得多，没有全站仪，没有三维扫描，连彩色照片都少。但他们画的地层图，到今天还在用。为什么？因为他们画得准。一笔一笔，量出来的。\n\n草鞋山还有一个细节，值得说。遗址的土丘，后来被取土烧砖，挖掉了大半。等到考古队正式发掘的时候，土丘已经不像原来那么完整了。所以你现在看到的很多剖面，是\"抢救\"出来的：在推土机来之前，抢着挖，抢着记录。中国的考古，很多都是这样：不是坐在办公室里等，是在工地、在推土机前面抢时间。\n\n你站在这面剖面墙前面，看到的不只是土，是七千年的日子，也是几代考古人的日子。", "chars": 1162, "videos": []}, {"id": "h6", "title": "考古见姑苏（中）：一座城的两千五百年", "text": "从史前出来，这一厅讲城。\n\n先看中间那个沙盘。木渎古城，在苏州西边，灵岩山、五峰山一带。上世纪八十年代，考古队员在那一带做调查，发现田埂、土墩的走向有点怪，不像自然地形；后来顺着这些线索找，找出了城墙、城壕、城门，还有城内的河道。这是一座春秋晚期的大型城址，面积不小，有城墙、有水门，城外还有一圈护城的河。它入选了当年的全国十大考古新发现。苏州那三次“十大”里，这是其中一次。\n\n沙盘旁边的照片，是城墙的剖面。夯土一层一层，每层厚十几厘米，夯窝还看得出来。夯土怎么做的？把土倒进木板夹成的模子里，用木杵一下一下砸实，砸一层、加一层。这种墙不怕水，越砸越硬。你现在去苏州的古城墙上摸，还是这个手感。三千年前的人筑城，用的就是这套办法。\n\n为什么要在木渎筑这么一座城？因为那是吴国最强的时候。公元前五百多年，吴王阖闾把都城从梅里迁到今天的苏州，让伍子胥“相土尝水，象天法地”，筑了一座大城。城周长四十七里，有水陆八门，城门上建楼，城内有河道。这座城的位置，两千年没大挪动过。木渎古城是同一时期、同一文化圈的另一个中心，可能是军事性的，也可能是祭祀性的，学界还有争论。但有一点没争议：吴国当年在这一带，有能力调动大量人力筑城、挖河、造兵器。\n\n再看墙上那幅长卷。\n\n这是南宋《平江图》的复制品。原碑刻于绍定二年，也就是一二二九年，现在还在苏州碑刻博物馆。图上画的是当时平江府城，也就是苏州：城墙、城门、河道、桥梁、寺观、衙署，全标出来了。你注意看它的骨架——横平竖直的街巷，配上同样横平竖直的河道，街和河并排走。这就是苏州人说的“双棋盘”：陆上一张棋盘，水上一张棋盘，两套叠在一起。图上标了三百多座桥。\n\n旁边是今天苏州的航拍图。两张图并排，你会起鸡皮疙瘩：主干河道的位置几乎没变，人民路还是那条人民路，临顿路还是临顿路，城门的位置还是那几座。八百年前的图，能直接拿来对今天的城。这在世界城市史上都少见。\n\n为什么能这样？一半是水，一半是人。水定了骨架：河道不能随便改，改了全城淹；人认这个骨架：一代一代在原来的街巷上翻修、重建，不轻易另起炉灶。所以苏州的城，是“叠加”出来的，不是“推倒重来”的。考古队在金城新村、北园、混堂巷北这些地方挖，挖到的地层从唐宋一直排到春秋晚期，中间几乎没有断档。一座城，两千五百年一直有人住，土里就留下这样一本连续的书。\n\n这一厅最后有一句话，写在展板的下角，字不大：“城不是一天建成的，也不是一天消失的。”看完沙盘和两张图，你再读这句话，会有分量。", "chars": 1022, "videos": [{"platform": "bilibili", "title": "【展开看看】场地太够用了，那就主题化叙事吧！苏州考古博物馆", "url": "https://www.bilibili.com/video/av115553125532786/", "note": "从策展叙事角度讲这座馆怎么讲故事"}]}, {"id": "hx2", "title": "平江图：一张八百年前的city map", "text": "这一节，我们看一张图。不是画在纸上的，是刻在石碑上的；不是后人画的，是八百年前的人画的。\n\n这张图叫《平江图》。南宋绍定二年，也就是1229年，刻成。碑高两米多，宽一米多，现在还在苏州碑刻博物馆（府学文庙）里。图上画的是当时的平江府城，也就是苏州。城墙、城门、河道、桥梁、寺观、衙署、坊巷，全标出来了，还标了名字。\n\n你先看骨架。横平竖直的街巷，配上同样横平竖直的河道，街和河并排走。这就是苏州人说的\"双棋盘\"：陆上一张棋盘，水上一张棋盘，两套叠在一起。为什么这么规整？因为苏州是水乡，城是照着水修的。河是路，也是排水沟，也是运输线；街沿着河走，房子沿着街盖，桥把街连起来。一张图，把一座水城的逻辑画得清清楚楚。\n\n图上标了三百多座桥。你数不过来，但可以看密度：几乎每隔几十米就有一座。为什么这么多桥？因为河多。苏州城里，河比街还密。出门办事，很多时候要过桥。桥有名字：饮马桥、乐桥、相门桥、吴门桥……有些名字今天还在用。\n\n图的正中间偏北，有一块方方正正的区域，叫\"子城\"。那是衙署所在，也就是市政府。子城有城墙围着，四面开门。子城外面，是\"罗城\"，也就是大城，也有城墙。城套城，是唐宋时期州府城市的常见格局。苏州的子城，一直用到元末，后来拆了，但位置没变。\n\n图上的城门，有阊门、胥门、盘门、葑门、娄门、齐门、平门、蛇门，水门陆门都有。你今天去苏州，盘门、胥门、阊门这些地名还在，位置也大致对得上。八百年前的城门，今天还是公交站名。这就是苏州：城没挪窝，名字也没改。\n\n再看图上的寺观。报恩寺（北寺塔）、开元寺、瑞光寺、承天寺……一座城里有几十座寺庙。宋代的苏州，宗教生活很盛。塔是地标，北寺塔九层，今天还在，还是城北最高的古建筑。\n\n这张图最厉害的地方，是它跟今天的苏州能对上。你拿一张今天的航拍图，跟《平江图》并排放：主干河道的位置几乎没变，人民路还是那条人民路，临顿路还是临顿路，干将路的前身也在。八百年前的图，能直接拿来对今天的城。这在世界城市史上都少见。\n\n为什么能这样？一半是水，一半是人。水定了骨架：河道不能随便改，改了全城淹；人认这个骨架：一代一代在原来的街巷上翻修、重建，不轻易另起炉灶。所以苏州的城，是\"叠加\"出来的，不是\"推倒重来\"的。考古队在金城新村、北园、混堂巷北这些地方挖，挖到的地层从唐宋一直排到春秋晚期，中间几乎没有断档。一座城，两千五百年一直有人住，土里就留下这样一本连续的书。\n\n《平江图》不是一张普通的地图，它是一份\"城市合同\"：八百年前的人，把这座城的骨架画下来，后来的每一代人，都在这份合同上签字。你今天走在平江路上，脚下踩的，还是图上的那条街。\n\n看完这张图，再去看下一节的秦代瓦当，你会明白：苏州的\"不变\"，是靠一层一层的\"变\"堆出来的。", "chars": 1124, "videos": []}, {"id": "hx16", "title": "城门与水关：苏州的进出口", "text": "这一节，我们看城门。\n\n苏州的城，从春秋到明清，一直有城门。阖闾大城，有\"陆门八，水门八\"，一共十六座门。为什么水门跟陆门一样多？因为苏州是水城：船要进城，人也要进城。水门是给船走的，陆门是给人走的。\n\n水门怎么修？在城墙的缺口上，架一道石拱，或者木梁，下面通船，上面走人。门有闸，可以升降，控制船只进出。晚上关闸，白天开闸。水门旁边，还有\"水关\"：一个小闸门，控制城内河道的水位。水位高了，开闸放水；水位低了，关闸蓄水。\n\n城门不只是\"门\"，是\"关卡\"。进城的货，要交税；进城的人，要登记。城门上有城楼，驻兵，瞭望，报警。城门是城的\"眼睛\"和\"嘴巴\"。\n\n苏州的城门，很多名字今天还在：阊门、胥门、盘门、葑门、娄门、齐门、平门、蛇门。每座门，都有故事。阊门是\"气通阊阖\"，最繁华；胥门是纪念伍子胥；盘门有水陆两门，保存最好，现在是景点。\n\n盘门的水城门，你去看，能看到石拱、闸槽、绞关石。闸槽是放闸板的，绞关石是绞盘用的。一扇闸板，几个人绞上来，船才能过。这套设备，跟今天的水闸，原理一样。\n\n城墙，是城的\"外壳\"。苏州的城墙，夯土包砖，高几丈，厚几丈。墙上有马道，可以跑马；有垛口，可以射箭；有敌楼，可以驻兵。城墙外面是护城河，河宽几十米，船过不去，人爬不上。\n\n城墙也是\"记忆\"。苏州的城墙，从春秋修到明清，一层一层，每一层是一个朝代。墙里嵌着前朝的砖、前朝的瓦，甚至前朝的墓碑——修墙的人就地取材，把能用的都砌进去了。考古学家管这叫\"再利用\"。\n\n你在这间展厅看到的城墙模型，是春秋时期的：夯土墙、城壕、城门、角楼。墙不高，但很厚，剖面是梯形。筑墙的方法是版筑：两块木板夹住，填土，夯打，一层一层往上加。\n\n城门和水关，是苏州\"水城\"的证明。一座城，既要防人，也要通水；既要关，也要开。这种\"开关\"的智慧，就是水乡的智慧。\n\n今天你开车进城，过的是高架、隧道；古人进城，过的是城门、水关。形式变了，道理没变：城，永远要有\"进出口\"。", "chars": 800, "videos": []}, {"id": "h7", "title": "考古见姑苏（下）：一片瓦，一个字", "text": "这一厅只讲两件小东西：一片瓦，一个字。\n\n先看瓦。这是一块筒瓦的残片，灰陶，弧面，内壁有布纹。瓦面上有一个戳印，方方正正，印出一个“右”字。字是秦系篆书，笔画硬，转折方。这块瓦出自金城新村遗址，同出的还有一批高等级建筑构件：瓦当、脊饰、铺地砖。规格不低，不是普通民宅能用。\n\n“右”是什么意思？秦代官署分左右，右为尊。“右”字的戳印出现在建筑瓦件上，说明这批瓦是官署督造的，属于官方建筑。更关键的是，同样的瓦、同样的戳印、同样的制作工艺，在陕西、甘肃的秦代遗址里也出土过。也就是说，秦人把他们在关中那套营建制度，原样搬到了江南。\n\n这就解决了一个大问题：秦统一之后，会在稽郡的郡治到底在哪？文献说在吴县，也就是今天的苏州，但具体位置一直说不清。金城新村这批官署建筑构件一出来，位置就锚定了——郡治就在金城新村一带。公元前二二二年，秦将王翦平定楚国江南，置会稽郡，置吴县，郡治、县治都设在吴国故都。这块瓦，就是那条文献记载的实物证据。\n\n再看那个字。\n\n旁边展柜里是一件陶罐的残片，肩上拍印着一个“市”字。这个“市”，写法和六国文字都不一样，是标准的秦系写法。秦始皇统一天下之后“书同文”，把六国的异体字废掉，以小篆为标准。一个“市”字写成这样，说明这件器物是秦代的，也说明它跟官方市场有关。\n\n一个字能说明什么？说明制度落地了。度量衡统一、文字统一、市场管理统一，这些事听起来宏大，落到实物上就是一个戳印、一个写法。苏州古城考古第一次发现带“大市”字样的楚国量器，也是在类似的逻辑里：一个量器上的字，证明这里的市场是官方管的，这座城是行政中心。\n\n这一厅的展板上有句话，我念给你听：“考古学有时候很奢侈，用一个字，回答一座城的问题。”你站在两块残片前面，会觉得这话不夸张。", "chars": 722, "videos": []}, {"id": "hx3", "title": "金城新村：一片瓦定下的郡治", "text": "这一节，我们讲一次\"用一片瓦解决一个历史问题\"的考古。\n\n问题是什么？秦统一中国以后，把天下分成三十六郡，其中有一个会稽郡，郡治设在吴县，也就是今天的苏州。这件事，史书上有记载。但\"吴县\"到底在今天的哪里？苏州城这么大，郡治的衙署在哪条街、哪个巷？文献说不清，因为没有详细的地图，也没有当时的档案。\n\n考古队怎么找？先看文献，再看地形，最后靠发掘。\n\n金城新村，在苏州古城内。这一带盖房子，考古队去做配合发掘。挖下去，地层很清楚：最上面是近现代的扰土，往下是明清、宋元、唐宋，再往下是六朝、汉代，最下面是战国和春秋。一条连续的地层，从唐宋一直排到春秋晚期。\n\n就在汉代到战国这一层里，出土了一批建筑构件：筒瓦、瓦当、铺地砖、脊饰。其中一块筒瓦的残片上，有一个戳印，方方正正，印出一个\"右\"字。\n\n\"右\"是什么意思？秦代的官署分左右，右为尊。带\"右\"字戳印的瓦，说明这批瓦是官署督造的，用在官方建筑上。更关键的是，这种瓦的形制、纹饰、制作工艺，跟陕西、甘肃的秦代遗址出土的瓦，几乎一模一样。也就是说，秦人把他们在关中那套营建制度，原样搬到了江南。\n\n一块瓦，能说明什么？说明这里不是普通民居，是官署；说明用瓦的人，是秦代的官员；说明这个官署的等级不低。再把出土地点、地层年代、文献记载三样一对：金城新村，就是秦代会稽郡治的所在。\n\n这个结论，看着简单，其实很重。它把苏州建城史里一段模糊的记载，落到了具体的地面上。过去讲苏州两千五百年建城史，最硬的一条是伍子胥筑阖闾大城，公元前514年。秦代会稽郡治的确立，是这座城在统一帝国里的\"行政身份\"：它不只是吴国的故都，还是秦帝国的一个郡治，是帝国体系里的一个节点。\n\n金城新村的发掘，还出了别的东西：陶井圈、下水管道、大量的瓦砾。下水管道是陶制的，一节一节套起来，埋在地底下。两千年前的市政工程，做得比我们想的讲究。井圈是打井用的，一节一节放下去，防止塌方。这些东西说明，这里不是临时搭的棚子，是长期使用的建筑群。\n\n你在这间展厅看到的这些瓦，灰扑扑的，不漂亮。但它们身上的信息，比很多漂亮瓷器还多：一个戳印，一种工艺，一层地层，就把一座城的行政中心，从文献里的一个名字，变成了地图上的一个点。\n\n考古有时候就是这样：不是挖出金银珠宝，是挖出一片瓦，然后告诉你，这座城在两千年前，是帝国的一个郡。", "chars": 950, "videos": []}, {"id": "h8", "title": "文明溯源（上）：从平等到等级", "text": "下到负一层，展览叫“华章江南”，第一篇是“文明溯源”。它的时间轴从七千年前排到四千年前，讲一件事：人怎么从“大家都差不多”，走到“有人站在最上面”。\n\n先看第一组墓。\n\n马家浜文化的墓葬，一排排，都是长方形竖穴，头朝北，仰身直肢。随葬品很朴素：一件陶釜、一只陶豆、几件小陶罐，讲究一点的加一把石斧、一串骨珠。墓与墓之间差别很小，谁家多一只罐子，谁家少一只，不构成等级。考古学管这叫“平等社会”：血缘群体共同劳动、共同分配，死者埋在公共墓地里，待遇大致相当。\n\n再看崧泽那一组。\n\n同样是墓，差别出来了。有的墓只有几件陶器，有的墓随葬玉璜、玉玦、玉钺，还有成组的彩绘陶器。玉璜是挂在胸前的弧形饰件，玉钺是权力象征的斧，玉玦是耳饰。玉石器在那个年代不是随便能有的东西：玉料要开采、要运输，琢磨一件要花很多工时。一个人能带着这些下葬，说明他生前能调动别人的劳动。\n\n张家港东山村遗址，是这一阶段最重要的发现之一。那里出土了崧泽文化早中期的高等级墓葬，墓坑大、随葬品多，有的墓里随葬石钺、玉器、陶器上百件。一个墓就能看出社会已经分层了：有人是“被埋葬的普通人”，有人是“被隆重送走的首领”。考古学管这个阶段叫“分节社会”——社会像一棵树，开始长出主干和分枝。\n\n再往上，是良渚。\n\n良渚的墓，不在公共墓地里了，埋在高台上。高台是人工堆起来的，几十万方土，靠一筐一筐挑上去。能组织这种工程的人，权力已经很大。墓里的随葬品也变了：玉琮、玉璧、玉钺成组出现，玉琮上刻神人兽面纹，玉钺的刃部没有一点使用痕迹——它不是干活的斧头，是仪仗。\n\n展柜里那件玉琮，你可以绕着看。外方内圆，四面中间有直槽，槽里刻着神人兽面：上面一个戴羽冠的人，双手扶在兽的肩上；下面一双大眼睛，獠牙外露。这个图案很小，要用放大镜才看得清线条，但它是整个良渚文化圈共同的标志，从浙江到江苏，几百公里范围内都一样。共同的信仰，意味着共同的上层。\n\n玉钺旁边有一段说明：钺从石斧演变而来，本来是工具，后来变成礼器，最后变成军权的象征。这个演变很值得琢磨：一件东西从“有用”变成“有意义”，中间隔着的就是社会结构的变化。谁掌握暴力，谁就掌握分配；谁掌握分配，谁就能让别人给他修墓。\n\n这一厅的结尾，是一张图：从马家浜到良渚，墓坑由小变大，随葬品由少变多，玉器由无到有，高台由无到有。四条曲线一起往上走。考古学家不太用“进步”这个词，因为进步是价值判断；他们只说“复杂化”。社会变复杂了，这是事实。\n\n你走出这一厅的时候，可以想一个问题：如果有一天，你的墓被一千年后的人挖开，里面的东西会告诉他们什么？良渚人的墓告诉我们的，不是他们有多富有，是他们已经相信了一些东西，并且愿意为这些信仰付出劳动。", "chars": 1100, "videos": []}, {"id": "hx4", "title": "崧泽彩陶罐：一只罐上的画", "text": "这一节，我们看一只罐子。不大，腹部圆鼓，口沿外撇，底下是平底。最特别的是它身上的画：红彩和黑彩，画着弧线、圆点、编织纹，线条很稳，一笔一笔，像用尺子量过。\n\n这是崧泽文化的彩绘陶罐，距今约五千五百年到六千年。崧泽文化，因上海青浦崧泽遗址得名，分布在上海、苏州、嘉兴一带，是马家浜文化和良渚文化之间的过渡阶段。苏州的崧泽文化遗址不少，草鞋山、东山村、绰墩，都出过彩陶。\n\n先看它的做法。陶罐是轮制的：把泥放在转盘上，一边转一边往上拉，拉出器形。轮制的好处是匀、圆、快。器形拉好，晾到半干，表面打磨光滑，然后画彩。彩料是矿物颜料：红色是赤铁矿，黑色是锰土。画的时候用软笔，一笔下去不能改，因为陶坯还是湿的，改了就花。画完，入窑烧。烧成温度大约一千度，彩和胎结合，颜色就固定了。\n\n你仔细看那些线条。弧线是连续的，从口沿一直绕到腹部，收笔的地方和起笔的地方接得上；圆点是等距的，像用圆规点出来的；编织纹是一组一组平行的短线，交叉成网格。这种精度，不是随手画的，是练过的。画的人，可能是专门做陶的工匠，也可能是氏族里负责祭祀的人。\n\n这些图案什么意思？学界有几种说法。一种说是水波和鱼纹，因为崧泽人住在水边，水是他们生活的一部分；一种说是编织纹，模仿竹编、席编的纹理；一种说是图腾或记号，代表某个氏族。没有文字，谁也说不准。但有一点可以肯定：这些图案不是随便涂的，是有规矩的。有规矩，就说明有审美，有信仰，有传承。\n\n彩陶在崧泽文化里，不是 everyday 的东西。普通的炊器、盛器，是素面的；彩陶多出在墓葬里，而且是随葬品里比较讲究的那几件。这说明彩陶有\"礼\"的性质：它不是用来天天用的，是用来陪葬、祭祀、显示身份的。\n\n你再看这只罐子的高度和口径。它不大，装不了多少东西。为什么不做大？因为它的功能不是装粮食，是\"象征\"。一只小罐，画得精，放在墓里，代表的是这个人的地位、这个家族的信仰。器物的\"大小\"和\"重要性\"，有时候是反着的。\n\n崧泽文化之后，是良渚文化。良渚人把玉器做到了极致，但陶器上的彩绘反而少了。为什么？因为信仰的表达，从彩陶转到了玉器。玉比陶贵，比陶硬，比陶难做；用玉来通神，比用彩陶更有分量。所以你看，一只彩陶罐的兴衰，背后是整個社会的变化：从\"画在陶上\"到\"刻在玉上\"，从\"氏族共享\"到\"等级分明\"。\n\n这只罐子放在展柜里，灯光打得很柔。你可以绕着看，看它的弧线、它的圆点、它的接缝。五千五百年前，有人蹲在窑边，一笔一笔画完它，然后把它放进墓里。今天，你站在这里看它。中间隔着的，是五千五百年，也是无数个像我们一样，想弄明白\"他们为什么这么画\"的人。", "chars": 1066, "videos": []}, {"id": "h9", "title": "文明溯源（下）：一块田，一堆石头", "text": "这一厅有两件“大东西”：一块田，一堆石头。\n\n先说田。\n\n展柜里是一段被整体起取的稻田遗迹，土是灰褐色的，表面能看到一条条浅浅的沟，沟与沟之间是平整的田面。这是草鞋山遗址马家浜文化的水田，距今六千年左右。考古队员当年挖到它的时候，先看到的是几条平行的小沟，一开始以为是自然淤积；后来在沟里发现了炭化稻粒、稻叶，还有田埂的痕迹，才确定这是人工开出来的水田。\n\n旁边有显微放大的照片。一粒炭化稻谷，被放大几十倍，能看到谷壳上的纹路、芒的断口。它为什么会炭化？可能是收割后没来得及收进屋，被火烧了；也可能是故意烧荒。不管哪种，它被烧成了炭，反而不腐，留到了今天。\n\n展柜上方有一段灌溉系统的动态复原：水从河沟引进来，经过水口，流进田里；田埂把水一块一块拦住；排的时候，水从另一头的缺口出去。这套系统看着简单，其实是稻作农业的核心技术。水稻不是撒下去就完事，它要控水：插秧时水浅，分蘖时水稍深，晒田时要排干。六千年的人已经懂得按阶段调水。\n\n稻作带来的变化，展板上写得很清楚：定居、人口增长、剩余产品。有了剩余，才有人可以不种地，去烧陶、磨玉、管祭祀；有了人口，才需要更大的聚落、更复杂的组织。所以你看，后面那些玉器、城墙、大墓，根子都在这块田里。\n\n再说石头。\n\n展厅一侧，是一个石室土墩的复原模型。土墩不高，顶上用石块垒出一个长方形的小室，有门道，有盖石。这类遗存在太湖周围的山顶上分布很广，苏州、无锡、常州都有，年代大多在西周至春秋。它是什么？学界有几种说法：军事瞭望、烽燧、祭祀场所、墓葬。比较主流的看法是，它跟吴越时期的军事防御和山地祭祀都有关，不同地点的功能可能不一样。\n\n模型旁边是一段春秋城墙的微缩复原：夯土墙、城壕、城门、角楼。墙不高，但很厚，剖面是梯形。筑墙的方法是版筑：两块木板夹住，填土，夯打，一层一层往上加。城门有水门和陆门，水门让船能进城。这套东西，跟前面木渎古城沙盘上看到的是同一套。\n\n把田和石头放在一个厅里，是有用意的。田代表“留下来过日子”，石头代表“守住这块地”。从马家浜到吴越，几千年里，苏州人做的事其实没变：找一块能种的地，把它围起来，守住。变的是工具、组织和技术。\n\n这一厅的角落还有一小块展板，讲的是“稻田里的杂草”。考古队员在稻田遗迹的土样里，浮选出稗草、莎草一类的种子。这些草当年跟稻子抢养分，农民要拔掉。六千年后，它们从土里被泡出来，成了研究古代农业的标本。一件很小的事，但很动人：连杂草都被记住了。", "chars": 1002, "videos": [{"platform": "bilibili", "title": "苏州草鞋山考古遗址公园", "url": "https://www.bilibili.com/video/av363312895/", "note": "看遗址现场与稻田遗迹，配合本厅地层剖面看"}]}, {"id": "hx5", "title": "良渚玉琮：神人兽面的秘密", "text": "这一节，我们看一件\"不像工具的工具\"：玉琮。\n\n玉琮的样子很怪：外方内圆，像一个方柱中间穿了一个圆孔。高的有几十厘米，矮的只有几厘米；有的光素，有的四面刻满花纹。你在这间展厅看到的那件，青绿色，玉质温润，四面中间有直槽，槽里刻着极细的线。\n\n先看花纹。那是良渚的\"神人兽面纹\"：上面是一个戴羽冠的人，双手扶在兽的肩上；下面是一双大眼睛，獠牙外露。整个图案不大，刻得很浅，要用放大镜才看得清线条。但它是整个良渚文化圈共同的标志：从浙江余杭，到江苏苏州，到上海青浦，几百公里范围内，只要是良渚的高等级墓葬，都能找到这个图案。\n\n为什么一个图案能传这么远？因为它不是装饰，是信仰。良渚人相信，玉能通神；玉琮的形状，外方内圆，代表\"天圆地方\"；中间的圆孔，是神与人沟通的通道。祭司拿着玉琮，就是在跟神说话。谁能拿玉琮，谁就能跟神说话；谁能跟神说话，谁就掌握了权力。所以玉琮不是\"艺术品\"，是\"权力证书\"。\n\n再看工艺。良渚人没有金属工具，怎么做玉？靠\"以石攻玉\"：用硬度更高的石头做工具，加上解玉砂（石英砂），一点一点磨、钻、切。玉琮中间的圆孔，是用竹管或骨管加砂，两边对钻，钻通了再打磨。四面的直槽，是用线切割：一根绳，蘸上砂，来回拉，把玉料一点点磨开。一件玉琮，一个工匠要做几个月，甚至几年。\n\n玉料从哪来？良渚的玉，主要是透闪石玉，产地可能在江苏溧阳、浙江天目山一带。从产地到良渚，要运输几百公里。一块玉料，从开采、运输、切割、钻孔、雕刻、打磨，到最终放进墓葬，背后是一整套组织：有人找矿，有人运输，有人制作，有人分配。这不是一个村子能完成的，是一个国家才能完成的。\n\n良渚的\"国家\"有多大？良渚古城，在浙江余杭，面积约三百万平方米，有城墙、有水门、有宫殿区、有水利系统。水利系统由十几条水坝组成，控制范围一百多平方公里，是中国最早的大型水利工程之一。能修这样的工程，能调动几万人，能分配玉料，这已经不是\"部落\"，是\"国家\"。\n\n你再看这件玉琮的尺寸和重量。它不大，但很重，因为玉的密度高。拿在手里，是凉的、沉的。良渚人把它放在墓里，放在死者的胸口或手边。为什么？因为死了以后，还要跟神说话。\n\n良渚之后，玉琮的形制还在，但花纹慢慢简化，最后消失了。到了商周，玉琮变成了\"礼器\"的一种，摆在庙里，不再刻神人兽面。信仰变了，器物还在，但意思不一样了。这就是器物的命运：它会活得比它的信仰更长。\n\n站在这件玉琮前面，你可以想一个问题：五千年前的人，为什么要花几年时间，做一件不能吃、不能穿、不能用的东西？答案可能是：因为他们相信，有些东西比吃穿更重要。这种相信，就是文明。", "chars": 1065, "videos": []}, {"id": "hx17", "title": "良渚古城与水利", "text": "这一节，我们讲良渚的\"城\"。\n\n良渚古城，在浙江余杭，距离苏州不远。城有多大？三百万平方米，相当于四个故宫。城墙是夯土的，底宽几十米，高十几米，一圈围起来。城里有宫殿区、有王陵、有作坊。城外，有水利系统。\n\n水利系统是什么？是十几条水坝。有的在山谷里，拦洪水；有的在平原上，蓄水、灌溉、运输。水坝用土堆成，有的地方还铺了草裹泥，防止渗水。整个系统，控制范围一百多平方公里。这是中国最早的大型水利工程之一，比大禹治水还早。\n\n为什么要修水利？因为良渚人种水稻。水稻要水，但不要洪水。雨季水多，要拦；旱季水少，要蓄。修了水坝，就能调节水位，保证稻田有水，城里有水，船能走。\n\n修这么大的工程，要多少人？考古学家估算，光修城墙，就要几万人干几年。修水利，更久。能组织几万人，说明良渚已经有了\"国家\"：有王，有贵族，有官僚，有军队，有工匠。\n\n良渚的玉料，从哪来？可能是江苏溧阳、浙江天目山。从产地到良渚，要运输几百公里。玉料开采、运输、切割、雕刻，需要一整套组织。玉琮、玉璧、玉钺，只出现在高等级墓葬里，说明玉是\"权力的象征\"。\n\n良渚的城，后来怎么了？距今四千年左右，良渚文化突然衰落。原因有几种说法：洪水、战争、气候变化、内部动乱。考古发现，良渚古城在晚期，有大面积的水灾痕迹：淤泥、砂层。可能是洪水毁了城。\n\n良渚之后，是马桥文化。马桥人的器物，比良渚粗糙，玉器少了，青铜器多了。有人说，良渚的文明\"断\"了；也有人说，良渚的人还在，只是文化变了。考古学能看到的，是器物变了、城没了、玉少了。至于人，可能还在。\n\n你在这间展厅看到的良渚玉器，是那个\"城\"的产物。没有城，就没有玉料；没有玉料，就没有玉琮；没有玉琮，就没有神权。城、玉、神，是一套的。\n\n苏州离良渚不远，苏州的良渚遗址，有草鞋山、绰墩、赵陵山。赵陵山出土过良渚的玉琮、玉璧，还有\"人殉\"的痕迹。说明苏州的良渚社会，跟浙江的良渚社会，是一体的。\n\n一座五千年前的城，有城墙、有水利、有王陵、有玉器。它不是\"村落\"，是\"国家\"。良渚，是中国五千年文明的实证之一。", "chars": 840, "videos": []}, {"id": "h10", "title": "吴越新证（上）：天下最好的剑", "text": "“吴越新证”这一厅，最有名的是剑。\n\n展柜里平放着一把春秋青铜剑，剑身窄长，中脊起棱，两刃有细微的弧度。灯光打上去，剑身的暗纹像水波一样浮出来。你凑近看，会发现那些纹路不是刻的，是铸出来的——铸剑的时候，在剑范上做出了凹凸，铜水浇进去，纹路就跟剑身长在一起。这种工艺叫“菱形暗格纹”，吴越地区特有。\n\n剑的首部也值得看。圆盘形的剑首，上面有一圈一圈极细的同心圆，细到什么程度？用放大镜看，线条之间的间距不到一毫米。在没有车床的年代，靠的是范铸和手工打磨。这种精度，是吴越铸剑师的门槛。\n\n再看剑格。剑格是剑身和剑柄之间的那小块，有的嵌绿松石，有的错金银。一把剑，从剑身到剑首到剑格，每一处都在较劲：既要锋利，又要好看；既要轻，又要韧。吴越的剑，是当时天下最好的兵器之一。\n\n这跟苏州有什么关系？关系大了。吴国的中心在今天的苏州，越国的中心在今天的绍兴，两国打了几百年，打出了铸剑的最高水平。苏州城里现在还有干将路、莫邪路，传说干将莫邪在这里铸剑。传说不能当史料用，但它说明一件事：苏州人对“铸剑”这件事，记了两千多年。\n\n展柜旁边有一段关于“复合剑”的说明，我讲一下。复合剑是把剑身分成两部分：脊部用含锡量低的铜，韧；刃部用含锡量高的铜，硬。两种铜分别铸好，再合铸在一起。这样铸出来的剑，脊不容易断，刃又锋利。这个思路，跟今天做刀具的“夹钢”是一个道理。两千五百年前的工匠，已经在用材料复合的办法解决“又硬又韧”的矛盾。\n\n剑不只是兵器。在吴越的墓葬里，剑常常放在死者的身侧，有的还配有剑鞘、剑匣。随葬剑的人，多半是武士或贵族。剑是身份的证明：你有资格佩剑，说明你在社会上有个位置。所以考古学家看到一座墓里有剑，不只会说“这是武器”，还会说“这是一个有军事身份的人”。\n\n这一厅靠里的位置，曾经借展过一把吴王夫差剑。剑身上有铭文，剑格嵌绿松石，保存得极好。它只在苏州待了一个月，但引起的动静不小。为什么？因为夫差是苏州这座城市真正的“建城者”之一——阖闾、夫差父子把吴国推到顶峰，也把苏州推成了东南第一都会。一把刻着他名字的剑，回到他当年的都城，这件事本身就有分量。\n\n看完剑，往旁边走，是城的部分。春秋城墙的微缩模型、木渎古城的沙盘，前面已经讲过。这里补一句：剑和城是一体两面。城是守，剑是攻；城圈住了人，剑决定了城能圈多大。", "chars": 948, "videos": []}, {"id": "hx6", "title": "青铜剑：一把剑的铸造", "text": "这一节，我们看一把剑，看它是怎么做出来的。\n\n先说材料。青铜不是纯铜，是铜加锡、加铅的合金。纯铜太软，加锡就变硬；锡加得越多，越硬，但也越脆。铸剑的难点，就在\"硬\"和\"韧\"之间找平衡：刃要硬，才锋利；脊要韧，才不断。吴越的工匠，找到了一个办法：复合剑。\n\n复合剑怎么做？先铸剑脊，用含锡量低的铜，韧性好；再把剑脊放进剑范，浇铸刃部，用含锡量高的铜，硬度高。两次铸造，两种材料，结合成一把剑。这个思路，跟今天做刀具的\"夹钢\"一模一样：外面硬，里面韧。\n\n再说纹饰。你在这把剑的剑身上看到的菱形暗格纹，不是刻上去的，是铸上去的。铸剑的时候，在剑范上做出凹凸的网格，铜水浇进去，纹路就跟剑身长在一起。这种纹饰，吴越地区特有，别的地方很少见。为什么？可能是因为吴越的剑师，掌握了控制铜锡配比的技术：不同配比的铜，颜色不一样，铸在一起，就显出暗纹。\n\n剑首的同心圆，更绝。剑首是剑柄顶端那个圆盘，上面有一圈一圈极细的同心圆，细到间距不到一毫米。在没有车床的年代，怎么做？靠范铸加手工打磨。先用范铸出粗形，再用细砂石一点一点磨，磨一圈，转一个角度，再磨一圈。一件剑首，要磨几天。\n\n剑格（剑身和剑柄之间那块）上，常常嵌绿松石，或者错金银。错金银是把金丝、银丝嵌进预先刻好的凹槽里，再打磨平整。这是精细活，手一抖就废。\n\n剑铸好了，还要磨。磨剑用砺石，粗磨定形，细磨开刃，最后用皮革抛光。磨好的剑，刃口可以看到一条白线，叫\"刃线\"。这条线越均匀，剑越锋利。\n\n吴越的剑，为什么天下有名？三个原因：一是技术，复合剑、暗格纹、同心圆，都是当时最先进的；二是资源，吴越有铜、有锡、有好的砺石；三是需求，吴越打仗多，剑是刚需。技术、资源、需求，三样凑齐，就出了一个铸剑的高峰。\n\n苏州城里现在还有干将路、莫邪路。传说干将莫邪在这里铸剑，铸了三年，铸成雌雄二剑。传说不能当史料，但它说明一件事：苏州人对\"铸剑\"这件事，记了两千多年。\n\n你再看这把剑的尺寸。不长，五六十厘米，单手可握。为什么不做长？因为青铜脆，做长了容易断。所以青铜剑都是短剑，主要用于刺，不适合劈砍。到了汉代，铁剑出现，剑才变长。材料的限制，决定了兵器的形状。\n\n一把剑，从矿石到成品，要经过采矿、冶炼、配比、制范、浇铸、打磨、镶嵌、开刃，十几道工序，几十个工匠。它不只是一件武器，是一个国家的工业能力。吴国能称霸，靠的不只是军队，还有这样的手工业。\n\n站在这把剑前面，你可以想：两千五百年前，一个工匠，蹲在炉边，看着铜水浇进范里，等它冷却，然后一点一点磨出刃线。他不知道这把剑以后会杀谁，也不知道它会埋在哪里。但他知道，这把剑要做得最好。", "chars": 1070, "videos": []}, {"id": "hx18", "title": "吴越战船：水上的军队", "text": "这一节，我们讲水军。\n\n吴越两国，都在水边。吴在太湖东，越在钱塘江南。两国打仗，很多时候是水战。水战靠什么？靠船。\n\n吴越的船，有大有小。大的叫\"楼船\"，船上有楼，可以射箭、瞭望；小的叫\"戈船\"，轻快，用来冲锋；还有\"突冒\"，船头包铁，用来撞；\"桥船\"，船上带桥，用来登陆。一支水军，几十艘、上百艘船，浩浩荡荡。\n\n船怎么造？木头。吴越有山，有林，有木匠。造船的工序：选木、锯板、做龙骨、拼船板、捻缝、上漆。船板之间用榫卯，缝隙用麻丝、桐油灰填。一艘大船，要几百个工匠，做几个月。\n\n船上的兵器，跟陆上不一样。陆上用剑、戈、矛；水战用弓、弩、短兵。为什么？因为船晃，长兵器不好使；距离远，靠弓箭。吴越的弓弩，很有名。\"吴钩\"是一种弯刀，近战用。\n\n水战怎么打？先用弓箭射，再靠船撞，最后跳帮肉搏。船与船之间，用\"拍杆\"（一根大木头，一头绑石头，一头用绳子吊着）砸对方的船。拍杆砸下去，船板就碎。这种武器，是水战特有的。\n\n吴越的水军，有多强？吴王夫差北上争霸，从海上运兵、运粮，打到齐国。越王勾践灭吴，也是水陆并进。水军，是两国的\"战略力量\"。\n\n苏州的城，也跟水军有关。阖闾大城，水门八座，船能直接进城。城外的护城河，既是防御，也是水道。吴国的都城，是一座\"水城\"，也是一座\"军城\"。\n\n你在这间展厅看到的战船模型，是按考古发现和文献复原的。船身瘦长，船头翘起，船尾有舵，船中有桅。船上站着几个陶俑，拿着弓、戈。模型不大，但能看出结构。\n\n水军的背后，是国家的组织能力：造船要木料、要工匠、要船坞；养兵要粮、要钱；打仗要指挥、要后勤。一支水军，不是一个村能养的，是一个国家才能养的。\n\n吴越的水战，后来影响了中国的水军。汉代的水军、明代的水师、清代的水师，都能看到吴越的影子。水战的技术，从太湖、钱塘江，传到了长江、沿海。\n\n你站在模型前面，可以想：两千五百年前，太湖上，几百艘船，鼓声、号声、箭雨。那种场面，今天只能在电影里看到。但船、兵器、城墙，都是真的。", "chars": 809, "videos": []}, {"id": "h11", "title": "吴越新证（下）：一只量器与春申君", "text": "这一厅讲一个“新东西”。它上展线的时候，考古简报都还没发。\n\n二〇二五年四月，姑苏区余天灯巷遗址，考古队员在整理出土器物的时候，发现了一件形状有点特别的陶器：圆筒形，一侧有把，口沿外撇，器身有一条条轮制的弦纹。清洗之后，器身上露出了文字。所里研究楚国文字的沈浩被从张家港叫回来，看完说：这是楚国的量器，叫“筲”，上面的字是“大市”。\n\n“大市”两个字，信息量很大。市，是市场；大市，是官方管理的大型市场。度量衡是官方制定的，量器只可能出自官方。也就是说，这件东西不是普通人家用的，是市场里用来量粮食的官器。\n\n为什么这很重要？因为它把苏州的城市史往前推了一截。过去讲苏州建城，最硬的一条证据是《史记》里伍子胥筑阖闾大城，公元前五百一十四年。余天灯巷这件量器，年代在战国晚期，它证明那个时候的苏州，已经是一个有官方市场、有度量衡管理、有城市行政体系的城。这比“有城墙”更进一层：城墙说明有人住，市场说明有人在交易、有制度在管。\n\n跟这件量器呼应的，是春申君。\n\n战国晚期，楚国灭了越国，吴地归楚。楚考烈王把黄歇封在这里，号春申君。春申君在吴地修水利、开河道、治理旧城，史书上说他“以故吴墟为城”——在吴国的旧都废墟上，重新修起城来。苏州人至今记得他：城里有春申湖、春申路，上海叫“申城”，也是从他这儿来的。\n\n所以苏州这座城，不是一次建成的。阖闾筑城是一次，春申君修城是一次，秦置会稽郡是一次，后面还有无数次。每一次改朝换代，城都被重新整理一遍，但骨架没换。考古学能看到的是：地层里的建筑构件换了样式，陶器的形制换了风格，但城墙的位置、河道的走向，一直没大动。\n\n这一厅的展柜里，还有几件秦代的东西：带“右”字戳印的瓦、秦式的陶器。它们和楚国量器放在一起，讲的是同一个故事：苏州这块地方，在战国到秦的几十年里，被楚人、秦人轮番接管，每一拨人都留下了自己的制度痕迹。一个量器、一片瓦、一个字，就是这些痕迹。\n\n看完这一厅，你会意识到一件事：我们总说苏州两千五百年建城史，这个数字不是算出来的，是一件一件东西堆出来的。每挖出一件带字的东西，这个数字就可能往前挪一点，或者变得更结实一点。", "chars": 874, "videos": []}, {"id": "h12", "title": "都会寻踪（上）：把一座墓搬进博物馆", "text": "“都会寻踪”这一厅，整个空间是为一件东西让路的。\n\n一座墓。九十几吨，占地一百五十平方米，长十五米，宽十米。它不是模型，是从虎丘路新村土墩整体搬过来的三国孙吴一号墓，原砖原位置，一比一复建。你从侧面绕过去，先看到的是墓的外壁：砖一层一层砌上去，砖缝里的灰浆还在，墙面高低不平，像一堵老墙。\n\n先讲它怎么来的。\n\n这座墓是十多年前配合基建考古发现的，发掘工作一直持续到二〇一八年。墓在虎丘路新村的一个土墩里，土墩上面是民房，下面是墓。发掘结束之后，问题来了：原址不具备保护条件，不可能把整片小区改成遗址公园。按常规做法，这种墓做完资料、取完文物，就回填了。但这座墓太大、太重要，所里决定整体搬迁。\n\n搬迁的方案，是把墓室切割成几大块，每一块先用钢架固定、用泡沫和石膏包裹，再整体吊起来，运到博物馆，最后按原来的位置重新拼回去。砖是原来的砖，位置是原来的位置。你在馆里看到的每一道砖缝，都是当年砌墓的人留下的。\n\n再看墓的形状。俯视是十字形：一条长长的墓道从南边斜下去，接甬道，进前室，前室两侧各有一个耳室，再往里是后室。这是孙吴时期高等级墓葬的典型布局。前室是祭祀、行礼的地方，后室放棺，耳室放随葬品。整座墓用砖砌，砖的规格有好几种，有的侧面模印着花纹，有的印着字。\n\n字很关键。墓里出土了“吴侯”铭文砖，还有“建兴二年七月廿一日吴王口”的纪年砖。建兴是孙亮的年号，二年是公元二五三年。有“吴侯”、有“吴王”、有明确纪年，再加上五十八件金器、四件铜器和一批青瓷，墓主的身份就清楚了：孙吴宗室里的高层人物，而且很可能是女性。\n\n为什么苏州会有孙吴的宗室大墓？因为孙吴的根基在吴。孙权的父亲孙坚是吴郡富春人，孙氏一族从这一带起家，最后建立了割据江东的政权。苏州是孙吴的腹地，宗室、功臣、贵族埋葬在这里，合情合理。过去苏州没有发现过三国大墓，东汉末到六朝之间这一段，苏州人用什么、怎么生活，一直是空白。这座墓把这段空白填上了。\n\n现在你绕着墓走一圈。注意看墓壁的砖：有的砖面上有手指按过的凹痕，那是当年制砖的工匠留下的。砖坯放在地上晾的时候，还是软的，工匠搬动、码放，手指就按进去了。一千七百多年后，这些指纹还在。你看到的不是“文物”，是一个人的手。", "chars": 905, "videos": [{"platform": "douyin", "title": "苏州考古博物馆打卡攻略：孙吴一号大墓是重头戏", "url": "https://www.douyin.com/video/7505364536519822619", "note": "打卡向，看大墓的体量"}, {"platform": "bilibili", "title": "沉睡1800年的孙吴贵族墓重见天日", "url": "https://www.bilibili.com/video/BV1V7NkzzEzt/", "note": "讲墓主身份与出土金器"}]}, {"id": "hx7", "title": "孙吴大墓：九十吨的搬家", "text": "这一节，我们专门讲\"搬家\"：把一座九十多吨的墓，从工地搬进博物馆。\n\n这座墓，是苏州虎丘路新村土墩的三国孙吴一号墓。2016年到2018年发掘，墓在土墩里，土墩上面是民房。发掘结束，问题来了：原址不具备保护条件，不可能把整片小区改成遗址公园。按常规做法，做完资料、取完文物，就回填了。但这座墓太大、太重要，所里决定：整体搬迁。\n\n搬一座砖室墓，比搬一栋房子还难。房子有梁有柱，墓只有砖，砖与砖之间是灰浆，一碰就散。怎么办？先加固。\n\n第一步，清理墓室，把里面的文物全部取出，编号、打包。第二步，在墓室内部搭钢架，顶住四壁和顶部，防止坍塌。第三步，在墓室外面包上一层泡沫和石膏，像给病人打石膏。第四步，把整座墓切成几大块，每一块用钢架固定，底部穿进工字钢，做成一个\"托盘\"。\n\n第五步，吊装。九十多吨，普通的吊车不行，要用大吨位的汽车吊。吊的时候，钢丝绳要受力均匀，不能有一点倾斜，否则砖室会裂。第六步，运输。路线要提前勘测：桥能不能过，限高多少，转弯半径够不够。第七步，进馆、就位、拼装。把几大块按原来的位置拼回去，砖缝对齐，钢架拆除，石膏清理。\n\n整个过程，花了几个月。你在馆里看到的这座墓，砖是原来的砖，位置是原来的位置。每一道砖缝，都是当年砌墓的人留下的。\n\n墓的形状，俯视是十字形：一条长长的墓道从南边斜下去，接甬道，进前室，前室两侧各有一个耳室，再往里是后室。这是孙吴时期高等级墓葬的典型布局。前室是祭祀、行礼的地方，后室放棺，耳室放随葬品。整座墓用砖砌，砖的规格有好几种，有的侧面模印着花纹，有的印着字。\n\n字很关键。墓里出土了\"吴侯\"铭文砖，还有\"建兴二年七月廿一日吴王口\"的纪年砖。建兴是孙亮的年号，二年是公元253年。有\"吴侯\"、有\"吴王\"、有明确纪年，再加上五十八件金器、四件铜器和一批青瓷，墓主的身份就清楚了：孙吴宗室里的高层人物，而且很可能是女性。\n\n为什么苏州会有孙吴的宗室大墓？因为孙吴的根基在吴。孙权的父亲孙坚是吴郡富春人，孙氏一族从这一带起家，最后建立了割据江东的政权。苏州是孙吴的腹地，宗室、功臣、贵族埋葬在这里，合情合理。过去苏州没有发现过三国大墓，东汉末到六朝之间这一段，苏州人用什么、怎么生活，一直是空白。这座墓把这段空白填上了。\n\n你绕着墓走一圈，注意看墓壁的砖。有的砖面上有手指按过的凹痕，那是当年制砖的工匠留下的。砖坯放在地上晾的时候，还是软的，工匠搬动、码放，手指就按进去了。一千七百多年后，这些指纹还在。你看到的不是\"文物\"，是一个人的手。\n\n搬家，是为了让这双手，被更多人看到。", "chars": 1045, "videos": []}, {"id": "hx19", "title": "六朝青瓷：南方的颜色", "text": "这一节，我们看六朝的青瓷。\n\n六朝，是三国吴、东晋、宋、齐、梁、陈六个朝代，都建都建康（南京），统治南方。苏州是六朝的腹地，墓葬里出了不少青瓷。\n\n青瓷的颜色，是\"青\"：青灰、青绿、青黄。为什么是青？因为釉里有铁，烧的时候缺氧，铁变成\"亚铁\"，就发青。如果氧气多，铁变成\"三价铁\"，就发黄、发褐。所以烧青瓷，要控制窑里的气氛：先氧化，后还原。这个技术，六朝的窑工已经掌握了。\n\n青瓷的产地，主要是浙江的越窑。越窑在绍兴、宁波一带，从东汉开始烧，到唐宋达到顶峰。苏州离越窑不远，青瓷通过运河、水路运过来。\n\n青瓷的器形，有盘口壶、鸡首壶、罐、碗、盏、唾壶、虎子。盘口壶是酒器，口做成盘状，方便倒酒；鸡首壶是水器，壶嘴做成鸡头，好看又实用；虎子是便器，做成老虎的形状，很生动。\n\n青瓷的纹饰，有弦纹、水波纹、莲瓣纹、贴塑。贴塑是把小泥片贴在器身上，做出动物、人物。六朝的青瓷，喜欢贴塑：龙、凤、羊、狮、佛像。为什么？因为佛教传入，莲花、佛像成了流行的纹饰。\n\n青瓷的釉，容易剥落。为什么？因为胎和釉的膨胀系数不一样，烧成后冷却，釉就裂、就掉。所以六朝青瓷，很多都有\"剥釉\"的现象。你在展柜里看到的那些青瓷，釉面不完整，不是坏，是\"老\"。\n\n青瓷的价值，不只在\"好看\"，在\"技术\"。它是中国最早的成熟瓷器：胎质坚致，釉层均匀，烧成温度高。瓷器从陶器发展而来，关键的一步，就是青瓷。有了青瓷，才有后来的白瓷、青花、彩瓷。\n\n六朝的青瓷，还反映了生活。盘口壶、鸡首壶、唾壶、虎子，都是日常用品。一个人死了，把这些东西随葬，是希望他在另一个世界，还能喝酒、喝水、洗手、方便。生前的日子，死后还要过。\n\n你在这间展厅看到的青瓷，可能出自孙吴一号墓，也可能出自别的六朝墓。它们不大，但很完整。一千七百年前，一个人用它们喝酒、喝水；今天，你隔着玻璃看它们。\n\n一种颜色，能代表一个时代。六朝的南方，就是青瓷的颜色。", "chars": 778, "videos": []}, {"id": "h13", "title": "都会寻踪（中）：一支龙首金钗", "text": "墓的旁边，是它的随葬品。一整排展柜，灯光打得很低。\n\n先说那支金钗。\n\n它躺在深色绒布上，长二十六厘米，重二十七点一克。钗头是一条龙：龙嘴张开，龙角后掠，眼睛、耳朵、鬃毛都用极细的金丝和金片做出，龙鳞是一颗一颗小金珠焊上去的。这种工艺叫“炸珠”：把金丝剪成小段，熔成小球，再一颗一颗焊到器物上。焊的时候温度差一点就化，差一点就粘不住，全靠手上的功夫。\n\n这支钗的主人，是一位年轻女性，地位很高。为什么这么说？因为钗的规格、工艺，不是普通人能用的；更因为，苏州博物馆里还藏着一支凤首金钗，形制、工艺、尺寸跟它是一对。一支龙首、一支凤首，分藏在两个馆里。考古学家推断，它们原本属于同一个人，或者同一场葬礼。\n\n一对钗，隔着一座城，各自躺在展柜里。你站在这里看龙，走几公里到苏博看凤，才能把一件完整的东西拼起来。这是考古博物馆常有的遗憾：东西出来了，但被分开了。\n\n除了金钗，墓里还出土了五十八件金器：金镯、金环、金珠、金饰片。有的薄得像纸，有的细得像线。金器在那个年代不是流通货币，是身份的标志。一个人身上带这么多金，说明她的家族有实力，也说明孙吴上层的生活有多讲究。\n\n铜器只有四件，但件件精。同一时期的一件龙首铜熏，器身是镂空的，盖顶做成龙首，烟从龙嘴里出来。熏炉是贵族生活里的日常器物：焚香、熏衣、驱虫。你想想那个画面：一千七百年前，一位年轻女子坐在堂上，熏炉里的香烟从龙口袅袅升起，她头上戴着那支龙首金钗。这两件东西，是同一个人生活里的两个片段。\n\n瓷器是另一大类。青瓷盘口壶、青瓷罐、青瓷碗，釉色青灰，胎体坚致。孙吴时期的青瓷，是越窑系统的早期产品，釉层薄，容易剥落，但已经是真正的瓷器，不是原始瓷。墓里还出了陶器、石器、玉器、琥珀、琉璃。琥珀和琉璃不是本地产物，是从外面换来的。一条海上或陆上的贸易线，在这座墓里留下了痕迹。\n\n墓的旁边还有两座墓。二号墓是陪葬墓，时代相同，出土了一批精美文物；五号墓建在一号墓的封土里，出了“建兴二年七月廿一日吴王”纪年砖和“吴侯”文字砖。三座墓埋在一个土墩里，说明这是一处家族墓地。孙吴的宗室，把家族的死者集中埋在一起，地面上堆起高大的封土。一千七百年后，封土被推平，下面的人被请进了博物馆。\n\n这一厅的最后一件展品，是一张墓主复原像。画的是个年轻女子，梳着高髻，插着金钗。复原像不是凭空画的，是根据头骨、随葬品、文献综合推断的。她长什么样，没人知道；但她戴过什么、用过什么，我们知道。考古学能给的，就是这些。", "chars": 1009, "videos": [{"platform": "bilibili", "title": "沉睡1800年的孙吴贵族墓重见天日", "url": "https://www.bilibili.com/video/BV1V7NkzzEzt/", "note": "讲墓主身份与出土金器"}]}, {"id": "hx8", "title": "龙首金钗：一对钗的分离", "text": "这一节，我们看一支钗。长二十六厘米，重二十七点一克，钗头是一条龙。\n\n它躺在深色绒布上，灯光打得很低。龙嘴张开，龙角后掠，眼睛、耳朵、鬃毛都用极细的金丝和金片做出，龙鳞是一颗一颗小金珠焊上去的。这种工艺叫\"炸珠\"：把金丝剪成小段，熔成小球，再一颗一颗焊到器物上。焊的时候温度差一点就化，差一点就粘不住，全靠手上的功夫。\n\n这支钗的主人，是一位年轻女性，地位很高。为什么这么说？因为钗的规格、工艺，不是普通人能用的；更因为，苏州博物馆里还藏着一支凤首金钗，形制、工艺、尺寸跟它是一对。一支龙首、一支凤首，分藏在两个馆里。考古学家推断，它们原本属于同一个人，或者同一场葬礼。\n\n一对钗，隔着一座城，各自躺在展柜里。你站在这里看龙，走几公里到苏博看凤，才能把一件完整的东西拼起来。这是考古博物馆常有的遗憾：东西出来了，但被分开了。\n\n为什么会被分开？因为出土的时候，它们可能不在同一个位置；也可能因为修复、调拨、展览的需要，被分到了不同的单位。博物馆的藏品，不是一开始就完整的，是慢慢聚起来的，也是会分开的。你在一个馆里看到的\"孤品\"，可能只是\"另一半在别处\"。\n\n除了金钗，墓里还出土了五十八件金器：金镯、金环、金珠、金饰片。有的薄得像纸，有的细得像线。金器在那个年代不是流通货币，是身份的标志。一个人身上带这么多金，说明她的家族有实力，也说明孙吴上层的生活有多讲究。\n\n金器的工艺，值得细说。锤揲：把金块反复捶打，打成薄片，再剪、再弯、再焊。掐丝：把金丝掐成花纹，焊在器物上。炸珠：把金丝熔成小球，一颗一颗焊。镶嵌：把宝石、琉璃嵌进金饰。这四种工艺，孙吴的金器全用了。你看到的每一件，都是几种工艺的组合。\n\n孙吴的金器，还有一个特点：喜欢动物。龙、凤、虎、蟾蜍、神兽，都是常见的题材。为什么？因为动物有神性，能通灵，能辟邪。戴在身上，不只是好看，是保平安。\n\n这支龙首金钗，跟凤首金钗是一对，一龙一凤。龙和凤，在中国文化里是\"一对\"的象征：龙代表阳、代表君、代表男；凤代表阴、代表后、代表女。一对钗，可能是婚礼的礼物，也可能是身份的配套。它们的女主人，可能是孙吴宗室里的一位贵妇，也可能是一位早逝的年轻女子。\n\n你再看钗的插脚。两根细长的金脚，微微弯曲，插进发髻里。为什么要弯？因为直的不牢，弯的能卡住头发。这个小设计，说明做钗的人，懂生活。\n\n一千七百年前，一位女子对着铜镜，把这支钗插进发髻。今天，它躺在展柜里，灯光照着龙首。她的脸我们没有见过，但她的钗，我们看得清清楚楚。考古能做的，就是把这样的一件东西，从土里请出来，让你看见。", "chars": 1047, "videos": []}, {"id": "h14", "title": "都会寻踪（下）：过日子用的东西", "text": "从三国往下走，时间一下子快了起来。这一厅讲的是“过日子”。\n\n先看那件唐三彩粉盒。\n\n盒子不大，扁圆形，盖和身子母口扣合。盖面上施黄、绿、白三色釉，釉子流淌交融，像一块打翻的颜料。三彩是低温铅釉，烧成温度不高，釉色鲜艳但容易剥落。这件粉盒的釉保存得不错，盖沿有一圈细小的开片。\n\n粉盒是装化妆品的：粉、胭脂、香膏。唐代女性化妆步骤很多，敷粉、涂胭脂、画眉、点唇，一套下来要小半个时辰。粉盒是随身物件，也是陪嫁、赠礼。苏州出土唐三彩，说明唐代的苏州不是闭塞的乡下：三彩的主要产地在河南、陕西，一件东西从中原运到江南，要么走运河，要么走商路。\n\n再看那枚明金戒指。\n\n戒指很小，金质，戒面是一个小小的方形，上面錾刻着花纹。明代的金银首饰，工艺已经非常精细：锤揲、錾刻、累丝、镶嵌，样样都有。这枚戒指出自明代的墓葬，墓主大概率是一位女性。戒指戴在手上，是装饰，也是身份；死后随葬，是家人给她的最后一件礼物。\n\n旁边那件陶骆驼，是另一条线索。\n\n骆驼不是江南的动物，它出现在苏州的墓葬里，只有一个解释：它是“丝绸之路”的符号。唐代的苏州，通过运河连接洛阳、长安，再通过陆路连接西域。骆驼俑随葬，是希望在另一个世界也能继续走那条路。一件陶骆驼，把一个江南城市和几千里外的沙漠连在了一起。\n\n这一厅还有铜镜、青瓷执壶、金银饰件、钱币。铜镜的背面铸着瑞兽、葡萄、缠枝花纹，正面磨得能照人。青瓷执壶是酒器，壶身圆鼓，肩部有流，把手做成带状。钱币从开元通宝到宋代年号钱，一串一串，说明这里的商业一直没有断。\n\n把这一厅的东西连起来看，是一幅生活图景：唐代的女人用三彩粉盒化妆，男人用青瓷执壶喝酒；宋代人照铜镜、用钱币；明代的女人戴金戒指。朝代换了，日子还在过。考古学管这个叫“物质文化史”——听起来学术，其实就是“古人用什么”。\n\n这一厅的墙上，挂着《平江图》的局部放大。图上画着街巷、桥梁、店铺、寺庙。你对照展柜里的器物看：图上的店铺卖什么？可能就卖这些瓷器、铜镜、金银饰件。图上的桥边有什么？可能有茶馆、有酒肆。一件器物，落在图上的某个位置，就有了具体的场景。\n\n考古博物馆最动人的地方，就在这儿：它不只告诉你“这是唐代的”，还告诉你“这是唐代某个人早上用过的东西”。", "chars": 905, "videos": []}, {"id": "hx20", "title": "铜镜：一面镜子的背面", "text": "这一节，我们看铜镜。看它的背面。\n\n铜镜的正面，是磨光的，能照人。背面，是铸出来的，有纹饰、有铭文。正面千篇一律，背面千姿百态。所以看铜镜，看背面。\n\n铜镜的材料，是青铜：铜加锡。锡多了，镜面白亮，但脆；锡少了，韧，但不够亮。铸好之后，正面要磨：用砺石粗磨，用木炭细磨，最后用布抛光。磨好的镜面，能照出人影。\n\n铜镜的纹饰，按时代变。汉代，流行规矩镜、神兽镜、画像镜；唐代，流行瑞兽葡萄镜、花鸟镜、人物镜；宋代，流行缠枝花、八卦镜；明清，流行吉祥语、人物故事。\n\n唐代的瑞兽葡萄镜，最有名。镜背高浮雕，中间是几只瑞兽（狮子、海兽），周围是葡萄藤、葡萄串。瑞兽和葡萄，都是从西域传来的题材。一面镜子，能看到中外交流。\n\n铜镜的铭文，也很有意思。汉代的镜铭，多是吉语：\"见日之光，天下大明\"\"长相思，毋相忘\"。唐代的镜铭，多是\"照心\"\"清光\"。宋代的镜铭，多是商标：\"湖州石家\"\"张家造\"。一面镜子，能看出一个时代的语言、信仰、商业。\n\n铜镜的用途，不只是照脸。它可以挂在墓里，辟邪；可以送给新娘，做嫁妆；可以作为礼品，送人。一面镜子，是日用品，也是礼器。\n\n铜镜的铸造，用\"范铸法\"：先做泥范，刻纹饰，再浇铜水。一面镜子，一个范，范用完就毁。所以每一面镜子，都是\"孤品\"：纹饰再像，也有细微差别。\n\n你在这间展厅看到的铜镜，背面朝上，灯光斜打，纹饰的凹凸很清楚。你可以想象：一千年前，一个人对着这面镜子，梳头、画眉、看自己。镜子里的人，早就没了；镜子还在。\n\n一面镜子，照过多少张脸？没人知道。但它背面的纹饰，记录了一个时代的审美。", "chars": 647, "videos": []}, {"id": "hx21", "title": "磨喝乐：宋代的陶玩具", "text": "这一节，我们看点\"小玩意\"：磨喝乐。\n\n磨喝乐，是宋代的陶玩具，小塑像，有娃娃、有动物、有故事人物。宋代七月初七，街上卖磨喝乐，小孩拿着玩。为什么叫\"磨喝乐\"？这个名字来自佛教，原指一种神，后来变成了娃娃的形状。\n\n磨喝乐的尺寸，一般十几厘米，小的几厘米。材料是泥，模制，然后烧。有的素面，有的上彩。造型圆润，脸胖胖的，带着笑。为什么这么造型？因为要讨小孩喜欢，也要讨大人喜欢——买的人是大人，玩的人是小孩。\n\n磨喝乐的题材，有娃娃、有仕女、有乐人、有动物。娃娃最多，因为\"多子多福\"。有的娃娃抱着鲤鱼，寓意\"年年有余\"；有的娃娃抱着莲花，寓意\"连生贵子\"。一个小小的玩具，装着一堆吉祥话。\n\n磨喝乐的制作，是\"模制\"：先刻一个母模，再用母模翻出很多子模，把泥压进子模，取出，修整，烧。模制的好处是量产：一个模，能做几百个。宋代的市井，玩具是商品，要量产，要便宜。\n\n磨喝乐的价值，不在\"贵\"，在\"生活\"。它告诉我们：宋代的城里，有市场，有玩具，有儿童，有节日。一个社会，能给孩子做玩具，说明它有\"余力\"：吃饱了，才有心思玩。\n\n你在这间展厅看到的磨喝乐，个头不大，塑得圆润，脸上还带着笑。一千年了，笑还在。你可以想：一个宋代的小孩，拿着这个娃娃，在街上跑；回家，把它放在床头；睡着了，娃娃还在笑。\n\n考古出土的玩具，不多。为什么？因为玩具是\"小东西\"，容易丢、容易碎，也不太被人重视。能留下来的，都是运气。所以每一件玩具，都很珍贵：它是\"日常\"的证据。\n\n历史书里，写的是皇帝、战争、制度；玩具里，写的是孩子、节日、笑声。两种历史，都是真的。", "chars": 656, "videos": []}, {"id": "hx23", "title": "唐三彩粉盒：一只盒子里的唐代", "text": "这一节，我们看一只小盒子：唐三彩粉盒。\n\n盒子不大，扁圆形，盖和身子子母口扣合。盖面上施黄、绿、白三色釉，釉子流淌交融，像一块打翻的颜料。三彩是低温铅釉，烧成温度不高，釉色鲜艳，但容易剥落。这件粉盒的釉保存得不错，盖沿有一圈细小的开片。\n\n粉盒是装化妆品的：粉、胭脂、香膏。唐代女性化妆步骤很多：敷粉、涂胭脂、画眉、点唇、贴花钿。一套下来要小半个时辰。粉盒是随身物件，也是陪嫁、赠礼。\n\n三彩的\"三\"，不是只有三种颜色，是\"多\"的意思。黄、绿、白、褐、蓝，都能出现。釉里加铅，降低烧成温度；加铜，发绿；加铁，发黄；加钴，发蓝。釉在窑里流动，颜色互相渗，出来就是\"窑变\"。每一件三彩，颜色都不一样。\n\n三彩的产地，主要在河南巩义、陕西铜川。苏州出土三彩，说明唐代的苏州不是闭塞的乡下：三彩从中原运到江南，要么走运河，要么走商路。一件粉盒，走了上千里。\n\n唐代的女性，为什么用这么大的粉盒？因为粉要调、要存。唐代的粉，是米粉或铅粉，加水调成糊。粉盒要密封，防止干裂。盖子和身子扣合，就是密封。一只盒子，是\"化妆品\"和\"容器\"的结合。\n\n三彩的工艺，分两步：先素烧，施釉，再低温烧。素烧让胎结实，施釉让颜色附着。低温烧（八百到九百度）让釉流动，但不让胎变形。两次烧，比一次烧麻烦，但效果好。\n\n你在这间展厅看到的粉盒，釉色有点剥落。为什么？因为铅釉和胎的膨胀系数不一样，时间长了就掉。这不是\"坏\"，是\"老\"。一件东西老了，才有故事。\n\n唐代之后，三彩衰落了。为什么？因为瓷器起来了。瓷器比陶器硬、比陶器白、比陶器实用。三彩是\"陶\"，瓷器是\"瓷\"，一字之差，一个时代过去了。\n\n一只粉盒，能看到唐代的审美：喜欢浓艳、喜欢流动、喜欢外来。唐代的长安，是世界的长安；唐代的苏州，也跟着沾了光。\n\n你看着这只盒子，可以想：一千三百年前，一位女子坐在镜前，打开盒子，蘸一点粉，拍在脸上。盒盖上的三彩，映着烛光。那一刻，跟今天一个女孩打开化妆盒，没什么两样。", "chars": 800, "videos": []}, {"id": "hx24", "title": "明金戒指：一枚戒指的一生", "text": "这一节，我们看一枚戒指。\n\n戒指很小，金质，戒面是一个小小的方形，上面錾刻着花纹。明代的金银首饰，工艺已经非常精细：锤揲、錾刻、累丝、镶嵌，样样都有。\n\n锤揲：把金块反复捶打，打成薄片；錾刻：用錾子在金片上刻花纹；累丝：把金丝盘成花纹，焊上去；镶嵌：把宝石嵌进金饰。一枚戒指，可能要几种工艺配合。\n\n戒指的来历，很早。中国最早的戒指，见于新石器时代，是骨环、石环。汉代的戒指，叫\"指环\"，多为金属。到了明代，戒指成了定情、婚嫁的信物。一枚戒指，套在手上，是\"约束\"，也是\"承诺\"。\n\n戒指的戴法，有讲究。明代，戒指戴在哪个手指，代表不同的意思：戴在无名指，是已婚；戴在中指，是订婚；戴在食指，是想结婚。这些规矩，今天还在用。\n\n这枚戒指出自明代的墓葬，墓主大概率是一位女性。戒指戴在手上，是装饰，也是身份；死后随葬，是家人给她的最后一件礼物。\n\n明代的苏州，是全国的奢侈品中心。苏州的金银器、丝绸、家具、玉器，都是天下第一。为什么？因为苏州有钱，有文人，有工匠。有钱的人要消费，有文人要审美，有工匠要吃饭。三样凑齐，就出了\"苏作\"。\n\n\"苏作\"的特点，是\"精、雅、巧\"。精，是工艺细；雅，是品味高；巧，是设计妙。一枚戒指，不是越大越好，是越\"巧\"越好。錾刻的花纹，要细；镶嵌的宝石，要配；整体的比例，要舒服。\n\n你在这间展厅看到的戒指，很小，很素。没有大宝石，没有复杂的花。为什么？因为明代的审美，讲究\"素雅\"。一件东西，不靠\"贵\"取胜，靠\"雅\"取胜。\n\n一枚戒指，能告诉我们什么？能告诉我们明代的工艺、审美、婚俗、经济。它不只是一件首饰，是一个时代的\"切片\"。\n\n你看着这枚戒指，可以想：四百年前，一位女子把它戴在手上；她可能年轻，可能年老；她可能幸福，可能不幸。戒指不会说话，但它记得她的手。", "chars": 728, "videos": []}, {"id": "hx25", "title": "陶骆驼：从苏州到西域", "text": "这一节，我们看一头骆驼。陶做的，不大，站在展柜里。\n\n骆驼不是江南的动物。它生活在沙漠、戈壁，耐旱、耐渴、能负重。它出现在苏州的墓葬里，只有一个解释：它是\"丝绸之路\"的符号。\n\n唐代的苏州，通过运河连接洛阳、长安，再通过陆路连接西域。骆驼是丝路上的\"货车\"：一峰骆驼，能驮几百斤货，走几十天，穿过沙漠。商队牵着骆驼，从长安出发，经河西走廊，到西域，再往西，到中亚、西亚。\n\n骆驼俑随葬，是希望在另一个世界，也能继续走那条路。唐代的墓葬里，骆驼俑、胡人俑、马俑，常常成套出现。它们代表的，是\"远方\"：远方的人、远方的货、远方的路。\n\n陶骆驼的制作，是模制加手塑：身子用模，头、腿、驼峰用手塑，再粘接。烧成之后，施釉或彩绘。唐代的骆驼俑，多为三彩，颜色鲜艳。你看到的这头，可能是彩绘陶，颜色淡了，但姿态还在：昂着头，跪着或站着，背上驮着货。\n\n骆驼的姿态，有讲究。有的是\"跪卧\"，表示休息；有的是\"昂首\"，表示行走；有的是\"嘶鸣\"，表示呼唤。不同的姿态，代表不同的场景。一组骆驼俑，能还原一支商队。\n\n苏州出土骆驼俑，说明什么？说明唐代的苏州，跟丝路有联系。苏州的丝绸、瓷器，可能通过运河、丝路，卖到西域；西域的香料、宝石、玻璃，也可能卖到苏州。一头骆驼，是一个\"贸易\"的证据。\n\n你在这间展厅看到的骆驼，个头不大，但很生动。它的背上，可能驮着丝绸，也可能驮着瓷器。它从长安来，走到苏州，留在了墓葬里。\n\n一条丝路，把江南和西域连在一起。一头骆驼，把这段路，留在了苏州。\n\n你看着它，可以想：一千三百年前，一支商队，牵着骆驼，走在戈壁上。风沙很大，驼铃很响。他们不知道，自己走的这条路，会被后人叫作\"丝绸之路\"。", "chars": 686, "videos": []}, {"id": "h15", "title": "海丝遗痕（一）：城北的一把窑火", "text": "“海丝遗痕”的第一组展柜，讲的是苏州城北的一把火。\n\n元和塘，在齐门外，一条南北向的河。河道两岸，考古队发现了一处南宋时期的窑址。窑不算大，但出土的东西很特别：不是碗、不是盘，是一批陶礼器。\n\n什么叫陶礼器？就是照着青铜礼器的样子，用陶土烧出来的鼎、簋、壶、豆。鼎有三足、两耳，腹部装饰着兽面纹；簋是圆腹、圈足，两侧有耳；壶有盖、有流、有把。这些器形，本来是商周青铜器的形制，南宋的人拿来用陶土复刻，烧成之后用于祭祀、随葬。\n\n为什么用陶仿铜？因为铜贵。南宋偏安江南，铜料紧张，铜器是国家管控的物资。但礼制不能废，祭祀要有鼎簋，怎么办？用陶代替。这个做法在宋代很普遍，叫“陶礼器”。元和塘的窑，就是专门烧这个的。\n\n展柜里有一件陶鼎，你可以看它的耳朵：耳朵是单独做好，再粘上去的，接缝处有抹泥的痕迹。三足也是后接的。这种“分体制作、粘接成型”的办法，是为了防止大件器物在烧的时候开裂。旁边有一件陶壶，壶身用轮制，壶嘴和把手是手捏的，接上去再修整。\n\n窑址里还出土了大量的窑具：垫饼、支圈、匣钵。垫饼垫在器物底下，防止粘窑；支圈把器物隔开；匣钵把器物罩住，防止烟灰落在釉面上。这些其貌不扬的陶块，是烧窑的“工艺参数”。考古学家看窑具，就能推断窑炉的结构、装烧的方式、产量的大小。\n\n烧窑是一件赌运气的事。一窑装几十件，火候差了，釉色不匀；火太猛，器物变形；开窑早了，冷风一激，全裂。所以窑工要会看火色：火苗发红是低温，发白是高温，看火孔里的颜色，判断什么时候封窑。一窑的成败，就在这几个时辰里。废品怎么办？砸碎，扔掉，堆在窑场旁边。考古队挖到的废品堆，往往比正品更能说明问题：哪一类器物烧得多、哪一类总烧坏，一看废品堆就知道。\n\n元和塘的窑，为什么重要？因为它证明了一件事：南宋的苏州，不只是消费城市，还是生产城市。它有窑、有作坊、有手工业者。这些陶礼器烧出来，卖给谁？卖给城里的祠堂、寺庙、富户，也可能沿着运河卖到外地。一条河，把原料运进来，把产品运出去。\n\n这一厅的展板上，有一张南宋苏州的复原图：城北是窑场，城南是市集，城中有河道。你看着这张图，再想想刚才那些陶鼎、陶壶：它们不是孤立的东西，它们是一座城市的手艺。", "chars": 893, "videos": []}, {"id": "hx10", "title": "元青花：一船蓝色的瓷器", "text": "这一节，我们专门看青花。不是明清的青花，是元代的青花——中国瓷器史上最\"贵\"的一种。\n\n先看颜色。展柜里那件青花盘，盘心画着缠枝莲，蓝色浓艳，蓝里带一点黑，有些地方有铁锈一样的斑点。这种蓝，不是中国本土的钴料发出来的，是进口的\"苏麻离青\"，产地在今天的伊朗一带。苏麻离青含铁高、含锰低，烧出来的蓝色浓、艳、沉，还有晕散和铁锈斑。明清的国产钴料，蓝得比较\"干净\"，但没有这种厚重感。\n\n元代为什么会有进口钴料？因为贸易。元代的疆域横跨欧亚，陆上丝绸之路和海上丝绸之路都通。波斯的钴料，通过陆路或海路运到景德镇，景德镇的窑工用它画青花，再卖到中东、东南亚、日本。一件元青花，原料是进口的，工艺是中国的，市场是世界的。它是\"全球化\"的早期产品。\n\n青花的工艺，分几步：制胎、绘画、施釉、烧成。胎用高岭土，白而细；绘画用钴料，在胎上画，画完罩一层透明釉；然后入窑，一千三百度高温一次烧成。青花的蓝，是釉下的，永远不会掉。你看到的纹饰，被一层玻璃一样的釉盖着，摸上去是光滑的。\n\n元青花的纹饰，很有特点。主题纹饰多是缠枝莲、牡丹、云龙、瑞兽；辅助纹饰是卷草、回纹、蕉叶、莲瓣。画面满，层次多，一件大盘上能画七八层纹饰。为什么画这么满？因为外销。中东的客户喜欢满密、华丽，景德镇的窑工就按订单画。客户的审美，决定了产品的样子。\n\n元青花的器形，也跟外销有关。大盘、大罐、大瓶，尺寸比国内用的大得多。为什么？因为中东人吃饭是合餐，用大盘；存水、存酒用大罐。景德镇按客户的需求，专门烧大件。一件元青花大盘，直径能到四五十厘米，在当时是\"高科技\"：胎要厚，釉要匀，烧的时候不能变形。\n\n元青花存世量很少。全世界博物馆加私人收藏，也就几百件。为什么少？一是元代青花主要外销，国内留存少；二是元末战乱，窑场毁了不少；三是青花在明代才流行，元代的东西，明代人不太重视，毁的毁，丢的丢。到了二十世纪，元青花才被重新认识。一件\"鬼谷子下山\"罐，2005年在伦敦拍出两亿多人民币，就是元青花。\n\n你在这间展厅看到的这件青花盘，可能就是樊村泾仓库里的一件。它从景德镇来，经过鄱阳湖、长江，到太仓，进仓库，再上船。它的目的地，可能是日本，可能是东南亚，也可能是中东。它没有走完那条路，留在了仓库里，被土埋了七百年。\n\n一件瓷器，能告诉我们什么？能告诉我们原料从哪来，工艺怎么变，市场在哪里，审美是谁定的。它不只是一件\"好看的盘子\"，是一张\"贸易地图\"。\n\n你再看盘底。圈足上有几道细细的旋纹，是修坯时留下的；釉面上有几个小气泡，是烧成时留下的。这些\"瑕疵\"，是手工的证据。今天的仿品，做得再像，也做不出这种\"活\"的痕迹。\n\n元青花之后，青花成了中国瓷器的主流，一直到现在。你家里吃饭的碗，可能就有青花的影子。一条从波斯到景德镇、从太仓到世界的蓝色航线，走了七百年，还没走完。", "chars": 1150, "videos": []}, {"id": "h16", "title": "海丝遗痕（二）：太仓的瓷器仓库", "text": "这一厅的展柜，整面墙都是瓷器。青的、白的、蓝白相间的，一排一排，像瓷器仓库。\n\n这就是樊村泾。\n\n樊村泾在太仓，离长江口不远。二〇一六年，考古队在那里挖出了一处元代的大型建筑遗址：房址、道路、河道、码头、灰坑，还有成堆的瓷器。发掘者判断，这是一处港口仓储遗存，规模是国内已知同类遗址里最大的。它入选了当年的全国十大考古新发现。苏州那三次“十大”，这是第三次。\n\n为什么一个仓库能进“十大”？因为瓷器贸易是元代最重要的国际贸易之一，而樊村泾是这条贸易链上的一个关键节点。龙泉窑的瓷器从浙江龙泉出发，沿瓯江、经海运到太仓，在樊村泾的仓库里集中、分拣、打包，再装上大船，运往日本、朝鲜半岛、东南亚，甚至更远。\n\n展柜里最大宗的是龙泉青瓷。釉色粉青、梅子青，厚润如玉。器形有盘、碗、洗、罐、执壶。龙泉窑在元代达到顶峰，产品大量外销，樊村泾的仓库里堆的就是这些。\n\n旁边是元青花。青花瓷在元代成熟，用钴料在胎上绘画，罩透明釉，高温一次烧成。展柜里那件青花盘，盘心画着缠枝莲，蓝色浓艳，有铁锈斑——那是进口钴料“苏麻离青”的特征。元青花在当时是高档货，能出现在太仓的仓库里，说明这里的贸易层级不低。\n\n还有几件带年款的东西，是断代的“标尺”。“至元四年”款的青瓷碗底，碗底圈足内刻着“至元四年”四个字，至元是元世祖忽必烈的年号，四年是一二六七年。还有一件“至正”款的纪年陶范，至正是元顺帝的年号。有明确纪年的器物，就像一把尺子，能校准整批东西的年代。\n\n最有意思的是一件“天下”款的青瓷碗。碗底刻着“天下”两个字。这两个字什么意思？可能是窑场的字号，可能是商号的标记，也可能是某种吉祥话。一个碗，刻着“天下”，被装船运到海外——你可以想象那个场景：一只碗，从龙泉的山里烧出来，装进竹篓，走水路到太仓，进仓库，再上船，最后落在某个日本寺院或东南亚的厨房里。\n\n樊村泾的仓库，还出土了大量的陶范、窑具、垫饼。这些东西说明，仓库附近可能还有加工、修补的作坊。瓷器的贸易不只是“运”，还有“整”：坏的挑出来，好的重新包装，有的还要加款、加彩。\n\n这一厅的结尾，是一张贸易路线图：从龙泉到太仓，从太仓到长崎、到马六甲。一条线，把中国东南的山地和海外的市场连起来。苏州在这条线上，不是终点，是中转站。中转站的价值，在于它能让东西停下来、分拣、再出发。", "chars": 945, "videos": []}, {"id": "h17", "title": "海丝遗痕（三）：一只高丽青瓷碗", "text": "这一柜只有几只碗，但它们是从朝鲜半岛来的。\n\n高丽青瓷。釉色不叫“青”，叫“翡”——一种浅浅的、带点灰绿的蓝。灯下看，釉面有一层柔和的光泽，不像龙泉那样厚润，更像薄冰。碗的内壁，有一圈白色的花纹：几朵小花、几片叶子，线条是嵌进去的，摸上去有凹凸感。这种工艺叫“镶嵌”：先在胎上刻出纹样，填入白土或黑土，再施釉烧成。烧成之后，花纹就嵌在釉下，永远不会掉。\n\n高丽王朝在朝鲜半岛，从十世纪到十四世纪，持续了将近五百年。高丽青瓷是它最有名的产品，在宋代中国的文献里就有记载，说它“翡色”“天下第一”。这个评价是不是夸张，见仁见智；但高丽青瓷确实是东亚陶瓷史上的一支高峰。\n\n它为什么会在太仓？\n\n两个原因。第一，贸易。元代的太仓是长江口的国际港口，高丽、日本的商船常来。瓷器是硬通货，高丽的青瓷运到中国，中国的龙泉青瓷、元青花运到高丽，一来一往。第二，使团。元朝和高丽之间有频繁的使节往来，使团带着礼物、货物，走海路，在太仓一带登陆、中转。\n\n一只碗的旅程，大概是这样的：在高丽的窑场烧好，装进木箱，从礼成江口上船，沿海岸线南下，穿过黄海，进长江口，到太仓。卸货，进仓库，登记，再卖给中国的商人，或者转运到别的地方。它可能在某个中国人家里的桌上用了很多年，最后跟着主人下葬，被考古队挖出来。\n\n这一柜里还有一件青瓷盏托：托盘和盏是一套的，盏放在托上，托沿做成花瓣形。盏托是饮茶用的，宋代人点茶，讲究茶盏和茶托的配套。高丽的茶器和中国的茶器，形制互相影响。\n\n把这只碗和旁边的龙泉青瓷放在一起看，你会发现一个有意思的现象：两种青瓷，釉色不同、工艺不同、造型不同，但都在同一个仓库里。仓库是国际贸易的“交集点”，不同产地的东西在这里相遇。考古学家管这种遗址叫“消费地遗址”或者“集散地遗址”——它不生产，但它连接生产和消费。\n\n这一厅的说明牌上有一句话：“一只碗，可以是一个人的一生，也可以是一个时代的航线。”你看着这只高丽青瓷碗，可以想想它走过的海路。", "chars": 806, "videos": []}, {"id": "hx11", "title": "黄泗浦：鉴真从这里出海", "text": "这一节，我们讲一个人，和一条海路。\n\n人叫鉴真，唐代扬州大明寺的和尚。路，是从张家港的黄泗浦出海，去日本。\n\n先讲背景。唐代的中国，是东亚的文化中心。日本派\"遣唐使\"来中国学习，学佛法、学建筑、学医药、学文字。鉴真应日本僧人的邀请，决定去日本传戒。从743年开始，他六次东渡。\n\n第一次，被官府拦下，说私渡。第二次，船在海上遇风，漂到舟山。第三次，又被拦。第四次，弟子告密，失败。第五次，出海遇大风，船漂到海南，同行的荣叡病死，鉴真自己也双目失明。第六次，753年，他从黄泗浦出发，带着弟子、工匠、经卷、佛像，坐船出海。这一次成功了。他到日本的时候，已经六十六岁，双目失明。\n\n这段历史，在中国和日本都很有名。但过去讲鉴真东渡，多讲扬州、讲日本，中间的出海口在哪里，说不清。黄泗浦遗址的发掘，把\"从哪里出海\"这个问题落到了地上。\n\n黄泗浦在哪？在张家港，长江的南岸。唐代，这里是长江入海口的一个港口。考古队挖出了河道、码头、建筑基址，还有成堆的瓷片。河道很宽，河底有木桩，岸边有石块垒的护坡。这不是一条小河沟，是一个能停船的港。2018年，它入选了全国十大考古新发现。\n\n码头怎么用？船靠岸，搭跳板，人货上下。考古队发现的码头，有木桩、有横木、有石块，结构清楚。码头旁边，是建筑基址，可能是仓库、驿馆、寺庙。出海前，人要在这里等风、等船、补给。\n\n展柜里有一组长沙窑的瓷片。长沙窑在湖南，唐代中晚期大量生产外销瓷，釉下彩绘，写着诗、画着花。这些瓷片出现在黄泗浦，说明这个港口不只走人，也走货。瓷器从长江中游运下来，在黄泗浦中转，再出海。\n\n还有一组青瓷、白瓷的标本，来自越窑、邢窑。不同窑口的东西在同一个港口出现，说明这里的贸易网络很广。唐代的中国，通过这样的港口，把瓷器、丝绸、茶叶卖到日本、朝鲜、东南亚、中东。\n\n鉴真带去了什么？不只是佛法。他带去了建筑工匠，按唐代的风格，在日本造了唐招提寺；带去了医药，校正了日本的药典；带去了书法、雕塑、饮食。一个人，一条船，把两个国家的文化连在了一起。\n\n你站在这一厅，可以把苏州的海丝故事连起来：唐代的黄泗浦，是起点；元代的太仓樊村泾，是中转仓库；再往后的刘家港，是郑和下西洋的起锚地。三个点，一条线，都在苏州境内。苏州不是\"海边城市\"，但它通过长江、通过运河、通过太仓和张家港的港口，一直连着海。\n\n展板上有一张鉴真东渡的路线图。图上画着从扬州到黄泗浦，从黄泗浦出海，到日本九州。你看着那条线，会想到一件事：一千二百年前，一个失明的老人，带着一群人，从这片江口出发，去一个他看不见的地方。他带去的，不只是佛法，还有一整套文明。\n\n一条海路，把两个国家连在了一起。一个港口，把一段历史落在了地上。", "chars": 1097, "videos": []}, {"id": "h18", "title": "海丝遗痕（四）：从黄泗浦出海", "text": "从太仓往北，到张家港，有一处遗址叫黄泗浦。\n\n黄泗浦在唐代是长江入海口的一个港口。考古队在那里挖出了河道、码头、建筑基址，还有成堆的瓷片。河道很宽，河底有木桩，岸边有石块垒的护坡。这不是一条小河沟，是一个能停船的港。二〇一八年，它入选了全国十大考古新发现。\n\n黄泗浦最有名的一件事，是鉴真东渡。\n\n唐代天宝年间，扬州大明寺的鉴真和尚，应日本僧人的邀请，决定去日本传戒。从七四三年开始，他六次东渡。前五次，要么被官府拦下，要么遇到风浪，要么船破，都没成功。第六次，七五三年，他从黄泗浦出发，带着弟子、工匠、经卷、佛像，坐船出海。这一次成功了。他到日本的时候，已经双目失明。\n\n这段历史，在中国和日本都很有名。但过去讲鉴真东渡，多讲扬州、讲日本，中间的出海口在哪里，说不清。黄泗浦遗址的发掘，把“从哪里出海”这个问题落到了地上：河道、码头、瓷片，就是证据。\n\n展柜里有一组长沙窑的瓷片。长沙窑在湖南，唐代中晚期大量生产外销瓷，釉下彩绘，写着诗、画着花。这些瓷片出现在黄泗浦，说明这个港口不只走人，也走货。瓷器从长江中游运下来，在黄泗浦中转，再出海。\n\n还有一组青瓷、白瓷的标本，来自越窑、邢窑。不同窑口的东西在同一个港口出现，说明这里的贸易网络很广。\n\n站在这一厅，你可以把苏州的海丝故事连起来：唐代的黄泗浦，是起点；元代的太仓樊村泾，是中转仓库；再往后的刘家港，是郑和下西洋的起锚地。三个点，一条线，都在苏州境内。苏州不是“海边城市”，但它通过长江、通过运河、通过太仓和张家港的港口，一直连着海。\n\n这一厅的展板上，有一张鉴真东渡的路线图。图上画着从扬州到黄泗浦，从黄泗浦出海，到日本九州。你看着那条线，会想到一件事：一千二百年前，一个失明的老人，带着一群人，从这片江口出发，去一个他看不见的地方。他带去的，不只是佛法，还有建筑、雕塑、医药、文字。一条海路，把两个国家连在了一起。", "chars": 773, "videos": []}, {"id": "h19", "title": "我们的姑苏城：街巷下面的城", "text": "负一层的角落里，有一个临展厅，叫“我们的姑苏城”。\n\n临展和常设展不一样：常设展讲的是“苏州从哪来”，临展讲的是“最近又挖出了什么”。这个厅展的是近几年苏州古城考古的成果：金城新村、北园、混堂巷北，几个遗址的器物摆在一起。\n\n先说北园。北园在古城东北，考古队在那里挖出了东周时期的墓葬和生活遗迹，出土了青铜剑、陶器、原始瓷。那把青铜剑不长，剑身有锈，但形制清楚：剑格窄，剑身起脊，是典型的东周吴越剑。北园在古城墙内，说明两千多年前这里已经有人居住、有墓葬。\n\n再说混堂巷北。那里出土了一件陶罐，肩上拍印着“吴市”两个字。这两个字，和前面金城新村出土的秦“右”字瓦、余天灯巷出土的楚“大市”量器，是同一个系统的证据：苏州古城在战国到秦，已经有官方管理的市场。“吴市”的“吴”，是吴地的吴；“市”，是市场。一个陶罐，证明这里有过交易。\n\n金城新村，前面讲过：秦代的官署建筑构件，把会稽郡治的位置锚定了。这个临展里，金城新村的展品更全：瓦当、铺地砖、下水管道、陶井圈。下水管道是陶制的，一节一节套起来，埋在街道下面。两千年前的市政工程，做得比我们想的讲究。\n\n这一厅还有一段古城墙的剖面照片。苏州的城墙，从春秋到明清，一直在修、一直在用。墙土一层一层，每一层是一个朝代。墙里还嵌着前朝的砖、前朝的瓦，甚至前朝的墓碑——修墙的人就地取材，把能用的都砌进去了。考古学家管这叫“再利用”。\n\n临展的最后一块展板，写着这个展览的名字由来：“我们的姑苏城”。为什么用“我们的”？因为这些遗址不在荒郊野外，就在我们每天走过的街巷下面。修地铁、挖管道、盖房子，一铲子下去，可能就是宋代的街面、唐代的河道、春秋的城墙。城市考古就是这样：它跟着基建走，抢救性地挖，挖完回填，上面继续盖楼。\n\n这一厅会定期换展。你下次来，看到的可能又是另一批新东西。这正是考古博物馆的特点：它不是一座封存的殿堂，它是一个还在生长的仓库。", "chars": 783, "videos": []}, {"id": "hx13", "title": "考古摄影与三维扫描", "text": "这一节，我们讲\"记录\"：考古队怎么把地下的东西，原样搬到纸上、电脑里。\n\n先讲摄影。考古摄影，不是拍\"好看\"，是拍\"准确\"。一件器物，要拍正面、侧面、底面、口沿、纹饰细部，还要放比例尺。光要匀，不能有阴影；背景要干净，不能抢眼。为什么这么讲究？因为照片是\"证据\"，以后研究的人，要能靠照片判断器物的形制、纹饰、病害。\n\n拍遗址，更难。探方四壁的剖面，要拍\"正射\"：镜头垂直于剖面，不能斜。为了解决透视变形，考古队会用\"正射影像\"：拍很多张，拼接成一张没有变形的图。这样，剖面上的每一层土、每一条线，都能量出实际尺寸。\n\n再说测绘。过去用皮尺、罗盘、水平仪；现在用全站仪、RTK、无人机。全站仪打一个点，能测出三维坐标；无人机航拍，能生成整个遗址的正射影像和三维模型。一个遗址，几天就能测完，精度到厘米。\n\n三维扫描，是最近十几年的事。用激光扫描仪，绕着器物转一圈，得到一个\"点云\"：几百万个点，每个点有坐标、有颜色。点云连成面，就是三维模型。模型可以旋转、放大、剖切，可以看到器物的每一个细节。\n\n三维扫描有什么用？一是记录。器物会坏，模型不会。二是研究。可以在电脑上量尺寸、看纹饰、做对比。三是展示。观众可以在屏幕上转着看，不用隔着玻璃。四是修复。碎片的三维模型，可以在电脑上先\"拼\"一遍，再动手。\n\n但三维扫描不能代替手绘。为什么？因为扫描是\"复制\"，手绘是\"理解\"。画图的时候，你要判断哪条线是器物的轮廓，哪条线是阴影；哪个面是原来的，哪个面是修补的。画一遍，脑子才真的记住。所以考古队到现在，还要求队员会画图。\n\n记录的标准，是\"可复原\"。什么意思？就是一个没见过这件东西的人，只靠你的记录——照片、图纸、文字、坐标——能把它重新画出来、做出来。达不到这个标准，记录就不合格。\n\n你在这间展厅看到的那些老照片、老图纸，很多是几十年前拍的、画的。设备简陋，但记录严谨。一张1970年代的剖面图，今天还能用来做研究。为什么？因为画的人知道，他画的不是\"一张图\"，是\"一次性的现场\"。\n\n考古是\"破坏性\"的：挖掉的地层，不会再有。所以记录，是考古的\"第二次发掘\"：把现场搬到纸上、电脑里，让后来的人，还能\"再挖一次\"。\n\n你下次看考古报告，可以注意那些图：平面图、剖面图、器物图。每一根线，都是有人在现场，蹲着、趴着，一笔一笔画的。那些线，比照片更\"懂\"文物。", "chars": 961, "videos": []}, {"id": "hx14", "title": "文物库房：博物馆的另一半", "text": "这一节，我们看一个观众平时看不到的地方：库房。\n\n博物馆的展品，只占藏品的很小一部分。大部分文物，躺在库房里。苏州考古博物馆的库房，按材质分区：陶瓷、青铜、玉器、漆木器、骨骼，各有一片。温度、湿度、光照，都有控制。\n\n库房的架子，是特制的。金属架，防锈；层板垫无酸材料；每件文物放在囊匣里。囊匣是纸板做的盒子，里面垫棉花、海绵、无酸纸，按器物的形状挖槽。器物放进去，不会晃，不会碰，不会磨。\n\n每件文物都有一个编号。编号写在标签上，标签放在囊匣里，也写在账本上。账本记录：名称、年代、出土地点、尺寸、重量、完残程度、入藏时间、来源。一件文物，从出土到入库，要经过很多人的手，每一步都要签字。\n\n库房的管理，讲究\"最小干预\"。能不动的，不动；能少动的，少动。取一件文物，要戴手套，要托底，要轻拿轻放。为什么？因为文物很脆：陶器会酥，青铜会锈，漆木器会裂，丝织品会碎。一次碰撞，可能就是永久的伤。\n\n库房还有一个功能：研究。研究人员可以申请调阅文物，在库房里看、量、拍、取样。很多重要的发现，是在库房里做出来的：一件不起眼的陶片，可能是某个问题的关键；一件残器，可能补上了某个缺环。\n\n库房也是\"避难所\"。战争、灾害、搬迁的时候，文物要转移到安全的地方。抗战时期，故宫的文物南迁，走了大半个中国，一件没丢。那是博物馆人的骨气。\n\n你在这间展厅看到的\"囊匣\"，是库房的一个缩影。一个盒子，几层纸，看起来简单，其实是一套保护系统：防尘、防潮、防震、防光。文物的寿命，一半靠修复，一半靠\"住得好\"。\n\n博物馆的展陈，是\"讲故事\"；库房，是\"存故事\"。故事讲完了，东西还要回去，继续躺着，等下一次被讲述。\n\n考古博物馆的库房，还有一个特点：它跟考古所连在一起。新出土的文物，先到库房，整理、编号、修复，再考虑展出。库房是\"后台\"，也是\"源头\"。\n\n你走出这间展厅，可以想：你看到的每一件文物，都有一段\"库房生活\"。它在黑暗里躺了很久，才被灯光照亮。", "chars": 798, "videos": []}, {"id": "h20", "title": "下沉广场：井、柱础与露天的文物", "text": "从负一层上来，别急着出馆。往西走，有一个下沉式广场。\n\n广场是露天的，四周是建筑的墙，头顶是天。地上摆着几件大东西：陶井圈、石柱础、陶井台。它们不是放在玻璃柜里，是直接搁在户外，你可以走到跟前，绕着看。\n\n先说井。\n\n陶井圈是一节一节的圆筒，口径大约半米，壁厚几厘米，外面有绳纹。打井的时候，先挖一个竖坑，挖到出水层，把井圈一节一节放下去，边放边填土。井圈的作用是护壁，防止塌方。一口井要用多少节井圈？看井深，一般五六节，深的十几节。苏州地下水位高，挖两三米就出水，所以井不用太深。\n\n井是古代城市的心脏。一个街区，几口井，几十户人家，吃水、洗衣、淘米，都靠它。井水也是消防水源。考古队在一个遗址里找到井，就能推断这里住过人、住得密。井里还会掉东西：陶罐、木桶、铜钱、骨头。这些东西沉在井底，缺氧、避光，保存得比地面上好。很多重要的发现，是从井里掏出来的。\n\n石柱础，是建筑构件。柱子立在柱础上，柱础垫在夯土或砖石基础上，把屋顶的重量分散到地面。展出的这几块，方形，中间有一个圆形的凸起，叫“覆盆”。覆盆的作用是防潮：柱子底部容易烂，垫高了，水汽上不去。柱础的大小，能看出柱子的粗细；柱子的粗细，能看出建筑的等级。这几块柱础不小，说明它们撑的房子不低。\n\n陶井台，是井口的地面设施。一个圆形的陶台，中间一个孔，套在井口上，四周高、中间低，洗东西的水能流回井里，或者流到旁边的沟里。井台面上有磨损的凹槽，是绳子长年累月磨出来的。你摸一下那道槽，会想到无数只手在这里提水。\n\n把这几件东西放在户外，是有意为之。博物馆的墙是界限：墙里是“文物”，墙外是“生活”。这几件东西横在中间，告诉你文物本来就是从生活里来的。它们不怕风吹日晒吗？怕。所以馆里给它们做了排水、做了遮护，也定期检查。但馆方还是愿意把它们放在外面，因为“看得见、摸得着”比“保护得严严实实”更重要。\n\n站在广场上往东北看，能看见一片水面，那是石湖；水的那一边，就是越城遗址。范成大晚年住在石湖，号“石湖居士”，写《四时田园杂兴》，写的就是这一带的田、水、桑、麻。八百年前他看见的景，和今天差不太多：湖还在，堤还在，田换成了景区。博物馆选在这里，一半是因为遗址，一半是因为这片景。你从展厅里出来，正好接上这片景，参观的最后一口气，是湖风。\n\n广场的一角是咖啡厅。菜单上印着文物纹样：陶器的绳纹、玉琮的神人兽面、青瓷的莲瓣。你坐下来喝杯咖啡，抬头能看见博物馆的夯土墙。墙上的土，和展柜里的土，是同一种土。", "chars": 1012, "videos": [{"platform": "douyin", "title": "苏州考古博物馆探馆：江苏省首座考古专题博物馆", "url": "https://www.douyin.com/video/7509631030123679002", "note": "探馆向，看空间与动线"}]}, {"id": "hx12", "title": "陶井圈：古代的供水系统", "text": "这一节，我们看一口井。\n\n广场上摆着几节陶井圈，圆筒形，口径半米，壁厚几厘米，外面有绳纹。它们是一节一节套起来的，打井的时候，先挖一个竖坑，挖到出水层，把井圈一节一节放下去，边放边填土。井圈的作用是护壁，防止塌方。\n\n一口井要用多少节？看井深。苏州地下水位高，挖两三米就出水，所以井不用太深，五六节就够。北方的井深，要十几节。井圈的多少，能看出一个地方的水文条件。\n\n井是古代城市的心脏。一个街区，几口井，几十户人家，吃水、洗衣、淘米，都靠它。井水也是消防水源。考古队在一个遗址里找到井，就能推断这里住过人、住得密。\n\n井里还会掉东西：陶罐、木桶、铜钱、骨头。这些东西沉在井底，缺氧、避光，保存得比地面上好。很多重要的发现，是从井里掏出来的。苏州有一座宋代的井，里面出土了几十件完整的瓷器，可能是打水时掉下去的，也可能是战乱时藏进去的。\n\n井台是井口的地面设施。一个圆形的陶台，中间一个孔，套在井口上，四周高、中间低，洗东西的水能流回井里，或者流到旁边的沟里。井台面上有磨损的凹槽，是绳子长年累月磨出来的。你摸一下那道槽，会想到无数只手在这里提水。\n\n石柱础，是建筑构件。柱子立在柱础上，柱础把屋顶的重量分散到地面。展出的这几块，方形，中间有一个圆形的凸起，叫\"覆盆\"。覆盆的作用是防潮：柱子底部容易烂，垫高了，水汽上不去。柱础的大小，能看出柱子的粗细；柱子的粗细，能看出建筑的等级。\n\n把井、井台、柱础放在一起，你看到的是一个\"生活单元\"：有水，有房子，有排水。考古学管这个叫\"聚落\"。一座城，就是无数个这样的单元组成的。\n\n苏州的城，是水做的。河道是主动脉，井是毛细血管。没有井，城就活不了。所以古人打井，很讲究：选位置、看水脉、砌井圈、做井台，一样不能少。\n\n今天你家里拧开水龙头，水就来了。古人要走到井边，把桶放下去，提上来，再挑回家。一口井，就是一个社区的 center。井边是消息集散地，是邻里交往的地方，也是孩子玩水的地方。\n\n你站在广场上，看着这几节陶井圈，可以想：两千年前，一个人蹲在井边，把桶放下去，听见\"咚\"的一声，水花溅起来。那种声音，今天已经听不到了。", "chars": 868, "videos": []}, {"id": "hx15", "title": "一块墓砖上的年号", "text": "这一节，我们看一块砖。\n\n砖很普通，灰陶，长方形，侧面有模印的字。字不多，几个：年号、月份、日期，或者\"吴侯\"\"吴王\"这样的爵称，或者工匠的名字、窑场的字号。\n\n为什么要在砖上印字？因为责任。砖是官府或窑场造的，印上字，出了问题能找到人。这跟今天的\"产品批号\"一样。秦代的砖，印\"右\"\"左\"，是官署；汉代的砖，印年号、吉语；六朝的砖，印\"吴侯\"\"建兴二年\"，是身份。\n\n纪年砖，是考古断代的\"锚\"。一座墓，如果没有纪年砖，只能靠器物的形制、纹饰去推断年代，误差几十年；有纪年砖，年代就精确到年。孙吴一号墓出土的\"建兴二年七月廿一日吴王口\"砖，把墓的年代定在253年。一个字，顶得上一百件器物。\n\n铭文砖，还能看出\"人\"。有的砖上有工匠的名字：\"某某造\"；有的有窑场的字号：\"某某窑\"；有的有买主的名字。这些名字，史书上没有，但他们是真实的人：造砖的、烧窑的、买砖的、砌墓的。\n\n砖上的指纹，更直接。砖坯放在地上晾的时候，还是软的，工匠搬动、码放，手指就按进去了。指纹不会说谎：它告诉你，这个人的手有多大，是按着砖的哪一边搬的。一千七百年后，指纹还在。\n\n砖的规格，也有信息。同样的墓，砖的长度、宽度、厚度，基本一致，说明是统一生产的。不同等级的墓，砖的规格不同：大墓用大砖，小墓用小砖。砖的尺寸，是\"建筑等级\"的一个指标。\n\n砖的砌法，也有讲究。有的墓是\"三顺一丁\"，有的是\"五顺一丁\"，有的是\"错缝平砌\"。不同的砌法，承重、防潮、美观，各有用处。考古队看砌法，能判断墓的时代、等级、工匠流派。\n\n你在这间展厅看到的这些砖，很多是\"残砖\"：断的、缺角的、磨损的。它们不值钱，但它们是\"档案\"：一块砖，可能记录了一个年号、一个名字、一个家族。历史，有时候就藏在这些不起眼的东西里。\n\n下次你去古建筑，可以低头看看地砖、墙砖。它们可能也有字，也有指纹。只是我们平时不看。", "chars": 765, "videos": []}, {"id": "hx27", "title": "市河与码头：苏州的水上交通", "text": "这一节，我们看苏州的河。\n\n苏州的城，是水做的。城里有河，河上有桥，河边有码头。河，是路；码头，是车站。\n\n市河，是城里的河。苏州的市河，横平竖直，跟街并行。为什么？因为便于运输：货从城外进来，通过水门，进市河，到各个码头。码头就在家门口，卸货、上货，方便。\n\n码头怎么修？岸边打木桩，桩上架横木，横木上铺石板。船靠过来，系缆绳，搭跳板。码头的规模，看河的宽度、看货的多少。大码头，能停几条船；小码头，只能停一条。\n\n考古队在城市遗址里，常常发现码头：木桩、石板、缆绳孔。这些东西，能还原一条河的使用方式。木桩的年轮，能测年代；石板的磨损，能看使用频率。\n\n苏州的河，还承担\"排水\"和\"消防\"。下雨，水从街上流进河，河再流进外城河，最后排进太湖、长江。失火，从河里取水。河，是城的\"血管\"。\n\n河也是\"垃圾场\"。古人把垃圾倒进河里，河底就成了\"时间胶囊\"：瓷器、铜钱、木器、骨头，都沉在淤泥里。考古队挖河，能挖出半部生活史。\n\n你在这间展厅看到的码头模型，是按考古发现复原的：木桩、横木、石板、跳板。旁边停着一条小船，船上放着陶罐、竹筐。你可以想象：一个人挑着担子，从船上下来，走上码头，进了巷子。\n\n苏州的河，后来填了不少。为什么？因为马路、因为汽车。填河修路，是二十世纪的事。但河的记忆，还在：很多路名，原来是河名；很多桥名，还在用。\n\n今天你坐船游苏州，走的那条河，可能就是古代的市河。两岸的房子，翻修过；河道的走向，没大变。一条河，流了两千年。\n\n你站在码头模型前，可以想：一千年前，一条船靠岸，船夫喊一声，岸上的人接缆绳。货卸下来，挑进店里。河面上，船来船往。那种热闹，今天在平江路还能看到一点。", "chars": 683, "videos": []}, {"id": "h21", "title": "文保修复室：让它活得久一点", "text": "广场边上，有一间屋子，隔着一面大玻璃，你能看到里面有人在干活。\n\n那是文物保护修复展示区。屋子不大，几张工作台，台面上摊着器物、工具、标签。有人低着头，用一根细毛笔蘸着胶，往陶片的断口上涂；有人对着显微镜，清理一块青铜器上的锈；有人把一件刚拼好的罐子放进囊匣，垫上无酸棉纸。\n\n修复这件事，先从“洗”开始。出土的器物带着土、带着盐、带着微生物。陶器要泡水，慢慢把可溶盐析出来；盐不除，以后会在器身里结晶，把胎撑裂。青铜器要除锈，但只能除“有害锈”，不能把表面的古锈全去掉——那层绿锈是它的历史，也是它的保护层。青铜病是一种恶性锈，像癌一样蔓延，一旦发现，要立刻隔离、清洗、封护。\n\n漆木器最难。苏州地下水位高，漆木器埋在水里，饱水、软，一碰就碎。出土之后，不能晾干，一晾就收缩、开裂、变形。要先脱水：用聚乙二醇置换水分，或者用冷冻干燥，几个月甚至几年，慢慢来。脱水之后，器形才能稳住。苏州出土的汉代漆器，很多都是这样救回来的。\n\n丝织品更娇气。丝绸埋在地下，大多只剩一层印痕。遇到保存好的，要整体揭取，用丝网托着，在显微镜下清理。苏州是丝绸之府，出土丝织品的修复，一直跟上海、荆州这些机构合作。\n\n修复的原则，写在墙上：“最小干预，可识别，可逆。”最小干预，是能不动就不动；可识别，是补的部分要能看出来，不能以假乱真；可逆，是以后有更好的技术，能把今天的修复撤掉重来。这三条，是文保行业的底线。\n\n展厅里的很多器物，身上都有修复的痕迹：陶罐的口沿补了一块，颜色略浅；青铜鼎的足是后配的，接口处有一道细线；漆盘的边缘用透明材料加固过。这些痕迹不是瑕疵，是“病历”。每一件修复过的器物，都有一份档案：出土时间、地点、病害、处理过程、材料。档案跟着器物走，几十年后的人接手，能知道前人做了什么。\n\n玻璃上贴着一行小字：“修复不是让它变新，是让它活得久一点。”你隔着玻璃看里面的人，他们可能一整天只处理一件东西。考古的成果在展柜里，支撑成果的功夫在这间屋子里。", "chars": 812, "videos": []}, {"id": "h23", "title": "幕后：二十三个人的考古所", "text": "这一厅没有展柜，只有一面照片墙。\n\n照片上的人，是苏州市考古研究所的全体人员。二十三个人。\n\n苏州这么大，地下这么多东西，考古所只有二十三个人。大部分人在各个工地上，挖土、记录、整理；五六个人在博物馆附近办公，一边管行政，一边给新馆找展品。馆长程义说，人手根本不够用，开馆前还从苏州博物馆借了两个人。\n\n照片墙旁边有一段话，讲开馆前几个月的事：程义把时间“掰碎了用”，空下来就到各个工地“寻宝”，今天找这个领队，明天找那个领队，把值得展览的文物锁定下来，让各领队利用下雨天打包好，及时送到馆里。为什么是下雨天？因为下雨不能发掘，工地停工，人才有空打包。\n\n有一件展品就是这么来的。二〇二五年四月，余天灯巷遗址出土了一件楚国量器，带“大市”文字。考古简报都还没发，东西就上了展线。程义看到它，把所里研究楚国文字的沈浩从张家港叫回来，做完释读，再把人“放”回去，然后送修、上展。一件文物从工地到展柜，只用了几个月。\n\n这种速度，在传统博物馆里很难想象。传统博物馆的展品，多是旧藏，研究透了才展；考古博物馆的展品，很多是“刚出锅”的。好处是新鲜，观众看到的是最新的发现；难处是研究跟不上，很多问题还没答案。馆里坦然承认这一点：展签上常常写着“待研究”“初步推断”。\n\n照片墙的最后，是一张工地合影。背景是探方，前景是一群灰头土脸的人，蹲在地上，手里拿着手铲。照片下角写着拍摄日期。你看着这些人，再想想展厅里那些精美的器物：金钗、玉琮、青瓷、青铜剑。它们被挖出来的时候，全是土；是这些人一片一片、一件一件，把它们从土里请出来的。\n\n程义还干了一件不太“学术”的事：开小红书账号，发笔记，给新馆吆喝。一个搞了三十多年学术的考古人，学着年轻人的样子写标题、配图。为什么？因为“普通大众不会去看我们的学术论文”。他说，工地上挖出来的东西，研究透了，放到博物馆去展出、去阐释，考古才有意义。\n\n这面墙看完了，你再回头看展厅，感觉会不一样：那些器物背后，不只是古人，还有一群今天的人。", "chars": 817, "videos": []}, {"id": "hx26", "title": "陶器修复：把碎片拼回去", "text": "这一节，我们看修复师怎么把一堆碎片，拼成一个罐子。\n\n第一步，洗。陶片从工地回来，带着土。先用清水泡，用软毛刷轻轻刷，把土洗掉。不能用力，因为陶片可能酥，一刷就掉渣。洗完，晾干，编号。\n\n第二步，分。按陶质、陶色、纹饰、器形，把陶片分开。同一件器物的碎片，放在一起。分的时候，要看口沿、看底、看腹，看胎的厚度、看纹饰的接缝。有经验的修复师，看一眼碎片，就知道它属于哪个部位。\n\n第三步，拼。像拼图，但没有参考图。先拼口沿，再拼腹部，最后拼底。拼的时候，用沙盘托着，让碎片立起来。拼对了一块，用胶带临时固定；拼错了，拆开重来。一件大罐，几百片，要拼几天。\n\n第四步，粘。用树脂胶，涂在断口上，压紧，等干。胶要涂得薄，不能溢出来；压得要紧，不能有缝。粘好之后，器形出来了，但还有缺口。\n\n第五步，补。缺口用石膏补。石膏调色，调得跟陶胎接近，但不能完全一样——要能看出来是\"补的\"。为什么？因为修复的原则是\"可识别\"：不能以假乱真。补的部分，颜色略浅，或者不画纹饰。\n\n第六步，做旧。补的部分，可以做一点旧，让它不那么突兀。但\"做旧\"不是\"造假\"，是\"协调\"。修复师要有分寸：既要好看，又要诚实。\n\n修复的底线，是\"最小干预、可识别、可逆\"。最小干预：能不动就不动；可识别：补的要能看出来；可逆：以后有更好的技术，能把今天的修复撤掉重来。\n\n你在这间展厅看到的很多陶器，身上都有修复的痕迹：口沿补了一块，颜色略浅；腹部有一道细线，是粘接的缝；底部有一块石膏，是补的。这些痕迹，不是\"瑕疵\"，是\"病历\"。\n\n一件陶器，从碎片到展柜，要经过几个月。修复师的手，要稳，心要静。一天下来，可能只拼好一个口沿。但就是这一块一块，让几千年的东西，重新站了起来。\n\n你看着那些陶器，可以想：它们碎过，又被拼起来。这个过程，本身就是\"考古\"：把散落的信息，重新连成一体。", "chars": 754, "videos": []}, {"id": "hx28", "title": "三次十大：苏州考古的二十年", "text": "这一节，我们讲一段机构的考古史。\n\n苏州市考古研究所，2009年成立。成立之前，苏州的考古工作，分散在博物馆、文管会。成立之后，有了专门的队伍，有了固定的编制，有了系统的规划。\n\n十几年里，苏州的考古，拿了三次全国十大考古新发现：张家港东山村遗址、木渎古城遗址、太仓樊村泾遗址。三次十大，三个时代：东山村是新石器时代，木渎是春秋，樊村泾是元代。从史前到历史时期，一条线。\n\n东山村，在张家港。那里发现了崧泽文化的高等级墓葬，墓坑大、随葬品多，有石钺、玉器、陶器上百件。一个墓，就能看出社会已经分层。东山村把崧泽文化的研究，往前推了一大步。\n\n木渎古城，在苏州西边。城墙、城壕、城门、城内河道，都找到了。这是春秋晚期的大型城址，可能是吴国的另一个中心。木渎古城把吴国的历史，从文献落到了地上。\n\n樊村泾，在太仓。元代的港口仓储，国内最大。龙泉青瓷、元青花、高丽青瓷，成堆出土。樊村泾把苏州的海上丝路，从传说变成了实证。\n\n三次十大，背后是同一件事：苏州的考古，从配合基建变成了主动课题。过去是工地挖到了，才去抢救；现在是先做规划，主动去探源。这个转变，是地域文明探源工程带来的。\n\n探源工程，要回答三个问题：苏州的文明，从哪来？怎么发展？有什么特点？三个问题，听起来大，落到考古上，就是一个个遗址、一件件器物、一层层地层。\n\n你在这座博物馆里看到的一切，都是这十几年工作的结果。一千二百多件文物，八成以上是首次亮相。不是藏出来的，是挖出来的。\n\n考古所只有二十三个人，要管全苏州的工地。人少，事多，但他们把事做成了。为什么？因为有一群人，愿意蹲在工地上，一蹲就是几个月。\n\n一座博物馆，背后是一个研究所；一个研究所，背后是一群人。你看到的是文物，看不到的是人。", "chars": 709, "videos": []}, {"id": "h22", "title": "教育探索宫：把铲子交给下一个人", "text": "广场的另一头，是教育探索宫。\n\n门口是一片沙地，划成一个个方格，插着标签、拉着线，摆着小铲子、小刷子、小桶。这是模拟考古发掘现场：把沙子当成地层，把埋进去的陶片、仿制器物当成“文物”，让人蹲下来，一铲一铲地挖、一刷一刷地清、一格一格地记。挖出来的东西要编号、要画图、要填表——跟真考古的流程一样，只是缩小了。\n\n沙地的四个角，各插一块牌子，写着“耕土层”“扰土层”“文化层”“生土”。这四层，是考古队员下铲子前必须先认的。耕土是翻过的，扰土是被后人动过的，文化层才是人住过的，生土是没被人碰过的原始土。认错一层，后面的判断全错。孩子们在这里挖，第一件事不是找东西，是认土。\n\n往里走，是一间教室。桌上摆着陶片、石膏、模具，墙上贴着地层图、器物图。这里做研学：怎么给陶片分类，怎么拼对，怎么从一片口沿推断器形。孩子们在这里待一下午，能弄明白一件事：考古不是“挖宝”，是“记录”。\n\n馆里还有两个小展览，一个在角落，一个在走廊。\n\n角落那个，展的是“磨喝乐”。磨喝乐是宋代的陶玩具，小塑像，有娃娃、有动物、有故事人物。宋代七月初七，街上卖磨喝乐，小孩拿着玩。苏州出土的磨喝乐，个头不大，塑得圆润，脸上还带着笑。一个玩具，能看出宋代的市井生活有多热闹。\n\n走廊那个，展的是苏州各个时期的货币：先秦的蚁鼻钱、布币，秦汉的半两、五铢，唐宋的年号钱，明清的银锭、铜钱。钱币是最诚实的器物：它跟着贸易走，跟着政权走。一个朝代的经济好不好，看钱币的铸造质量就知道。\n\n这两个小展，是馆里特意做的“轻展览”：不占大空间，不讲大道理，就摆几十件东西，让人路过时停一下。\n\n博物馆还参与了一个长三角的研学联盟：苏州考古博物馆、上海崧泽遗址博物馆、杭州玉架山考古博物馆、安徽凌家滩遗址博物馆，四家一起做课程、做线路。四个馆，四种史前文化：崧泽在太湖东岸，良渚在杭州湾，凌家滩在巢湖边上，吴越在苏州。一条线走下来，能看明白长江下游的文明不是各自孤立的，它们互相看得见：玉器的形制、陶器的纹样、墓葬的规矩，都有你来我往的痕迹。\n\n设计这座馆的程泰宁院士说过一句话：“最好的博物馆不是告诉观众答案，而是提出问题。”你在这座馆里走一圈，会带走很多问题：为什么苏州的城两千年没挪窝？为什么良渚人要花那么大力气雕玉？为什么一只高丽青瓷碗会落在太仓？这些问题没有标准答案，但每一个都能让你再回来一次。\n\n从教育探索宫出来，天光从下沉广场的上方落下来。你可以蹲在沙地边上，抓一把沙土，让它从指缝里漏下去。土是凉的，细的，和展厅里那面十二米高的夯土墙，是同一种质地。", "chars": 1042, "videos": []}], "target": 50000, "total": 50028};
const PLAT = {bilibili:'B站',xiaohongshu:'小红书',douyin:'抖音',kuaishou:'快手',shipinhao:'视频号',official:'官方',other:'视频'};
const route = document.getElementById('route');
const reader = document.getElementById('reader');
const rtitle = document.getElementById('rtitle');
const rmeta = document.getElementById('rmeta');
const rbody = document.getElementById('rbody');
const rplay = document.getElementById('rplay');
const rstop = document.getElementById('rstop');
let current = 0;
let speechNo = null;
let paused = false;
let chunks = [];
let idx = 0;
let pausedAt = 0;
let cancelled = false;
let retryTimer = 0;

function partsOf(stop){
  if (stop && Array.isArray(stop.parts) && stop.parts.length){
    const byTitle = new Map(DATA.sections.map(s => [s.title, s]));
    return stop.parts.map(t => byTitle.get(t)).filter(Boolean);
  }
  const norm = value => String(value || '').replace(/\s+/g,'');
  const label = norm(stop.label);
  if (label){
    const byLabel = DATA.sections.filter(s => norm(s.title).includes(label));
    if (byLabel.length) return byLabel;
  }
  const wanted = norm(stop.section || stop.label);
  if (!wanted) return [];
  const direct = DATA.sections.filter(s => norm(s.title).includes(wanted));
  if (!direct.length) return [];
  const base = norm(direct[0].title).split('（')[0].split('：')[0].split(':')[0];
  const siblings = DATA.sections.filter(s => norm(s.title).split('（')[0].split('：')[0].split(':')[0] === base);
  return siblings.length > direct.length ? siblings : direct;
}
function chunksOf(text){
  const clean = String(text||'').replace(/\s+/g,' ').trim();
  const parts = clean.split(/(?<=[。！？；!?;])/);
  const out = []; let buf = '';
  for (const p of parts){ if ((buf+p).length>110){ if(buf) out.push(buf); buf=p; } else buf+=p; }
  if (buf) out.push(buf);
  return out.filter(s => s.trim().length>1);
}
function hardReset(){
  try { if (typeof speechSynthesis !== 'undefined'){ speechSynthesis.resume(); speechSynthesis.cancel(); } } catch(e){}
}
function stopAll(){
  cancelled = true;
  clearTimeout(retryTimer);
  chunks = []; idx = 0; pausedAt = 0;
  speechNo = null; paused = false;
  hardReset();
  renderRoute(); updateReaderButton();
}
function speakFrom(start){
  cancelled = false;
  idx = start;
  const next = () => {
    if (cancelled) return;
    if (idx >= chunks.length){
      speechNo = null; paused = false;
      renderRoute(); updateReaderButton();
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1;
    u.onend = () => { if (cancelled) return; idx++; next(); };
    u.onerror = () => { if (cancelled) return; idx++; next(); };
    try { speechSynthesis.speak(u); } catch(e){}
  };
  setTimeout(next, 200);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    if (cancelled || paused) return;
    if (!speechSynthesis.speaking && !speechSynthesis.pending){
      hardReset();
      setTimeout(next, 250);
    }
  }, 1200);
}
function playStop(stop){
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance !== 'function') return;
  stopAll();
  chunks = partsOf(stop).flatMap(p => chunksOf(p.text));
  if (!chunks.length) return;
  speechNo = stop.no;
  paused = false;
  pausedAt = 0;
  renderRoute(); updateReaderButton();
  hardReset();
  setTimeout(() => speakFrom(0), 120);
}
function toggleStop(stop){
  if (speechNo === stop.no){
    if (!paused){
      paused = true;
      pausedAt = idx;
      cancelled = true;
      clearTimeout(retryTimer);
      hardReset();
      renderRoute(); updateReaderButton();
    } else {
      paused = false;
      renderRoute(); updateReaderButton();
      hardReset();
      setTimeout(() => speakFrom(pausedAt), 250);
    }
    return;
  }
  playStop(stop);
}
function updateReaderButton(){
  const stop = DATA.stops[current];
  const on = stop && speechNo === stop.no;
  rplay.textContent = on ? (paused ? '▶ 继续' : '⏸ 暂停') : '▶ 朗读';
  rplay.classList.toggle('primary', !on);
  rstop.style.display = on ? '' : 'none';
  const status = on ? (paused ? '已暂停' : '朗读中') : '';
  const meta = rmeta.dataset.base || '';
  rmeta.textContent = status ? meta + ' · ' + status : meta;
}
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function renderRoute(){
  const floors = [];
  for (const s of DATA.stops){
    const f = s.floor || '';
    if (!floors.length || floors[floors.length-1].f !== f) floors.push({f, items:[]});
    floors[floors.length-1].items.push(s);
  }
  route.innerHTML = '';
  floors.forEach(group => {
    if (group.f){
      const d = document.createElement('div');
      d.className = 'floor'; d.textContent = group.f; route.appendChild(d);
    }
    group.items.forEach(stop => {
      const i = DATA.stops.indexOf(stop);
      const parts = partsOf(stop);
      const vids = parts.reduce((n,p)=>n+(p.videos||[]).length,0);
      const row = document.createElement('div');
      row.className = 'stop' + (i===current ? ' active':'');
      row.innerHTML = '<span class="num">'+stop.no+'</span>'
        + '<span class="body"><span class="name"></span><span class="note"></span></span>'
        + (vids ? '<span class="v">▶ '+vids+'</span>' : '')
        + '<button type="button" class="play'+(speechNo===stop.no?' on':'')+'" aria-label="播放">'+(speechNo===stop.no&&!paused?'⏸':'▶')+'</button>';
      row.querySelector('.name').textContent = stop.label;
      row.querySelector('.note').textContent = stop.note || '';
      row.addEventListener('click', () => openStop(i));
      row.querySelector('.play').addEventListener('click', e => { e.stopPropagation(); current=i; toggleStop(stop); });
      route.appendChild(row);
    });
  });
}
function openStop(i){
  current = i;
  const stop = DATA.stops[i];
  const parts = partsOf(stop);
  const chars = parts.reduce((n,p)=>n+(p.chars||0),0);
  const vids = parts.reduce((n,p)=>n+(p.videos||[]).length,0);
  rtitle.textContent = stop.label;
  rmeta.dataset.base = fmt(chars)+' 字 · '+parts.length+' 段'+(vids?' · '+vids+' 视频':'');
  rmeta.textContent = rmeta.dataset.base;
  rbody.innerHTML = '';
  parts.forEach(part => {
    const wrap = document.createElement('article'); wrap.className='part';
    const h = document.createElement('h3'); h.textContent = part.title; wrap.appendChild(h);
    const t = document.createElement('div'); t.className='text'; t.textContent = part.text; wrap.appendChild(t);
    if ((part.videos||[]).length){
      const vs = document.createElement('div'); vs.className='videos';
      part.videos.forEach(v => {
        const a = document.createElement('a'); a.className='vlink'; a.href=v.url; a.target='_blank'; a.rel='noreferrer noopener';
        a.innerHTML = '<span class="plat">'+(PLAT[v.platform]||'视频')+'</span><span class="t"></span>';
        a.querySelector('.t').textContent = v.title || v.url;
        vs.appendChild(a);
      });
      wrap.appendChild(vs);
    }
    rbody.appendChild(wrap);
  });
  reader.classList.add('open');
  rbody.scrollTop = 0;
  updateReaderButton();
  renderRoute();
}
function closeReader(){ reader.classList.remove('open'); stopAll(); }
document.getElementById('back').addEventListener('click', closeReader);
rplay.addEventListener('click', () => { const s = DATA.stops[current]; if (s) toggleStop(s); });
rstop.addEventListener('click', stopAll);
document.getElementById('rcopy').addEventListener('click', () => {
  const stop = DATA.stops[current];
  const text = partsOf(stop).map(p => p.title+'\n'+p.text).join('\n\n');
  navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('rcopy'); const old=b.textContent; b.textContent='已复制'; setTimeout(()=>b.textContent=old,1200);
  });
});
renderRoute();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
