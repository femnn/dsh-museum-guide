<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f1e8">
<title>苏州考古博物馆 · 讲解</title>
<style>
:root{--bg:#f5efe4;--card:#fffdf8;--ink:#2a211a;--muted:#8a7a66;--line:#e4d8c5;--brand:#9a5b2c;--ok:#2f7a4f}
@media (prefers-color-scheme:dark){:root{--bg:#15120f;--card:#211c17;--ink:#f2e9dc;--muted:#b3a28c;--line:#3a2f24;--brand:#e0a25e;--ok:#77c79a}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;padding-bottom:env(safe-area-inset-bottom)}
header.top{position:sticky;top:0;z-index:10;background:linear-gradient(180deg,var(--bg) 70%,transparent);padding:calc(14px + env(safe-area-inset-top)) 16px 10px}
.top h1{margin:0;font-size:19px;letter-spacing:.02em}
.top .meta{display:flex;gap:10px;align-items:center;margin-top:4px;font-size:12px;color:var(--muted)}
.badge{display:inline-flex;align-items:center;padding:1px 8px;border-radius:999px;border:1px solid var(--ok);color:var(--ok);font-size:11px}
.hint{margin:2px 16px 10px;font-size:12px;color:var(--muted)}
.route{display:flex;flex-direction:column;gap:8px;padding:0 12px 28px}
.floor{font-size:11px;letter-spacing:.1em;color:var(--muted);padding:10px 6px 2px}
.stop{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer}
.stop.active{border-color:var(--brand);box-shadow:inset 3px 0 0 var(--brand)}
.stop .num{width:26px;flex:0 0 26px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.stop .body{flex:1 1 auto;min-width:0}
.stop .name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .note{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stop .v{font-size:11px;color:var(--ok);white-space:nowrap}
.play{flex:0 0 44px;width:44px;height:44px;border-radius:50%;border:1px solid var(--brand);background:transparent;color:var(--brand);font-size:14px;display:flex;align-items:center;justify-content:center;padding:0;-webkit-touch-callout:none;user-select:none}
.play.on{background:var(--brand);color:var(--bg)}
.reader{position:fixed;inset:0;z-index:20;background:var(--bg);display:none;flex-direction:column}
.reader.open{display:flex}
.rhead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 14px 10px}
.rhead .row1{display:flex;align-items:center;gap:10px}
.back{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center;padding:0}
.rhead h2{margin:0;font-size:17px;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead .meta{font-size:11.5px;color:var(--muted);margin-top:6px;padding-left:50px}
.ractions{display:flex;gap:8px;margin-top:10px;padding-left:50px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:11px;padding:8px 12px;font-size:13px;font-family:inherit;-webkit-touch-callout:none;user-select:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--bg);font-weight:600}
.rbody{flex:1 1 auto;overflow:auto;padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
.part{margin:0 0 22px}
.part h3{margin:0 0 8px;font-size:13px;color:var(--muted);font-weight:600}
.text{font-size:16px;line-height:1.95;white-space:pre-wrap;word-break:break-word}
.videos{margin-top:10px;display:flex;flex-direction:column;gap:6px}
video-link,.vlink{display:flex;gap:8px;align-items:center;text-decoration:none;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12.5px}
.vlink .plat{flex:0 0 auto;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.vlink .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.foot{padding:8px 16px 24px;font-size:11px;color:var(--muted)}
</style>
</head>

  <h1>苏州考古博物馆</h1>

      <button type="button" class="btn" id="rcopy">复制这段</button>

<script>
const DATA = {"museum": "苏州考古博物馆", "city": "苏州", "stops": [{"no": "01", "floor": "一层", "label": "入口廊桥", "note": "历代墓砖铺地", "section": "序厅：一条砖路与一面土墙"}, {"no": "02", "floor": "一层", "label": "服务大厅", "note": "12 米夯土墙", "section": "序厅：一条砖路与一面土墙"}, {"no": "03", "floor": "一层", "label": "江海共潮生", "note": "地理与三山岛", "section": "江海共潮生：一块被水改写过的地"}, {"no": "04", "floor": "一层", "label": "手铲释天书", "note": "考古工具与地层", "section": "手铲释天书：土是书，工具是笔"}, {"no": "05", "floor": "一层", "label": "考古见姑苏", "note": "草鞋山剖面", "section": "考古见姑苏（上）：一面剖开的土墙"}, {"no": "06", "floor": "负一层", "label": "文明溯源", "note": "从平等到等级", "section": "文明溯源（上）：从平等到等级"}, {"no": "07", "floor": "负一层", "label": "吴越新证", "note": "青铜剑与楚量器", "section": "吴越新证（上）：天下最好的剑"}, {"no": "08", "floor": "负一层", "label": "都会寻踪", "note": "孙吴一号墓", "section": "都会寻踪（上）：把一座墓搬进博物馆"}, {"no": "09", "floor": "负一层", "label": "海丝遗痕", "note": "瓷器与港口", "section": "海丝遗痕（一）：城北的一把窑火"}, {"no": "10", "floor": "户外", "label": "下沉广场", "note": "文保修复展示区", "section": "下沉广场：井、柱础与露天的文物"}], "sections": [{"id": "intro1", "title": "开场", "text": "各位朋友，欢迎来到苏州考古博物馆。我先花几分钟把脚下这块地方交代清楚，然后我们就进厅，剩下的时间全交给展品。\n\n我们现在站在石湖景区的北岸，越堤路三百二十一号。往东北走几步，就是江苏省文物保护单位越城遗址。旧志里说，越王勾践伐吴时在这一带筑过城；再往前推几千年，这片湖荡之间的高地上，已经有人插下第一根木桩。博物馆就贴着遗址建，占地一万平方米，建筑面积八千九百七十二平方米，地面一层、地下一层，由中国工程院院士程泰宁主持设计。二〇二五年五月十七日开馆，是江苏省第一座以“考古”命名的专题博物馆。\n\n它跟一般博物馆不太一样。馆里一千二百余件组文物，八成以上是第一次跟公众见面。展品不是一件一件挑精品摆，而是按遗址成组、成套地出现。所以我们今天不急着找“镇馆之宝”，我们跟着一个个遗址走，看苏州人从哪里来，怎么在这片水网里安家、筑城、做生意、出海。\n\n路线很简单：先在一层看“源起江南”，弄明白苏州的地理底子和考古这门手艺；再下负一层看“华章江南”，从史前一路走到宋元。慢慢走，两个小时够用；哪件东西想多看两眼，随时停下。\n\n最后说一句：这座馆里很多文物带着土、带着修复的疤，甚至带着当年工匠留在砖上的指纹。它们不完美，但它们是真的。我们就从这份“真”开始。", "chars": 519, "videos": []}, {"id": "h2", "title": "序厅：一条砖路与一面土墙", "text": "进门之前，请先低头看一眼脚下。\n\n从停车场走过来那条廊桥，地面不是普通石材，是一块一块的墓砖。六朝的、隋唐的、宋元的、明清的，规格不同，厚薄不一，有的侧面还留着模印的莲花纹和吉语。这些都是苏州各个考古工地出土的墓砖，发掘结束、资料记完，砖被搬到这里，铺成一条路。我们平时进博物馆，脚下踩的是大理石；在这里，脚下踩的是两千年来苏州人给逝者砌墙用的砖。这条路本身就是展品，只是它不挂在墙上。\n\n再抬头看这栋建筑。它没有传统博物馆那种对称的大屋顶，也没有玻璃盒子式的现代造型，而是一组粗粝的三角形块面拼在一起，像从土里拱出来的。设计它的程泰宁院士，取的原型是越城遗址出土的两件石器：石锛和钺。锛是砍削木头的工具，钺是带弧刃的兵器，也是权力的象征。五千年前的人用这两样东西开垦这片土地；五千年后，博物馆把自己做成这两件石器的样子。所以你在外面看到的那些斜面、锐角、夯土般的质感，不是造型趣味，是考古学家在这片地里挖出来的东西的形状。\n\n走进服务大厅，正前方是一面十二米高的墙。这面墙不是刷出来的颜色，而是按真实考古地层的剖面做的：一层黄、一层灰、一层黑，每一层代表一个时期。最下面是被水浸泡过的青灰色淤土，往上渐渐变黄，再往上是唐宋的文化层，夹杂着瓦砾和瓷片。考古队员在野外看到的“土”，就是这样的土；他们靠土的颜色、质地、包含物来判断年代。现在这面墙被放大到十二米高，你站在底下往上看，会有一种被人从地层里翻出来的错觉。这个展项没有一件文物，但它是全馆最重要的一件“展品”，因为它告诉你：考古不是挖宝，是读土。\n\n大厅右转，去一层的“源起江南”展厅。进门前，我少说两句越城遗址。这个遗址就在馆的东北方向，是省级文物保护单位，年代从春秋一直延续到六朝。苏州这地方，水多、土软、地下水位高，木头和骨头能留下来的不多，但恰恰因为水泡着、缺氧，很多东西反而保存得比干燥地区更好。越城一带出土过建筑构件、井圈、生活陶器，说明这里不是荒地，是一座有城墙、有街巷、有手工业的城。博物馆选址在这里，不是找一块空地盖房子，是让房子回到它讲述的那段地层旁边。\n\n还有一件事值得说。开馆前，馆里的人把苏州各个工地出土的墓砖调过来铺路，一块一块编号、记录、再铺上去。你走过去只要十秒钟，他们在工地上一块一块起砖、打包、运输、归位，花的是几个月。考古工作大部分时候就是这样：成果看起来安静，过程全是琐碎。等一下在“手铲释天书”那一厅，你会看到这些琐碎的工具；先在这里记住这条砖路，它是那些工具的直接产物。", "chars": 1026, "videos": [{"platform": "douyin", "title": "苏州考古博物馆探馆：江苏省首座考古专题博物馆", "url": "https://www.douyin.com/video/7509631030123679002", "note": "探馆向，先看空间和动线"}, {"platform": "bilibili", "title": "【展开看看】场地太够用了，那就主题化叙事吧！苏州考古博物馆", "url": "https://www.bilibili.com/video/av115553125532786/", "note": "从展陈叙事角度讲这座馆怎么讲故事"}]}, {"id": "h3", "title": "江海共潮生：一块被水改写过的地", "text": "“源起江南”的第一篇章叫“江海共潮生”。名字听着文气，讲的其实是一件很实在的事：苏州这块地，是先有海，再有湖，最后才有人。\n\n进门是一面很大的投影，水在墙上流，一会儿是浑黄的潮水，一会儿是安静的湖面。别急着走，先看它想说什么。现在的苏州，湖荡棋布、河港纵横，太湖在东边、阳澄湖在中间、澄湖在南边，大大小小几百个湖。可一万年前不是这样。那时候海平面比现在低一百多米，太湖还是个浅洼地，长江的入海口在现在很远的地方。后来气候变暖，海水漫上来，长江带来的泥沙在浅海里堆出一条条沙堤，地质上叫“冈身”。冈身以东是海，以西是潟湖和沼泽。苏州人后来赖以生存的这片水网平原，就是在那几千年里，一点一点从海里长出来的。\n\n展柜里那些动物骨骼，是这个过程的旁证。大象、犀牛、鹿这类动物，当年在这一带活动，说明气候比现在暖湿；后来环境变了，它们退场，人也跟着换活法。你看着这些骨头会有点恍惚：它们埋在现在的市中心地下几米深的地方，上面压着的是马路、小区和地铁。\n\n真正把苏州人的历史往前推一大截的，是三山岛。\n\n三山岛在太湖里，属吴中区。上世纪八十年代，考古队在岛上发现了打制石器。石片、石核、刮削器，都是典型的旧石器时代做法：拿一块燧石，用另一块石头敲，敲出锋利的刃口。这是长江下游、太湖地区第一次发现旧石器文化遗存，把苏州有人类活动的历史，推到了一万年以前。展柜里那几件石器，看上去就是几块不起眼的石头，边缘有打击疤。可你要知道，那是人在这个地球上留下的、最早的“手艺”之一。一万年前的人不会种地、不会烧陶，他们靠打猎、捕鱼、采集过日子；一块打好的石片，就是刀、就是斧、就是全部家当。\n\n再往后，水退了，湖定了，人开始在这片土地上定居。定居的关键不是房子，是稻子。\n\n这一组展柜讲稻作。草鞋山遗址出土过六千年前的水稻田，有水田、有水沟、有田埂，还有炭化的稻粒。你仔细看那些黑黑的颗粒，形状还看得出是稻谷，一头尖一头圆。它们是被火烧过、又被水泡过，才留到今天。稻作意味着什么？意味着人不再跟着食物跑，而是守着一块田，春种秋收；意味着要有固定的村子，要有存粮的仓库，要有分地界的规矩。苏州后来成为“鱼米之乡”，根子就在这几粒黑稻子上。\n\n墙上有一组地貌对比图：史前的冈身、潟湖，和今天的湖网、圩田。看的时候注意一件事：太湖不是天生就这么大的，它是慢慢扩张的；苏州的很多湖，原来是陆地，后来被水淹了；也有一些地方，原来在水下，后来被泥沙填成了田。人和水在这片土地上拉锯了几千年，谁也没彻底赢。博物馆把这个拉锯过程放在最前面，是很有道理的：你不懂这片水，就不懂苏州人为什么把房子盖在墩上、为什么把墓埋在髙地、为什么城要修成水陆双棋盘。\n\n说到水养出来的人，这一厅里偶尔会借展一件重器。开馆那年，吴王夫差剑曾经在这里短暂露过面，展期只有一个月。剑不长，剑身有暗格的菱形纹，剑格上嵌着绿松石，靠近剑首的地方刻着“吴王夫差自作用剑”一类的话。这把剑是吴国最强盛的时候造的，而吴国的中心，就在今天的苏州。一把剑放在“江海共潮生”里，用意很清楚：这片水养出了稻子，也养出了能铸这种剑的国家。\n\n看完这一厅，你会带走一个印象：苏州不是一座从来就有的城，它是一块被水反复改写过的地。人在这块地上，先学会看水，再学会用土，最后才学会筑城。", "chars": 1331, "videos": []}, {"id": "h4", "title": "手铲释天书：土是书，工具是笔", "text": "第二篇章叫“手铲释天书”。天书是什么？是埋在地下的、没有文字的那部分历史。释读它的工具，就挂在墙上。\n\n一整面墙，挂的都是真家伙：探铲、手铲、卷尺、罗盘、记录本、毛刷、竹签、标本袋。最左边那把探铲，北方叫洛阳铲，一截铁头接一根可加长的木杆。它干的活很朴素：往地下打一个直径十几厘米的孔，把土带上来。考古队员看什么？看土的颜色、湿度、松紧，看里面有没有炭屑、红烧土、碎陶片。打十几个孔，把土样在脑子里连成一张剖面图，就知道地下大概埋着什么、有多深、范围多大。这一手功夫，全靠经验和手感，仪器替代不了。\n\n墙下方那张桌子，摆的是一份完整的田野考古记录：探方日记、平剖面图、器物登记表、照片编号。字是手写的，图是铅笔画的，比例尺、指北针、日期一样不少。你可能会问，现在都有相机、有三维扫描了，为什么还手画？因为画的过程就是观察的过程。一笔下去，你得判断这条线是土色边界还是阴影，是灰坑的口还是后来打破它的沟。手画一遍，脑子才真的记住。考古界有句话：没记录，等于没挖。挖掉的地层不会再有第二次，记录是唯一的现场。\n\n往里走，是一个按比例缩小的探方。五米见方，四壁留着“隔梁”，像一块切开的蛋糕。壁上能看到分层：最上面是耕土，下面是近现代扰土，再往下是明清、宋元、唐宋，一层压一层。考古学管这个叫“地层学”：晚的在上，早的在下，除非后来有人挖坑把它翻了。还有一种关系叫“打破”：一个灰坑切穿了下面的地层，那灰坑一定比地层晚。判断早晚，靠的就是这两条规矩，听起来简单，做起来极难——因为土的颜色差别可能只有一点点，太阳一偏就看不出来。\n\n这一厅还有一组土样，装在透明柱子里，旁边是不同质地的土块。有些可以上手摸：沙土、黏土、夯土、淤土。摸一下就知道，为什么考古队员总说“土会说话”。夯土硬、有层理；淤土细、发青；烧土发红、带孔隙。一个遗址里，这三种土往往挨在一起：夯土是墙，淤土是洪水或池塘，烧土是灶或窑。你摸过一遍，再看展柜里的遗迹照片，就能看懂那些黑白图上的线。\n\n再往里的展柜，讲的是土出来以后的事。陶片从工地回来，先洗、再编号、再拼对。一个探方几千片陶，能拼成完整器的可能只有几件。拼的时候按口沿、腹片、底片分类，按纹饰、陶质排队，像拼一幅没有参考图的拼图。拼出来之后是修复：粘接、补配、做旧，缺的部分用石膏补上，但绝不画花纹冒充原件。你在展柜里看到那些“半真半补”的陶器，补的部分颜色略浅，就是为了让你一眼分清哪是原件、哪是修复。\n\n沿墙的通柜，按材质排过去：陶、瓷、漆木器、青铜器、玉石器。每一类旁边都标着常见的病害：陶器会酥粉、瓷器会脱釉、漆木器会干裂变形、青铜器会生绿锈甚至“青铜病”、玉器会沁色。这些词听着专业，其实说的都是同一件事：东西从埋藏环境里出来，见了光、见了空气，就开始坏。所以文保人员的工作，一半是修，一半是“稳住”——控制温湿度、控制光照、做囊匣、做支撑，让它坏得慢一点。\n\n科技考古的部分在这一厅的尽头。碳十四测年，靠的是有机物里碳的衰变；热释光，测的是陶器最后一次受热到现在多久；同位素分析，看锶、铅、氧、碳、氮、硫的比例，能推断一个人小时候喝哪里的水、吃什么、在哪里长大。这些话听起来像物理课，但落到具体问题上很动人：比如一块人骨，锶同位素告诉你他不是本地人，那他为什么埋在苏州？是嫁过来的、打过来的，还是做生意的？考古学就是这样，用仪器回答很朴素的问题：这个人是谁，他从哪来，他吃什么。\n\n这一厅走完，你应该明白一件事：考古的大部分时间不在“挖”，在“记”和“读”。土是书，工具是笔，耐心是全部。", "chars": 1446, "videos": []}, {"id": "h5", "title": "考古见姑苏（上）：一面剖开的土墙", "text": "“考古见姑苏”这一厅，进门正对着的是一面墙。不是展柜，是一整面被剖开的土。\n\n这是草鞋山遗址的地层剖面，一比一复原。草鞋山在唯亭，离这儿三十多公里，是苏州最有名的一处史前遗址。上世纪七十年代开始发掘，挖出了水稻田、房址、墓葬，也挖出了一整套从马家浜、崧泽、良渚、马桥一直到吴越文化的连续堆积。考古界把它叫作“江南史前文化标尺”——意思是一把尺子，江南别的遗址挖出来，年代对不对，拿它比一比就知道。\n\n站远一点看这面墙。最下面是一层灰黑色的湿土，那是马家浜人活动的地面；往上有一层带红烧土的堆积，是房子倒了、灶塌了；再往上是崧泽的灰坑和墓葬；再往上是良渚那一层，颜色发黄，夹杂着大块的墓坑填土；最上面是马桥和吴越的硬陶片层。每一层都能看到一条不规则的边界，像树桩的年轮。考古队员就是靠这些边界判断“谁压在谁上面”，一层一层往下读。\n\n墙上嵌着几个“抽屉”，里面是这一层出土的典型器物。马家浜那一层，最醒目的是腰檐陶釜：一个圆底的大锅，口沿外面加了一圈宽檐，像给锅戴了顶草帽。为什么这么设计？因为它是架在灶上煮东西的，宽檐能挡住溢出来的汤水，也能让热气少跑。这个设计在今天看来很聪明，七千年前的人已经想到了。旁边是红衣陶豆，高柄的托盘，红陶衣上还留着打磨的光。豆是盛食物的，说明那时候的人已经开始讲究“怎么把饭摆上桌”。\n\n崧泽那一层，最好看的是彩绘陶罐。陶罐不大，腹部用红彩和黑彩画着弧线、圆点、编织纹。你凑近看，线条很稳，不是随手涂的；画的时候陶坯还是湿的，画完再烧，颜色就咬在胎上。崧泽人已经不只满足于“能用”，他们要在器物上留下图案。这些图案什么意思？可能是记号，可能是信仰，也可能只是好看。考古学家不敢乱猜，但可以确定一件事：人开始有余力去装饰生活了。\n\n良渚那一层，玉器上场。展柜里那件玉璧，青绿色，中间一个圆孔，表面打磨得像镜子，边缘有一圈细细的凹槽。玉璧在良渚文化里不是装饰品，是礼器，出现在高等级墓葬里，和玉琮配成一套。玉琮是外方内圆的柱体，四面刻着神人兽面纹：上面是一个戴羽冠的人，下面是兽的眼睛和獠牙。这个图案在良渚分布范围内反复出现，说明它不是一个部落的记号，是一个共同信仰的标志。能调动人力开采玉料、雕刻、祭祀，背后一定有一个已经分层的社会。\n\n从良渚往上，是马桥文化。陶器变了：器壁变薄、火候变高，出现了硬陶和原始瓷。硬陶是用含铁量高的黏土、在更高温度下烧出来的，敲起来声音清脆。再往上是吴越的几何印纹硬陶，表面拍印着回纹、云雷纹、席纹。为什么突然流行拍印？因为快。拍印一个模子能复制一片，产量上去了，说明用的人多了、交换多了。器物的变化，背后是社会的节奏在加快。\n\n看完墙，往右走，是一个单独的展柜，光线压得很暗。里面躺着一具人骨。\n\n这是草鞋山遗址马家浜文化墓葬的墓主，距今六千多年。骨骼保存得相当完整，仰身直肢，头朝北，双手放在身体两侧。牙齿还在，磨耗得很平，说明他常年吃粗糙的、带砂的食物；盆骨和腿骨的形态，能看出他生前的体态和劳动方式。考古队员清理这座墓的时候，是一根骨头一根骨头剔出来的：先画图，再照相，再编号，最后整体起取。你现在隔着一层厚玻璃看他，他在土里躺了六千年，姿势一直没变。\n\n这一柜旁边写着他的随葬品：几件陶器，一把石斧，一些穿孔的装饰品。不多，但够用。马家浜时期的墓葬，随葬品差别不大，说明那时候的人死后待遇差不多——社会还没有拉开明显的等级。到了良渚，随葬品就分化了：有的墓几百件玉器，有的墓一件没有。这中间的几千年，就是“文明”发生的过程。\n\n这一厅的动线最后绕回入口那面墙。你可以再看一眼那些层位线，然后想想刚才看过的人骨、陶釜、玉璧：它们不是按“好看”排的，是按“时间”排的。同一块地上，七千年前的人用腰檐釜煮饭，五千年前的人用玉璧祭天，三千年前的人用印纹陶装酒。地层把他们的日子压成了一本可以翻开看的书。", "chars": 1563, "videos": [{"platform": "bilibili", "title": "苏州草鞋山考古遗址公园", "url": "https://www.bilibili.com/video/av363312895/", "note": "看遗址现场与稻田遗迹，配合本厅地层剖面看"}]}, {"id": "h6", "title": "考古见姑苏（中）：一座城的两千五百年", "text": "从史前出来，这一厅讲城。\n\n先看中间那个沙盘。木渎古城，在苏州西边，灵岩山、五峰山一带。上世纪八十年代，考古队员在那一带做调查，发现田埂、土墩的走向有点怪，不像自然地形；后来顺着这些线索找，找出了城墙、城壕、城门，还有城内的河道。这是一座春秋晚期的大型城址，面积不小，有城墙、有水门，城外还有一圈护城的河。它入选了当年的全国十大考古新发现。苏州那三次“十大”里，这是其中一次。\n\n沙盘旁边的照片，是城墙的剖面。夯土一层一层，每层厚十几厘米，夯窝还看得出来。夯土怎么做的？把土倒进木板夹成的模子里，用木杵一下一下砸实，砸一层、加一层。这种墙不怕水，越砸越硬。你现在去苏州的古城墙上摸，还是这个手感。三千年前的人筑城，用的就是这套办法。\n\n为什么要在木渎筑这么一座城？因为那是吴国最强的时候。公元前五百多年，吴王阖闾把都城从梅里迁到今天的苏州，让伍子胥“相土尝水，象天法地”，筑了一座大城。城周长四十七里，有水陆八门，城门上建楼，城内有河道。这座城的位置，两千年没大挪动过。木渎古城是同一时期、同一文化圈的另一个中心，可能是军事性的，也可能是祭祀性的，学界还有争论。但有一点没争议：吴国当年在这一带，有能力调动大量人力筑城、挖河、造兵器。\n\n再看墙上那幅长卷。\n\n这是南宋《平江图》的复制品。原碑刻于绍定二年，也就是一二二九年，现在还在苏州碑刻博物馆。图上画的是当时平江府城，也就是苏州：城墙、城门、河道、桥梁、寺观、衙署，全标出来了。你注意看它的骨架——横平竖直的街巷，配上同样横平竖直的河道，街和河并排走。这就是苏州人说的“双棋盘”：陆上一张棋盘，水上一张棋盘，两套叠在一起。图上标了三百多座桥。\n\n旁边是今天苏州的航拍图。两张图并排，你会起鸡皮疙瘩：主干河道的位置几乎没变，人民路还是那条人民路，临顿路还是临顿路，城门的位置还是那几座。八百年前的图，能直接拿来对今天的城。这在世界城市史上都少见。\n\n为什么能这样？一半是水，一半是人。水定了骨架：河道不能随便改，改了全城淹；人认这个骨架：一代一代在原来的街巷上翻修、重建，不轻易另起炉灶。所以苏州的城，是“叠加”出来的，不是“推倒重来”的。考古队在金城新村、北园、混堂巷北这些地方挖，挖到的地层从唐宋一直排到春秋晚期，中间几乎没有断档。一座城，两千五百年一直有人住，土里就留下这样一本连续的书。\n\n这一厅最后有一句话，写在展板的下角，字不大：“城不是一天建成的，也不是一天消失的。”看完沙盘和两张图，你再读这句话，会有分量。", "chars": 1022, "videos": [{"platform": "bilibili", "title": "【展开看看】场地太够用了，那就主题化叙事吧！苏州考古博物馆", "url": "https://www.bilibili.com/video/av115553125532786/", "note": "从策展叙事角度讲这座馆怎么讲故事"}]}, {"id": "h7", "title": "考古见姑苏（下）：一片瓦，一个字", "text": "这一厅只讲两件小东西：一片瓦，一个字。\n\n先看瓦。这是一块筒瓦的残片，灰陶，弧面，内壁有布纹。瓦面上有一个戳印，方方正正，印出一个“右”字。字是秦系篆书，笔画硬，转折方。这块瓦出自金城新村遗址，同出的还有一批高等级建筑构件：瓦当、脊饰、铺地砖。规格不低，不是普通民宅能用。\n\n“右”是什么意思？秦代官署分左右，右为尊。“右”字的戳印出现在建筑瓦件上，说明这批瓦是官署督造的，属于官方建筑。更关键的是，同样的瓦、同样的戳印、同样的制作工艺，在陕西、甘肃的秦代遗址里也出土过。也就是说，秦人把他们在关中那套营建制度，原样搬到了江南。\n\n这就解决了一个大问题：秦统一之后，会在稽郡的郡治到底在哪？文献说在吴县，也就是今天的苏州，但具体位置一直说不清。金城新村这批官署建筑构件一出来，位置就锚定了——郡治就在金城新村一带。公元前二二二年，秦将王翦平定楚国江南，置会稽郡，置吴县，郡治、县治都设在吴国故都。这块瓦，就是那条文献记载的实物证据。\n\n再看那个字。\n\n旁边展柜里是一件陶罐的残片，肩上拍印着一个“市”字。这个“市”，写法和六国文字都不一样，是标准的秦系写法。秦始皇统一天下之后“书同文”，把六国的异体字废掉，以小篆为标准。一个“市”字写成这样，说明这件器物是秦代的，也说明它跟官方市场有关。\n\n一个字能说明什么？说明制度落地了。度量衡统一、文字统一、市场管理统一，这些事听起来宏大，落到实物上就是一个戳印、一个写法。苏州古城考古第一次发现带“大市”字样的楚国量器，也是在类似的逻辑里：一个量器上的字，证明这里的市场是官方管的，这座城是行政中心。\n\n这一厅的展板上有句话，我念给你听：“考古学有时候很奢侈，用一个字，回答一座城的问题。”你站在两块残片前面，会觉得这话不夸张。", "chars": 722, "videos": []}, {"id": "h8", "title": "文明溯源（上）：从平等到等级", "text": "下到负一层，展览叫“华章江南”，第一篇是“文明溯源”。它的时间轴从七千年前排到四千年前，讲一件事：人怎么从“大家都差不多”，走到“有人站在最上面”。\n\n先看第一组墓。\n\n马家浜文化的墓葬，一排排，都是长方形竖穴，头朝北，仰身直肢。随葬品很朴素：一件陶釜、一只陶豆、几件小陶罐，讲究一点的加一把石斧、一串骨珠。墓与墓之间差别很小，谁家多一只罐子，谁家少一只，不构成等级。考古学管这叫“平等社会”：血缘群体共同劳动、共同分配，死者埋在公共墓地里，待遇大致相当。\n\n再看崧泽那一组。\n\n同样是墓，差别出来了。有的墓只有几件陶器，有的墓随葬玉璜、玉玦、玉钺，还有成组的彩绘陶器。玉璜是挂在胸前的弧形饰件，玉钺是权力象征的斧，玉玦是耳饰。玉石器在那个年代不是随便能有的东西：玉料要开采、要运输，琢磨一件要花很多工时。一个人能带着这些下葬，说明他生前能调动别人的劳动。\n\n张家港东山村遗址，是这一阶段最重要的发现之一。那里出土了崧泽文化早中期的高等级墓葬，墓坑大、随葬品多，有的墓里随葬石钺、玉器、陶器上百件。一个墓就能看出社会已经分层了：有人是“被埋葬的普通人”，有人是“被隆重送走的首领”。考古学管这个阶段叫“分节社会”——社会像一棵树，开始长出主干和分枝。\n\n再往上，是良渚。\n\n良渚的墓，不在公共墓地里了，埋在高台上。高台是人工堆起来的，几十万方土，靠一筐一筐挑上去。能组织这种工程的人，权力已经很大。墓里的随葬品也变了：玉琮、玉璧、玉钺成组出现，玉琮上刻神人兽面纹，玉钺的刃部没有一点使用痕迹——它不是干活的斧头，是仪仗。\n\n展柜里那件玉琮，你可以绕着看。外方内圆，四面中间有直槽，槽里刻着神人兽面：上面一个戴羽冠的人，双手扶在兽的肩上；下面一双大眼睛，獠牙外露。这个图案很小，要用放大镜才看得清线条，但它是整个良渚文化圈共同的标志，从浙江到江苏，几百公里范围内都一样。共同的信仰，意味着共同的上层。\n\n玉钺旁边有一段说明：钺从石斧演变而来，本来是工具，后来变成礼器，最后变成军权的象征。这个演变很值得琢磨：一件东西从“有用”变成“有意义”，中间隔着的就是社会结构的变化。谁掌握暴力，谁就掌握分配；谁掌握分配，谁就能让别人给他修墓。\n\n这一厅的结尾，是一张图：从马家浜到良渚，墓坑由小变大，随葬品由少变多，玉器由无到有，高台由无到有。四条曲线一起往上走。考古学家不太用“进步”这个词，因为进步是价值判断；他们只说“复杂化”。社会变复杂了，这是事实。\n\n你走出这一厅的时候，可以想一个问题：如果有一天，你的墓被一千年后的人挖开，里面的东西会告诉他们什么？良渚人的墓告诉我们的，不是他们有多富有，是他们已经相信了一些东西，并且愿意为这些信仰付出劳动。", "chars": 1100, "videos": []}, {"id": "h9", "title": "文明溯源（下）：一块田，一堆石头", "text": "这一厅有两件“大东西”：一块田，一堆石头。\n\n先说田。\n\n展柜里是一段被整体起取的稻田遗迹，土是灰褐色的，表面能看到一条条浅浅的沟，沟与沟之间是平整的田面。这是草鞋山遗址马家浜文化的水田，距今六千年左右。考古队员当年挖到它的时候，先看到的是几条平行的小沟，一开始以为是自然淤积；后来在沟里发现了炭化稻粒、稻叶，还有田埂的痕迹，才确定这是人工开出来的水田。\n\n旁边有显微放大的照片。一粒炭化稻谷，被放大几十倍，能看到谷壳上的纹路、芒的断口。它为什么会炭化？可能是收割后没来得及收进屋，被火烧了；也可能是故意烧荒。不管哪种，它被烧成了炭，反而不腐，留到了今天。\n\n展柜上方有一段灌溉系统的动态复原：水从河沟引进来，经过水口，流进田里；田埂把水一块一块拦住；排的时候，水从另一头的缺口出去。这套系统看着简单，其实是稻作农业的核心技术。水稻不是撒下去就完事，它要控水：插秧时水浅，分蘖时水稍深，晒田时要排干。六千年的人已经懂得按阶段调水。\n\n稻作带来的变化，展板上写得很清楚：定居、人口增长、剩余产品。有了剩余，才有人可以不种地，去烧陶、磨玉、管祭祀；有了人口，才需要更大的聚落、更复杂的组织。所以你看，后面那些玉器、城墙、大墓，根子都在这块田里。\n\n再说石头。\n\n展厅一侧，是一个石室土墩的复原模型。土墩不高，顶上用石块垒出一个长方形的小室，有门道，有盖石。这类遗存在太湖周围的山顶上分布很广，苏州、无锡、常州都有，年代大多在西周至春秋。它是什么？学界有几种说法：军事瞭望、烽燧、祭祀场所、墓葬。比较主流的看法是，它跟吴越时期的军事防御和山地祭祀都有关，不同地点的功能可能不一样。\n\n模型旁边是一段春秋城墙的微缩复原：夯土墙、城壕、城门、角楼。墙不高，但很厚，剖面是梯形。筑墙的方法是版筑：两块木板夹住，填土，夯打，一层一层往上加。城门有水门和陆门，水门让船能进城。这套东西，跟前面木渎古城沙盘上看到的是同一套。\n\n把田和石头放在一个厅里，是有用意的。田代表“留下来过日子”，石头代表“守住这块地”。从马家浜到吴越，几千年里，苏州人做的事其实没变：找一块能种的地，把它围起来，守住。变的是工具、组织和技术。\n\n这一厅的角落还有一小块展板，讲的是“稻田里的杂草”。考古队员在稻田遗迹的土样里，浮选出稗草、莎草一类的种子。这些草当年跟稻子抢养分，农民要拔掉。六千年后，它们从土里被泡出来，成了研究古代农业的标本。一件很小的事，但很动人：连杂草都被记住了。", "chars": 1002, "videos": [{"platform": "bilibili", "title": "苏州草鞋山考古遗址公园", "url": "https://www.bilibili.com/video/av363312895/", "note": "看遗址现场与稻田遗迹，配合本厅地层剖面看"}]}, {"id": "h10", "title": "吴越新证（上）：天下最好的剑", "text": "“吴越新证”这一厅，最有名的是剑。\n\n展柜里平放着一把春秋青铜剑，剑身窄长，中脊起棱，两刃有细微的弧度。灯光打上去，剑身的暗纹像水波一样浮出来。你凑近看，会发现那些纹路不是刻的，是铸出来的——铸剑的时候，在剑范上做出了凹凸，铜水浇进去，纹路就跟剑身长在一起。这种工艺叫“菱形暗格纹”，吴越地区特有。\n\n剑的首部也值得看。圆盘形的剑首，上面有一圈一圈极细的同心圆，细到什么程度？用放大镜看，线条之间的间距不到一毫米。在没有车床的年代，靠的是范铸和手工打磨。这种精度，是吴越铸剑师的门槛。\n\n再看剑格。剑格是剑身和剑柄之间的那小块，有的嵌绿松石，有的错金银。一把剑，从剑身到剑首到剑格，每一处都在较劲：既要锋利，又要好看；既要轻，又要韧。吴越的剑，是当时天下最好的兵器之一。\n\n这跟苏州有什么关系？关系大了。吴国的中心在今天的苏州，越国的中心在今天的绍兴，两国打了几百年，打出了铸剑的最高水平。苏州城里现在还有干将路、莫邪路，传说干将莫邪在这里铸剑。传说不能当史料用，但它说明一件事：苏州人对“铸剑”这件事，记了两千多年。\n\n展柜旁边有一段关于“复合剑”的说明，我讲一下。复合剑是把剑身分成两部分：脊部用含锡量低的铜，韧；刃部用含锡量高的铜，硬。两种铜分别铸好，再合铸在一起。这样铸出来的剑，脊不容易断，刃又锋利。这个思路，跟今天做刀具的“夹钢”是一个道理。两千五百年前的工匠，已经在用材料复合的办法解决“又硬又韧”的矛盾。\n\n剑不只是兵器。在吴越的墓葬里，剑常常放在死者的身侧，有的还配有剑鞘、剑匣。随葬剑的人，多半是武士或贵族。剑是身份的证明：你有资格佩剑，说明你在社会上有个位置。所以考古学家看到一座墓里有剑，不只会说“这是武器”，还会说“这是一个有军事身份的人”。\n\n这一厅靠里的位置，曾经借展过一把吴王夫差剑。剑身上有铭文，剑格嵌绿松石，保存得极好。它只在苏州待了一个月，但引起的动静不小。为什么？因为夫差是苏州这座城市真正的“建城者”之一——阖闾、夫差父子把吴国推到顶峰，也把苏州推成了东南第一都会。一把刻着他名字的剑，回到他当年的都城，这件事本身就有分量。\n\n看完剑，往旁边走，是城的部分。春秋城墙的微缩模型、木渎古城的沙盘，前面已经讲过。这里补一句：剑和城是一体两面。城是守，剑是攻；城圈住了人，剑决定了城能圈多大。", "chars": 948, "videos": []}, {"id": "h11", "title": "吴越新证（下）：一只量器与春申君", "text": "这一厅讲一个“新东西”。它上展线的时候，考古简报都还没发。\n\n二〇二五年四月，姑苏区余天灯巷遗址，考古队员在整理出土器物的时候，发现了一件形状有点特别的陶器：圆筒形，一侧有把，口沿外撇，器身有一条条轮制的弦纹。清洗之后，器身上露出了文字。所里研究楚国文字的沈浩被从张家港叫回来，看完说：这是楚国的量器，叫“筲”，上面的字是“大市”。\n\n“大市”两个字，信息量很大。市，是市场；大市，是官方管理的大型市场。度量衡是官方制定的，量器只可能出自官方。也就是说，这件东西不是普通人家用的，是市场里用来量粮食的官器。\n\n为什么这很重要？因为它把苏州的城市史往前推了一截。过去讲苏州建城，最硬的一条证据是《史记》里伍子胥筑阖闾大城，公元前五百一十四年。余天灯巷这件量器，年代在战国晚期，它证明那个时候的苏州，已经是一个有官方市场、有度量衡管理、有城市行政体系的城。这比“有城墙”更进一层：城墙说明有人住，市场说明有人在交易、有制度在管。\n\n跟这件量器呼应的，是春申君。\n\n战国晚期，楚国灭了越国，吴地归楚。楚考烈王把黄歇封在这里，号春申君。春申君在吴地修水利、开河道、治理旧城，史书上说他“以故吴墟为城”——在吴国的旧都废墟上，重新修起城来。苏州人至今记得他：城里有春申湖、春申路，上海叫“申城”，也是从他这儿来的。\n\n所以苏州这座城，不是一次建成的。阖闾筑城是一次，春申君修城是一次，秦置会稽郡是一次，后面还有无数次。每一次改朝换代，城都被重新整理一遍，但骨架没换。考古学能看到的是：地层里的建筑构件换了样式，陶器的形制换了风格，但城墙的位置、河道的走向，一直没大动。\n\n这一厅的展柜里，还有几件秦代的东西：带“右”字戳印的瓦、秦式的陶器。它们和楚国量器放在一起，讲的是同一个故事：苏州这块地方，在战国到秦的几十年里，被楚人、秦人轮番接管，每一拨人都留下了自己的制度痕迹。一个量器、一片瓦、一个字，就是这些痕迹。\n\n看完这一厅，你会意识到一件事：我们总说苏州两千五百年建城史，这个数字不是算出来的，是一件一件东西堆出来的。每挖出一件带字的东西，这个数字就可能往前挪一点，或者变得更结实一点。", "chars": 874, "videos": []}, {"id": "h12", "title": "都会寻踪（上）：把一座墓搬进博物馆", "text": "“都会寻踪”这一厅，整个空间是为一件东西让路的。\n\n一座墓。九十几吨，占地一百五十平方米，长十五米，宽十米。它不是模型，是从虎丘路新村土墩整体搬过来的三国孙吴一号墓，原砖原位置，一比一复建。你从侧面绕过去，先看到的是墓的外壁：砖一层一层砌上去，砖缝里的灰浆还在，墙面高低不平，像一堵老墙。\n\n先讲它怎么来的。\n\n这座墓是十多年前配合基建考古发现的，发掘工作一直持续到二〇一八年。墓在虎丘路新村的一个土墩里，土墩上面是民房，下面是墓。发掘结束之后，问题来了：原址不具备保护条件，不可能把整片小区改成遗址公园。按常规做法，这种墓做完资料、取完文物，就回填了。但这座墓太大、太重要，所里决定整体搬迁。\n\n搬迁的方案，是把墓室切割成几大块，每一块先用钢架固定、用泡沫和石膏包裹，再整体吊起来，运到博物馆，最后按原来的位置重新拼回去。砖是原来的砖，位置是原来的位置。你在馆里看到的每一道砖缝，都是当年砌墓的人留下的。\n\n再看墓的形状。俯视是十字形：一条长长的墓道从南边斜下去，接甬道，进前室，前室两侧各有一个耳室，再往里是后室。这是孙吴时期高等级墓葬的典型布局。前室是祭祀、行礼的地方，后室放棺，耳室放随葬品。整座墓用砖砌，砖的规格有好几种，有的侧面模印着花纹，有的印着字。\n\n字很关键。墓里出土了“吴侯”铭文砖，还有“建兴二年七月廿一日吴王口”的纪年砖。建兴是孙亮的年号，二年是公元二五三年。有“吴侯”、有“吴王”、有明确纪年，再加上五十八件金器、四件铜器和一批青瓷，墓主的身份就清楚了：孙吴宗室里的高层人物，而且很可能是女性。\n\n为什么苏州会有孙吴的宗室大墓？因为孙吴的根基在吴。孙权的父亲孙坚是吴郡富春人，孙氏一族从这一带起家，最后建立了割据江东的政权。苏州是孙吴的腹地，宗室、功臣、贵族埋葬在这里，合情合理。过去苏州没有发现过三国大墓，东汉末到六朝之间这一段，苏州人用什么、怎么生活，一直是空白。这座墓把这段空白填上了。\n\n现在你绕着墓走一圈。注意看墓壁的砖：有的砖面上有手指按过的凹痕，那是当年制砖的工匠留下的。砖坯放在地上晾的时候，还是软的，工匠搬动、码放，手指就按进去了。一千七百多年后，这些指纹还在。你看到的不是“文物”，是一个人的手。", "chars": 905, "videos": [{"platform": "douyin", "title": "苏州考古博物馆打卡攻略：孙吴一号大墓是重头戏", "url": "https://www.douyin.com/video/7505364536519822619", "note": "打卡向，看大墓的体量"}, {"platform": "bilibili", "title": "沉睡1800年的孙吴贵族墓重见天日", "url": "https://www.bilibili.com/video/BV1V7NkzzEzt/", "note": "讲墓主身份与出土金器"}]}, {"id": "h13", "title": "都会寻踪（中）：一支龙首金钗", "text": "墓的旁边，是它的随葬品。一整排展柜，灯光打得很低。\n\n先说那支金钗。\n\n它躺在深色绒布上，长二十六厘米，重二十七点一克。钗头是一条龙：龙嘴张开，龙角后掠，眼睛、耳朵、鬃毛都用极细的金丝和金片做出，龙鳞是一颗一颗小金珠焊上去的。这种工艺叫“炸珠”：把金丝剪成小段，熔成小球，再一颗一颗焊到器物上。焊的时候温度差一点就化，差一点就粘不住，全靠手上的功夫。\n\n这支钗的主人，是一位年轻女性，地位很高。为什么这么说？因为钗的规格、工艺，不是普通人能用的；更因为，苏州博物馆里还藏着一支凤首金钗，形制、工艺、尺寸跟它是一对。一支龙首、一支凤首，分藏在两个馆里。考古学家推断，它们原本属于同一个人，或者同一场葬礼。\n\n一对钗，隔着一座城，各自躺在展柜里。你站在这里看龙，走几公里到苏博看凤，才能把一件完整的东西拼起来。这是考古博物馆常有的遗憾：东西出来了，但被分开了。\n\n除了金钗，墓里还出土了五十八件金器：金镯、金环、金珠、金饰片。有的薄得像纸，有的细得像线。金器在那个年代不是流通货币，是身份的标志。一个人身上带这么多金，说明她的家族有实力，也说明孙吴上层的生活有多讲究。\n\n铜器只有四件，但件件精。同一时期的一件龙首铜熏，器身是镂空的，盖顶做成龙首，烟从龙嘴里出来。熏炉是贵族生活里的日常器物：焚香、熏衣、驱虫。你想想那个画面：一千七百年前，一位年轻女子坐在堂上，熏炉里的香烟从龙口袅袅升起，她头上戴着那支龙首金钗。这两件东西，是同一个人生活里的两个片段。\n\n瓷器是另一大类。青瓷盘口壶、青瓷罐、青瓷碗，釉色青灰，胎体坚致。孙吴时期的青瓷，是越窑系统的早期产品，釉层薄，容易剥落，但已经是真正的瓷器，不是原始瓷。墓里还出了陶器、石器、玉器、琥珀、琉璃。琥珀和琉璃不是本地产物，是从外面换来的。一条海上或陆上的贸易线，在这座墓里留下了痕迹。\n\n墓的旁边还有两座墓。二号墓是陪葬墓，时代相同，出土了一批精美文物；五号墓建在一号墓的封土里，出了“建兴二年七月廿一日吴王”纪年砖和“吴侯”文字砖。三座墓埋在一个土墩里，说明这是一处家族墓地。孙吴的宗室，把家族的死者集中埋在一起，地面上堆起高大的封土。一千七百年后，封土被推平，下面的人被请进了博物馆。\n\n这一厅的最后一件展品，是一张墓主复原像。画的是个年轻女子，梳着高髻，插着金钗。复原像不是凭空画的，是根据头骨、随葬品、文献综合推断的。她长什么样，没人知道；但她戴过什么、用过什么，我们知道。考古学能给的，就是这些。", "chars": 1009, "videos": [{"platform": "bilibili", "title": "沉睡1800年的孙吴贵族墓重见天日", "url": "https://www.bilibili.com/video/BV1V7NkzzEzt/", "note": "讲墓主身份与出土金器"}]}, {"id": "h14", "title": "都会寻踪（下）：过日子用的东西", "text": "从三国往下走，时间一下子快了起来。这一厅讲的是“过日子”。\n\n先看那件唐三彩粉盒。\n\n盒子不大，扁圆形，盖和身子母口扣合。盖面上施黄、绿、白三色釉，釉子流淌交融，像一块打翻的颜料。三彩是低温铅釉，烧成温度不高，釉色鲜艳但容易剥落。这件粉盒的釉保存得不错，盖沿有一圈细小的开片。\n\n粉盒是装化妆品的：粉、胭脂、香膏。唐代女性化妆步骤很多，敷粉、涂胭脂、画眉、点唇，一套下来要小半个时辰。粉盒是随身物件，也是陪嫁、赠礼。苏州出土唐三彩，说明唐代的苏州不是闭塞的乡下：三彩的主要产地在河南、陕西，一件东西从中原运到江南，要么走运河，要么走商路。\n\n再看那枚明金戒指。\n\n戒指很小，金质，戒面是一个小小的方形，上面錾刻着花纹。明代的金银首饰，工艺已经非常精细：锤揲、錾刻、累丝、镶嵌，样样都有。这枚戒指出自明代的墓葬，墓主大概率是一位女性。戒指戴在手上，是装饰，也是身份；死后随葬，是家人给她的最后一件礼物。\n\n旁边那件陶骆驼，是另一条线索。\n\n骆驼不是江南的动物，它出现在苏州的墓葬里，只有一个解释：它是“丝绸之路”的符号。唐代的苏州，通过运河连接洛阳、长安，再通过陆路连接西域。骆驼俑随葬，是希望在另一个世界也能继续走那条路。一件陶骆驼，把一个江南城市和几千里外的沙漠连在了一起。\n\n这一厅还有铜镜、青瓷执壶、金银饰件、钱币。铜镜的背面铸着瑞兽、葡萄、缠枝花纹，正面磨得能照人。青瓷执壶是酒器，壶身圆鼓，肩部有流，把手做成带状。钱币从开元通宝到宋代年号钱，一串一串，说明这里的商业一直没有断。\n\n把这一厅的东西连起来看，是一幅生活图景：唐代的女人用三彩粉盒化妆，男人用青瓷执壶喝酒；宋代人照铜镜、用钱币；明代的女人戴金戒指。朝代换了，日子还在过。考古学管这个叫“物质文化史”——听起来学术，其实就是“古人用什么”。\n\n这一厅的墙上，挂着《平江图》的局部放大。图上画着街巷、桥梁、店铺、寺庙。你对照展柜里的器物看：图上的店铺卖什么？可能就卖这些瓷器、铜镜、金银饰件。图上的桥边有什么？可能有茶馆、有酒肆。一件器物，落在图上的某个位置，就有了具体的场景。\n\n考古博物馆最动人的地方，就在这儿：它不只告诉你“这是唐代的”，还告诉你“这是唐代某个人早上用过的东西”。", "chars": 905, "videos": []}, {"id": "h15", "title": "海丝遗痕（一）：城北的一把窑火", "text": "“海丝遗痕”的第一组展柜，讲的是苏州城北的一把火。\n\n元和塘，在齐门外，一条南北向的河。河道两岸，考古队发现了一处南宋时期的窑址。窑不算大，但出土的东西很特别：不是碗、不是盘，是一批陶礼器。\n\n什么叫陶礼器？就是照着青铜礼器的样子，用陶土烧出来的鼎、簋、壶、豆。鼎有三足、两耳，腹部装饰着兽面纹；簋是圆腹、圈足，两侧有耳；壶有盖、有流、有把。这些器形，本来是商周青铜器的形制，南宋的人拿来用陶土复刻，烧成之后用于祭祀、随葬。\n\n为什么用陶仿铜？因为铜贵。南宋偏安江南，铜料紧张，铜器是国家管控的物资。但礼制不能废，祭祀要有鼎簋，怎么办？用陶代替。这个做法在宋代很普遍，叫“陶礼器”。元和塘的窑，就是专门烧这个的。\n\n展柜里有一件陶鼎，你可以看它的耳朵：耳朵是单独做好，再粘上去的，接缝处有抹泥的痕迹。三足也是后接的。这种“分体制作、粘接成型”的办法，是为了防止大件器物在烧的时候开裂。旁边有一件陶壶，壶身用轮制，壶嘴和把手是手捏的，接上去再修整。\n\n窑址里还出土了大量的窑具：垫饼、支圈、匣钵。垫饼垫在器物底下，防止粘窑；支圈把器物隔开；匣钵把器物罩住，防止烟灰落在釉面上。这些其貌不扬的陶块，是烧窑的“工艺参数”。考古学家看窑具，就能推断窑炉的结构、装烧的方式、产量的大小。\n\n烧窑是一件赌运气的事。一窑装几十件，火候差了，釉色不匀；火太猛，器物变形；开窑早了，冷风一激，全裂。所以窑工要会看火色：火苗发红是低温，发白是高温，看火孔里的颜色，判断什么时候封窑。一窑的成败，就在这几个时辰里。废品怎么办？砸碎，扔掉，堆在窑场旁边。考古队挖到的废品堆，往往比正品更能说明问题：哪一类器物烧得多、哪一类总烧坏，一看废品堆就知道。\n\n元和塘的窑，为什么重要？因为它证明了一件事：南宋的苏州，不只是消费城市，还是生产城市。它有窑、有作坊、有手工业者。这些陶礼器烧出来，卖给谁？卖给城里的祠堂、寺庙、富户，也可能沿着运河卖到外地。一条河，把原料运进来，把产品运出去。\n\n这一厅的展板上，有一张南宋苏州的复原图：城北是窑场，城南是市集，城中有河道。你看着这张图，再想想刚才那些陶鼎、陶壶：它们不是孤立的东西，它们是一座城市的手艺。", "chars": 893, "videos": []}, {"id": "h16", "title": "海丝遗痕（二）：太仓的瓷器仓库", "text": "这一厅的展柜，整面墙都是瓷器。青的、白的、蓝白相间的，一排一排，像瓷器仓库。\n\n这就是樊村泾。\n\n樊村泾在太仓，离长江口不远。二〇一六年，考古队在那里挖出了一处元代的大型建筑遗址：房址、道路、河道、码头、灰坑，还有成堆的瓷器。发掘者判断，这是一处港口仓储遗存，规模是国内已知同类遗址里最大的。它入选了当年的全国十大考古新发现。苏州那三次“十大”，这是第三次。\n\n为什么一个仓库能进“十大”？因为瓷器贸易是元代最重要的国际贸易之一，而樊村泾是这条贸易链上的一个关键节点。龙泉窑的瓷器从浙江龙泉出发，沿瓯江、经海运到太仓，在樊村泾的仓库里集中、分拣、打包，再装上大船，运往日本、朝鲜半岛、东南亚，甚至更远。\n\n展柜里最大宗的是龙泉青瓷。釉色粉青、梅子青，厚润如玉。器形有盘、碗、洗、罐、执壶。龙泉窑在元代达到顶峰，产品大量外销，樊村泾的仓库里堆的就是这些。\n\n旁边是元青花。青花瓷在元代成熟，用钴料在胎上绘画，罩透明釉，高温一次烧成。展柜里那件青花盘，盘心画着缠枝莲，蓝色浓艳，有铁锈斑——那是进口钴料“苏麻离青”的特征。元青花在当时是高档货，能出现在太仓的仓库里，说明这里的贸易层级不低。\n\n还有几件带年款的东西，是断代的“标尺”。“至元四年”款的青瓷碗底，碗底圈足内刻着“至元四年”四个字，至元是元世祖忽必烈的年号，四年是一二六七年。还有一件“至正”款的纪年陶范，至正是元顺帝的年号。有明确纪年的器物，就像一把尺子，能校准整批东西的年代。\n\n最有意思的是一件“天下”款的青瓷碗。碗底刻着“天下”两个字。这两个字什么意思？可能是窑场的字号，可能是商号的标记，也可能是某种吉祥话。一个碗，刻着“天下”，被装船运到海外——你可以想象那个场景：一只碗，从龙泉的山里烧出来，装进竹篓，走水路到太仓，进仓库，再上船，最后落在某个日本寺院或东南亚的厨房里。\n\n樊村泾的仓库，还出土了大量的陶范、窑具、垫饼。这些东西说明，仓库附近可能还有加工、修补的作坊。瓷器的贸易不只是“运”，还有“整”：坏的挑出来，好的重新包装，有的还要加款、加彩。\n\n这一厅的结尾，是一张贸易路线图：从龙泉到太仓，从太仓到长崎、到马六甲。一条线，把中国东南的山地和海外的市场连起来。苏州在这条线上，不是终点，是中转站。中转站的价值，在于它能让东西停下来、分拣、再出发。", "chars": 945, "videos": []}, {"id": "h17", "title": "海丝遗痕（三）：一只高丽青瓷碗", "text": "这一柜只有几只碗，但它们是从朝鲜半岛来的。\n\n高丽青瓷。釉色不叫“青”，叫“翡”——一种浅浅的、带点灰绿的蓝。灯下看，釉面有一层柔和的光泽，不像龙泉那样厚润，更像薄冰。碗的内壁，有一圈白色的花纹：几朵小花、几片叶子，线条是嵌进去的，摸上去有凹凸感。这种工艺叫“镶嵌”：先在胎上刻出纹样，填入白土或黑土，再施釉烧成。烧成之后，花纹就嵌在釉下，永远不会掉。\n\n高丽王朝在朝鲜半岛，从十世纪到十四世纪，持续了将近五百年。高丽青瓷是它最有名的产品，在宋代中国的文献里就有记载，说它“翡色”“天下第一”。这个评价是不是夸张，见仁见智；但高丽青瓷确实是东亚陶瓷史上的一支高峰。\n\n它为什么会在太仓？\n\n两个原因。第一，贸易。元代的太仓是长江口的国际港口，高丽、日本的商船常来。瓷器是硬通货，高丽的青瓷运到中国，中国的龙泉青瓷、元青花运到高丽，一来一往。第二，使团。元朝和高丽之间有频繁的使节往来，使团带着礼物、货物，走海路，在太仓一带登陆、中转。\n\n一只碗的旅程，大概是这样的：在高丽的窑场烧好，装进木箱，从礼成江口上船，沿海岸线南下，穿过黄海，进长江口，到太仓。卸货，进仓库，登记，再卖给中国的商人，或者转运到别的地方。它可能在某个中国人家里的桌上用了很多年，最后跟着主人下葬，被考古队挖出来。\n\n这一柜里还有一件青瓷盏托：托盘和盏是一套的，盏放在托上，托沿做成花瓣形。盏托是饮茶用的，宋代人点茶，讲究茶盏和茶托的配套。高丽的茶器和中国的茶器，形制互相影响。\n\n把这只碗和旁边的龙泉青瓷放在一起看，你会发现一个有意思的现象：两种青瓷，釉色不同、工艺不同、造型不同，但都在同一个仓库里。仓库是国际贸易的“交集点”，不同产地的东西在这里相遇。考古学家管这种遗址叫“消费地遗址”或者“集散地遗址”——它不生产，但它连接生产和消费。\n\n这一厅的说明牌上有一句话：“一只碗，可以是一个人的一生，也可以是一个时代的航线。”你看着这只高丽青瓷碗，可以想想它走过的海路。", "chars": 806, "videos": []}, {"id": "h18", "title": "海丝遗痕（四）：从黄泗浦出海", "text": "从太仓往北，到张家港，有一处遗址叫黄泗浦。\n\n黄泗浦在唐代是长江入海口的一个港口。考古队在那里挖出了河道、码头、建筑基址，还有成堆的瓷片。河道很宽，河底有木桩，岸边有石块垒的护坡。这不是一条小河沟，是一个能停船的港。二〇一八年，它入选了全国十大考古新发现。\n\n黄泗浦最有名的一件事，是鉴真东渡。\n\n唐代天宝年间，扬州大明寺的鉴真和尚，应日本僧人的邀请，决定去日本传戒。从七四三年开始，他六次东渡。前五次，要么被官府拦下，要么遇到风浪，要么船破，都没成功。第六次，七五三年，他从黄泗浦出发，带着弟子、工匠、经卷、佛像，坐船出海。这一次成功了。他到日本的时候，已经双目失明。\n\n这段历史，在中国和日本都很有名。但过去讲鉴真东渡，多讲扬州、讲日本，中间的出海口在哪里，说不清。黄泗浦遗址的发掘，把“从哪里出海”这个问题落到了地上：河道、码头、瓷片，就是证据。\n\n展柜里有一组长沙窑的瓷片。长沙窑在湖南，唐代中晚期大量生产外销瓷，釉下彩绘，写着诗、画着花。这些瓷片出现在黄泗浦，说明这个港口不只走人，也走货。瓷器从长江中游运下来，在黄泗浦中转，再出海。\n\n还有一组青瓷、白瓷的标本，来自越窑、邢窑。不同窑口的东西在同一个港口出现，说明这里的贸易网络很广。\n\n站在这一厅，你可以把苏州的海丝故事连起来：唐代的黄泗浦，是起点；元代的太仓樊村泾，是中转仓库；再往后的刘家港，是郑和下西洋的起锚地。三个点，一条线，都在苏州境内。苏州不是“海边城市”，但它通过长江、通过运河、通过太仓和张家港的港口，一直连着海。\n\n这一厅的展板上，有一张鉴真东渡的路线图。图上画着从扬州到黄泗浦，从黄泗浦出海，到日本九州。你看着那条线，会想到一件事：一千二百年前，一个失明的老人，带着一群人，从这片江口出发，去一个他看不见的地方。他带去的，不只是佛法，还有建筑、雕塑、医药、文字。一条海路，把两个国家连在了一起。", "chars": 773, "videos": []}, {"id": "h19", "title": "我们的姑苏城：街巷下面的城", "text": "负一层的角落里，有一个临展厅，叫“我们的姑苏城”。\n\n临展和常设展不一样：常设展讲的是“苏州从哪来”，临展讲的是“最近又挖出了什么”。这个厅展的是近几年苏州古城考古的成果：金城新村、北园、混堂巷北，几个遗址的器物摆在一起。\n\n先说北园。北园在古城东北，考古队在那里挖出了东周时期的墓葬和生活遗迹，出土了青铜剑、陶器、原始瓷。那把青铜剑不长，剑身有锈，但形制清楚：剑格窄，剑身起脊，是典型的东周吴越剑。北园在古城墙内，说明两千多年前这里已经有人居住、有墓葬。\n\n再说混堂巷北。那里出土了一件陶罐，肩上拍印着“吴市”两个字。这两个字，和前面金城新村出土的秦“右”字瓦、余天灯巷出土的楚“大市”量器，是同一个系统的证据：苏州古城在战国到秦，已经有官方管理的市场。“吴市”的“吴”，是吴地的吴；“市”，是市场。一个陶罐，证明这里有过交易。\n\n金城新村，前面讲过：秦代的官署建筑构件，把会稽郡治的位置锚定了。这个临展里，金城新村的展品更全：瓦当、铺地砖、下水管道、陶井圈。下水管道是陶制的，一节一节套起来，埋在街道下面。两千年前的市政工程，做得比我们想的讲究。\n\n这一厅还有一段古城墙的剖面照片。苏州的城墙，从春秋到明清，一直在修、一直在用。墙土一层一层，每一层是一个朝代。墙里还嵌着前朝的砖、前朝的瓦，甚至前朝的墓碑——修墙的人就地取材，把能用的都砌进去了。考古学家管这叫“再利用”。\n\n临展的最后一块展板，写着这个展览的名字由来：“我们的姑苏城”。为什么用“我们的”？因为这些遗址不在荒郊野外，就在我们每天走过的街巷下面。修地铁、挖管道、盖房子，一铲子下去，可能就是宋代的街面、唐代的河道、春秋的城墙。城市考古就是这样：它跟着基建走，抢救性地挖，挖完回填，上面继续盖楼。\n\n这一厅会定期换展。你下次来，看到的可能又是另一批新东西。这正是考古博物馆的特点：它不是一座封存的殿堂，它是一个还在生长的仓库。", "chars": 783, "videos": []}, {"id": "h20", "title": "下沉广场：井、柱础与露天的文物", "text": "从负一层上来，别急着出馆。往西走，有一个下沉式广场。\n\n广场是露天的，四周是建筑的墙，头顶是天。地上摆着几件大东西：陶井圈、石柱础、陶井台。它们不是放在玻璃柜里，是直接搁在户外，你可以走到跟前，绕着看。\n\n先说井。\n\n陶井圈是一节一节的圆筒，口径大约半米，壁厚几厘米，外面有绳纹。打井的时候，先挖一个竖坑，挖到出水层，把井圈一节一节放下去，边放边填土。井圈的作用是护壁，防止塌方。一口井要用多少节井圈？看井深，一般五六节，深的十几节。苏州地下水位高，挖两三米就出水，所以井不用太深。\n\n井是古代城市的心脏。一个街区，几口井，几十户人家，吃水、洗衣、淘米，都靠它。井水也是消防水源。考古队在一个遗址里找到井，就能推断这里住过人、住得密。井里还会掉东西：陶罐、木桶、铜钱、骨头。这些东西沉在井底，缺氧、避光，保存得比地面上好。很多重要的发现，是从井里掏出来的。\n\n石柱础，是建筑构件。柱子立在柱础上，柱础垫在夯土或砖石基础上，把屋顶的重量分散到地面。展出的这几块，方形，中间有一个圆形的凸起，叫“覆盆”。覆盆的作用是防潮：柱子底部容易烂，垫高了，水汽上不去。柱础的大小，能看出柱子的粗细；柱子的粗细，能看出建筑的等级。这几块柱础不小，说明它们撑的房子不低。\n\n陶井台，是井口的地面设施。一个圆形的陶台，中间一个孔，套在井口上，四周高、中间低，洗东西的水能流回井里，或者流到旁边的沟里。井台面上有磨损的凹槽，是绳子长年累月磨出来的。你摸一下那道槽，会想到无数只手在这里提水。\n\n把这几件东西放在户外，是有意为之。博物馆的墙是界限：墙里是“文物”，墙外是“生活”。这几件东西横在中间，告诉你文物本来就是从生活里来的。它们不怕风吹日晒吗？怕。所以馆里给它们做了排水、做了遮护，也定期检查。但馆方还是愿意把它们放在外面，因为“看得见、摸得着”比“保护得严严实实”更重要。\n\n站在广场上往东北看，能看见一片水面，那是石湖；水的那一边，就是越城遗址。范成大晚年住在石湖，号“石湖居士”，写《四时田园杂兴》，写的就是这一带的田、水、桑、麻。八百年前他看见的景，和今天差不太多：湖还在，堤还在，田换成了景区。博物馆选在这里，一半是因为遗址，一半是因为这片景。你从展厅里出来，正好接上这片景，参观的最后一口气，是湖风。\n\n广场的一角是咖啡厅。菜单上印着文物纹样：陶器的绳纹、玉琮的神人兽面、青瓷的莲瓣。你坐下来喝杯咖啡，抬头能看见博物馆的夯土墙。墙上的土，和展柜里的土，是同一种土。", "chars": 1012, "videos": [{"platform": "douyin", "title": "苏州考古博物馆探馆：江苏省首座考古专题博物馆", "url": "https://www.douyin.com/video/7509631030123679002", "note": "探馆向，看空间与动线"}]}, {"id": "h21", "title": "文保修复室：让它活得久一点", "text": "广场边上，有一间屋子，隔着一面大玻璃，你能看到里面有人在干活。\n\n那是文物保护修复展示区。屋子不大，几张工作台，台面上摊着器物、工具、标签。有人低着头，用一根细毛笔蘸着胶，往陶片的断口上涂；有人对着显微镜，清理一块青铜器上的锈；有人把一件刚拼好的罐子放进囊匣，垫上无酸棉纸。\n\n修复这件事，先从“洗”开始。出土的器物带着土、带着盐、带着微生物。陶器要泡水，慢慢把可溶盐析出来；盐不除，以后会在器身里结晶，把胎撑裂。青铜器要除锈，但只能除“有害锈”，不能把表面的古锈全去掉——那层绿锈是它的历史，也是它的保护层。青铜病是一种恶性锈，像癌一样蔓延，一旦发现，要立刻隔离、清洗、封护。\n\n漆木器最难。苏州地下水位高，漆木器埋在水里，饱水、软，一碰就碎。出土之后，不能晾干，一晾就收缩、开裂、变形。要先脱水：用聚乙二醇置换水分，或者用冷冻干燥，几个月甚至几年，慢慢来。脱水之后，器形才能稳住。苏州出土的汉代漆器，很多都是这样救回来的。\n\n丝织品更娇气。丝绸埋在地下，大多只剩一层印痕。遇到保存好的，要整体揭取，用丝网托着，在显微镜下清理。苏州是丝绸之府，出土丝织品的修复，一直跟上海、荆州这些机构合作。\n\n修复的原则，写在墙上：“最小干预，可识别，可逆。”最小干预，是能不动就不动；可识别，是补的部分要能看出来，不能以假乱真；可逆，是以后有更好的技术，能把今天的修复撤掉重来。这三条，是文保行业的底线。\n\n展厅里的很多器物，身上都有修复的痕迹：陶罐的口沿补了一块，颜色略浅；青铜鼎的足是后配的，接口处有一道细线；漆盘的边缘用透明材料加固过。这些痕迹不是瑕疵，是“病历”。每一件修复过的器物，都有一份档案：出土时间、地点、病害、处理过程、材料。档案跟着器物走，几十年后的人接手，能知道前人做了什么。\n\n玻璃上贴着一行小字：“修复不是让它变新，是让它活得久一点。”你隔着玻璃看里面的人，他们可能一整天只处理一件东西。考古的成果在展柜里，支撑成果的功夫在这间屋子里。", "chars": 812, "videos": []}, {"id": "h23", "title": "幕后：二十三个人的考古所", "text": "这一厅没有展柜，只有一面照片墙。\n\n照片上的人，是苏州市考古研究所的全体人员。二十三个人。\n\n苏州这么大，地下这么多东西，考古所只有二十三个人。大部分人在各个工地上，挖土、记录、整理；五六个人在博物馆附近办公，一边管行政，一边给新馆找展品。馆长程义说，人手根本不够用，开馆前还从苏州博物馆借了两个人。\n\n照片墙旁边有一段话，讲开馆前几个月的事：程义把时间“掰碎了用”，空下来就到各个工地“寻宝”，今天找这个领队，明天找那个领队，把值得展览的文物锁定下来，让各领队利用下雨天打包好，及时送到馆里。为什么是下雨天？因为下雨不能发掘，工地停工，人才有空打包。\n\n有一件展品就是这么来的。二〇二五年四月，余天灯巷遗址出土了一件楚国量器，带“大市”文字。考古简报都还没发，东西就上了展线。程义看到它，把所里研究楚国文字的沈浩从张家港叫回来，做完释读，再把人“放”回去，然后送修、上展。一件文物从工地到展柜，只用了几个月。\n\n这种速度，在传统博物馆里很难想象。传统博物馆的展品，多是旧藏，研究透了才展；考古博物馆的展品，很多是“刚出锅”的。好处是新鲜，观众看到的是最新的发现；难处是研究跟不上，很多问题还没答案。馆里坦然承认这一点：展签上常常写着“待研究”“初步推断”。\n\n照片墙的最后，是一张工地合影。背景是探方，前景是一群灰头土脸的人，蹲在地上，手里拿着手铲。照片下角写着拍摄日期。你看着这些人，再想想展厅里那些精美的器物：金钗、玉琮、青瓷、青铜剑。它们被挖出来的时候，全是土；是这些人一片一片、一件一件，把它们从土里请出来的。\n\n程义还干了一件不太“学术”的事：开小红书账号，发笔记，给新馆吆喝。一个搞了三十多年学术的考古人，学着年轻人的样子写标题、配图。为什么？因为“普通大众不会去看我们的学术论文”。他说，工地上挖出来的东西，研究透了，放到博物馆去展出、去阐释，考古才有意义。\n\n这面墙看完了，你再回头看展厅，感觉会不一样：那些器物背后，不只是古人，还有一群今天的人。", "chars": 817, "videos": []}, {"id": "h22", "title": "教育探索宫：把铲子交给下一个人", "text": "广场的另一头，是教育探索宫。\n\n门口是一片沙地，划成一个个方格，插着标签、拉着线，摆着小铲子、小刷子、小桶。这是模拟考古发掘现场：把沙子当成地层，把埋进去的陶片、仿制器物当成“文物”，让人蹲下来，一铲一铲地挖、一刷一刷地清、一格一格地记。挖出来的东西要编号、要画图、要填表——跟真考古的流程一样，只是缩小了。\n\n沙地的四个角，各插一块牌子，写着“耕土层”“扰土层”“文化层”“生土”。这四层，是考古队员下铲子前必须先认的。耕土是翻过的，扰土是被后人动过的，文化层才是人住过的，生土是没被人碰过的原始土。认错一层，后面的判断全错。孩子们在这里挖，第一件事不是找东西，是认土。\n\n往里走，是一间教室。桌上摆着陶片、石膏、模具，墙上贴着地层图、器物图。这里做研学：怎么给陶片分类，怎么拼对，怎么从一片口沿推断器形。孩子们在这里待一下午，能弄明白一件事：考古不是“挖宝”，是“记录”。\n\n馆里还有两个小展览，一个在角落，一个在走廊。\n\n角落那个，展的是“磨喝乐”。磨喝乐是宋代的陶玩具，小塑像，有娃娃、有动物、有故事人物。宋代七月初七，街上卖磨喝乐，小孩拿着玩。苏州出土的磨喝乐，个头不大，塑得圆润，脸上还带着笑。一个玩具，能看出宋代的市井生活有多热闹。\n\n走廊那个，展的是苏州各个时期的货币：先秦的蚁鼻钱、布币，秦汉的半两、五铢，唐宋的年号钱，明清的银锭、铜钱。钱币是最诚实的器物：它跟着贸易走，跟着政权走。一个朝代的经济好不好，看钱币的铸造质量就知道。\n\n这两个小展，是馆里特意做的“轻展览”：不占大空间，不讲大道理，就摆几十件东西，让人路过时停一下。\n\n博物馆还参与了一个长三角的研学联盟：苏州考古博物馆、上海崧泽遗址博物馆、杭州玉架山考古博物馆、安徽凌家滩遗址博物馆，四家一起做课程、做线路。四个馆，四种史前文化：崧泽在太湖东岸，良渚在杭州湾，凌家滩在巢湖边上，吴越在苏州。一条线走下来，能看明白长江下游的文明不是各自孤立的，它们互相看得见：玉器的形制、陶器的纹样、墓葬的规矩，都有你来我往的痕迹。\n\n设计这座馆的程泰宁院士说过一句话：“最好的博物馆不是告诉观众答案，而是提出问题。”你在这座馆里走一圈，会带走很多问题：为什么苏州的城两千年没挪窝？为什么良渚人要花那么大力气雕玉？为什么一只高丽青瓷碗会落在太仓？这些问题没有标准答案，但每一个都能让你再回来一次。\n\n从教育探索宫出来，天光从下沉广场的上方落下来。你可以蹲在沙地边上，抓一把沙土，让它从指缝里漏下去。土是凉的，细的，和展厅里那面十二米高的夯土墙，是同一种质地。", "chars": 1042, "videos": []}], "target": 22000, "total": 22255};
const PLAT = {bilibili:'B站',xiaohongshu:'小红书',douyin:'抖音',kuaishou:'快手',shipinhao:'视频号',official:'官方',other:'视频'};
const route = document.getElementById('route');
const reader = document.getElementById('reader');
const rtitle = document.getElementById('rtitle');
const rmeta = document.getElementById('rmeta');
const rbody = document.getElementById('rbody');
const rplay = document.getElementById('rplay');
const rstop = document.getElementById('rstop');
let current = 0;
let speechNo = null;
let paused = false;
let chunks = [];
let idx = 0;
let pausedAt = 0;
let cancelled = false;
let retryTimer = 0;

function partsOf(stop){
  const key = (stop.section || stop.label || '').replace(/\s+/g,'');
  const all = DATA.sections.filter(s => !key || s.title.replace(/\s+/g,'').includes(key));
  if (all.length) return all;
  const label = (stop.label || '').replace(/\s+/g,'');
  return DATA.sections.filter(s => s.title.replace(/\s+/g,'').includes(label));
}
function chunksOf(text){
  const clean = String(text||'').replace(/\s+/g,' ').trim();
  const parts = clean.split(/(?<=[。！？；!?;])/);
  const out = []; let buf = '';
  for (const p of parts){ if ((buf+p).length>110){ if(buf) out.push(buf); buf=p; } else buf+=p; }
  if (buf) out.push(buf);
  return out.filter(s => s.trim().length>1);
}
function hardReset(){
  try { if (typeof speechSynthesis !== 'undefined'){ speechSynthesis.resume(); speechSynthesis.cancel(); } } catch(e){}
}
function stopAll(){
  cancelled = true;
  clearTimeout(retryTimer);
  chunks = []; idx = 0; pausedAt = 0;
  speechNo = null; paused = false;
  hardReset();
  renderRoute(); updateReaderButton();
}
function speakFrom(start){
  cancelled = false;
  idx = start;
  const next = () => {
    if (cancelled) return;
    if (idx >= chunks.length){
      speechNo = null; paused = false;
      renderRoute(); updateReaderButton();
      return;
    }
    const u = new SpeechSynthesisUtterance(chunks[idx]);
    u.lang = 'zh-CN'; u.rate = 1; u.pitch = 1;
    u.onend = () => { if (cancelled) return; idx++; next(); };
    u.onerror = () => { if (cancelled) return; idx++; next(); };
    try { speechSynthesis.speak(u); } catch(e){}
  };
  setTimeout(next, 200);
  clearTimeout(retryTimer);
  retryTimer = setTimeout(() => {
    if (cancelled || paused) return;
    if (!speechSynthesis.speaking && !speechSynthesis.pending){
      hardReset();
      setTimeout(next, 250);
    }
  }, 1200);
}
function playStop(stop){
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance !== 'function') return;
  stopAll();
  chunks = partsOf(stop).flatMap(p => chunksOf(p.text));
  if (!chunks.length) return;
  speechNo = stop.no;
  paused = false;
  pausedAt = 0;
  renderRoute(); updateReaderButton();
  hardReset();
  setTimeout(() => speakFrom(0), 120);
}
function toggleStop(stop){
  if (speechNo === stop.no){
    if (!paused){
      paused = true;
      pausedAt = idx;
      cancelled = true;
      clearTimeout(retryTimer);
      hardReset();
      renderRoute(); updateReaderButton();
    } else {
      paused = false;
      renderRoute(); updateReaderButton();
      hardReset();
      setTimeout(() => speakFrom(pausedAt), 250);
    }
    return;
  }
  playStop(stop);
}
function updateReaderButton(){
  const stop = DATA.stops[current];
  const on = stop && speechNo === stop.no;
  rplay.textContent = on ? (paused ? '▶ 继续' : '⏸ 暂停') : '▶ 朗读';
  rplay.classList.toggle('primary', !on);
  rstop.style.display = on ? '' : 'none';
  const status = on ? (paused ? '已暂停' : '朗读中') : '';
  const meta = rmeta.dataset.base || '';
  rmeta.textContent = status ? meta + ' · ' + status : meta;
}
function fmt(n){ return Number(n||0).toLocaleString('zh-CN'); }
function renderRoute(){
  const floors = [];
  for (const s of DATA.stops){
    const f = s.floor || '';
    if (!floors.length || floors[floors.length-1].f !== f) floors.push({f, items:[]});
    floors[floors.length-1].items.push(s);
  }
  route.innerHTML = '';
  floors.forEach(group => {
    if (group.f){
      const d = document.createElement('div');
      d.className = 'floor'; d.textContent = group.f; route.appendChild(d);
    }
    group.items.forEach(stop => {
      const i = DATA.stops.indexOf(stop);
      const parts = partsOf(stop);
      const vids = parts.reduce((n,p)=>n+(p.videos||[]).length,0);
      const row = document.createElement('div');
      row.className = 'stop' + (i===current ? ' active':'');
      row.innerHTML = '<span class="num">'+stop.no+'</span>'
        + '<span class="body"><span class="name"></span><span class="note"></span></span>'
        + (vids ? '<span class="v">▶ '+vids+'</span>' : '')
        + '<button type="button" class="play'+(speechNo===stop.no?' on':'')+'" aria-label="播放">'+(speechNo===stop.no&&!paused?'⏸':'▶')+'</button>';
      row.querySelector('.name').textContent = stop.label;
      row.querySelector('.note').textContent = stop.note || '';
      row.addEventListener('click', () => openStop(i));
      row.querySelector('.play').addEventListener('click', e => { e.stopPropagation(); current=i; toggleStop(stop); });
      route.appendChild(row);
    });
  });
}
function openStop(i){
  current = i;
  const stop = DATA.stops[i];
  const parts = partsOf(stop);
  const chars = parts.reduce((n,p)=>n+(p.chars||0),0);
  const vids = parts.reduce((n,p)=>n+(p.videos||[]).length,0);
  rtitle.textContent = stop.label;
  rmeta.dataset.base = fmt(chars)+' 字 · '+parts.length+' 段'+(vids?' · '+vids+' 视频':'');
  rmeta.textContent = rmeta.dataset.base;
  rbody.innerHTML = '';
  parts.forEach(part => {
    const wrap = document.createElement('article'); wrap.className='part';
    const h = document.createElement('h3'); h.textContent = part.title; wrap.appendChild(h);
    const t = document.createElement('div'); t.className='text'; t.textContent = part.text; wrap.appendChild(t);
    if ((part.videos||[]).length){
      const vs = document.createElement('div'); vs.className='videos';
      part.videos.forEach(v => {
        const a = document.createElement('a'); a.className='vlink'; a.href=v.url; a.target='_blank'; a.rel='noreferrer noopener';
        a.innerHTML = '<span class="plat">'+(PLAT[v.platform]||'视频')+'</span><span class="t"></span>';
        a.querySelector('.t').textContent = v.title || v.url;
        vs.appendChild(a);
      });
      wrap.appendChild(vs);
    }
    rbody.appendChild(wrap);
  });
  reader.classList.add('open');
  rbody.scrollTop = 0;
  updateReaderButton();
  renderRoute();
}
function closeReader(){ reader.classList.remove('open'); stopAll(); }
document.getElementById('back').addEventListener('click', closeReader);
rplay.addEventListener('click', () => { const s = DATA.stops[current]; if (s) toggleStop(s); });
rstop.addEventListener('click', stopAll);
document.getElementById('rcopy').addEventListener('click', () => {
  const stop = DATA.stops[current];
  const text = partsOf(stop).map(p => p.title+'\n'+p.text).join('\n\n');
  navigator.clipboard && navigator.clipboard.writeText(text).then(() => {
    const b = document.getElementById('rcopy'); const old=b.textContent; b.textContent='已复制'; setTimeout(()=>b.textContent=old,1200);
  });
});
renderRoute();
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
